name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check repo map
        run: make check-repo-map
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: Test
        working-directory: backend
        run: go test ./... -count=1
      - name: Vet
        working-directory: backend
        run: go vet ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npx tsc -b
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render
        run: make helm-check

  srt-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Build verified sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap gcc libc6-dev libseccomp-dev ripgrep socat
          SRT_BIN="$(./hack/install-srt.sh "$RUNNER_TEMP/srt-0.0.70")"
          test -x "$SRT_BIN"
          "$SRT_BIN" --help >/dev/null
          node -e "if (require('$RUNNER_TEMP/srt-0.0.70/node_modules/@anthropic-ai/sandbox-runtime/package.json').version !== '0.0.70') process.exit(1)"
          grep -Fxq 'installer_schema=2' "$RUNNER_TEMP/srt-0.0.70/INSTALL_PROVENANCE"
          test -x "$RUNNER_TEMP/srt-0.0.70/node_modules/@anthropic-ai/sandbox-runtime/vendor/seccomp/x64/apply-seccomp"
          cd backend
          SRT_TEST_BIN="$SRT_BIN" go test ./internal/runtime -run '^TestSRTSandboxHostileIntegration$' -count=1
