name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check repo map
        run: make check-repo-map
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: Test
        working-directory: backend
        run: go test ./... -count=1
      - name: Vet
        working-directory: backend
        run: go vet ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npx tsc -b
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render
        run: make helm-check
      - name: Test platform chart lifecycle in kind
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install sigs.k8s.io/kind@v0.31.0
          PATH="$RUNNER_TEMP/bin:$PATH" bash deploy/helm/aster-platform/test-kind.sh

  remote-fixer-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --target remote-fixer-runtime -t aster/remote-fixer:ci .
      - name: Test git-only runtime
        run: hack/test-remote-fixer-image.sh aster/remote-fixer:ci

  agent-sandbox-fix-executor-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release target
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          image_tag="sha-${SOURCE_REVISION::7}"
          docker build --platform linux/amd64 \
            --target agent-sandbox-fix-executor \
            --build-arg VERSION=ci \
            --build-arg COMMIT="$SOURCE_REVISION" \
            --build-arg IMAGE_TAG="$image_tag" \
            -t aster/agent-sandbox-fix-executor:ci .
      - name: Test credential-free runtime
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          image_tag="sha-${SOURCE_REVISION::7}"
          hack/test-agent-sandbox-fix-image.sh \
            aster/agent-sandbox-fix-executor:ci \
            ci "$SOURCE_REVISION" "$image_tag"

  agent-sandbox-analysis-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build executor
        run: docker build --target agent-sandbox-analysis-executor -t aster/agent-sandbox-analysis-executor:ci .
      - name: Build stager
        run: docker build --target agent-sandbox-analysis-stager -t aster/agent-sandbox-analysis-stager:ci .
      - name: Test credential-free runtimes
        run: hack/test-agent-sandbox-analysis-images.sh aster/agent-sandbox-analysis-executor:ci aster/agent-sandbox-analysis-stager:ci

  agent-sandbox-critic-executor-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --target agent-sandbox-critic-executor -t aster/agent-sandbox-critic-executor:ci .
      - name: Test credential-free runtime
        run: hack/test-agent-sandbox-critic-image.sh aster/agent-sandbox-critic-executor:ci
