name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check repo map
        run: make check-repo-map
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: Test
        working-directory: backend
        run: go test ./... -count=1
      - name: Vet
        working-directory: backend
        run: go vet ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npx tsc -b
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render
        run: make helm-check

  remote-fixer-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --target remote-fixer-runtime -t prow-ai-dashboard/remote-fixer:ci .
      - name: Test git-only runtime
        run: hack/test-remote-fixer-image.sh prow-ai-dashboard/remote-fixer:ci

  agent-sandbox-critic-executor-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --target agent-sandbox-critic-executor -t prow-ai-dashboard/agent-sandbox-critic-executor:ci .
      - name: Test credential-free runtime
        run: hack/test-agent-sandbox-critic-image.sh prow-ai-dashboard/agent-sandbox-critic-executor:ci
