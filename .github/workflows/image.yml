name: Image

# Release tags publish the exact immutable application, remote-fixer, and Agent
# Sandbox Fix executor identities. A manual run publishes those same three
# targets under a commit-addressed sha-<short> tag, so a branch can be deployed
# without cutting a release. The analysis executor and stager are opt-in
# manual targets.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_analysis_images:
        description: Publish the experimental analysis executor and stager images
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  tag-pair:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure paired release tags
        env:
          TAG: ${{ github.ref_name }}
        run: RELEASE_TAGS_ONLY=true hack/publish-release.sh

  image:
    needs: tag-pair
    if: >-
      always() &&
      (needs.tag-pair.result == 'success' || needs.tag-pair.result == 'skipped') &&
      (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.title=Aster
          tags: |
            type=semver,pattern={{raw}}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build identity
        id: build_identity
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "image_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            IMAGE_TAG=${{ steps.build_identity.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  remote-fixer-image:
    needs: tag-pair
    if: >-
      always() &&
      (needs.tag-pair.result == 'success' || needs.tag-pair.result == 'skipped') &&
      (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/remote-fixer
          labels: |
            org.opencontainers.image.title=Aster Remote Fixer
          tags: |
            type=semver,pattern={{raw}}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build identity
        id: build_identity
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "image_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: remote-fixer-runtime
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            IMAGE_TAG=${{ steps.build_identity.outputs.image_tag }}
          cache-from: type=gha,scope=remote-fixer
          cache-to: type=gha,mode=max,scope=remote-fixer

  agent-sandbox-fix-executor-image:
    needs: tag-pair
    if: >-
      always() &&
      (needs.tag-pair.result == 'success' || needs.tag-pair.result == 'skipped') &&
      (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/agent-sandbox-fix-executor
          labels: |
            org.opencontainers.image.title=Aster Agent Sandbox Fix Executor
          tags: |
            type=semver,pattern={{raw}}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build identity
        id: build_identity
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "image_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release target
        run: |
          docker build --platform linux/amd64 \
            --target agent-sandbox-fix-executor \
            --build-arg VERSION=${{ github.ref_name }} \
            --build-arg COMMIT=${{ github.sha }} \
            --build-arg IMAGE_TAG=${{ steps.build_identity.outputs.image_tag }} \
            -t aster/agent-sandbox-fix-executor:release-test .

      - name: Test release target
        run: |
          hack/test-agent-sandbox-fix-image.sh \
            aster/agent-sandbox-fix-executor:release-test \
            "${{ github.ref_name }}" \
            "${{ github.sha }}" \
            "${{ steps.build_identity.outputs.image_tag }}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: agent-sandbox-fix-executor
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            IMAGE_TAG=${{ steps.build_identity.outputs.image_tag }}
          cache-from: type=gha,scope=agent-sandbox-fix-executor
          cache-to: type=gha,mode=max,scope=agent-sandbox-fix-executor

  agent-sandbox-analysis-executor-image:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_analysis_images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/agent-sandbox-analysis-executor
          labels: |
            org.opencontainers.image.title=Aster Agent Sandbox Analysis Executor
          tags: |
            type=sha,prefix=sha-

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: agent-sandbox-analysis-executor
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            IMAGE_TAG=sha-${{ github.sha }}
          cache-from: type=gha,scope=agent-sandbox-analysis-executor
          cache-to: type=gha,mode=max,scope=agent-sandbox-analysis-executor

  agent-sandbox-analysis-stager-image:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_analysis_images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/agent-sandbox-analysis-stager
          labels: |
            org.opencontainers.image.title=Aster Agent Sandbox Analysis Stager
          tags: |
            type=sha,prefix=sha-

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: agent-sandbox-analysis-stager
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            IMAGE_TAG=sha-${{ github.sha }}
          cache-from: type=gha,scope=agent-sandbox-analysis-stager
          cache-to: type=gha,mode=max,scope=agent-sandbox-analysis-stager
