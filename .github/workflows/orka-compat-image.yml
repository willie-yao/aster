name: Orka compatibility worker

on:
  pull_request:
    paths:
      - ".github/workflows/orka-compat-image.yml"
      - "experimental/orka/worker-patches/**"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - ".github/workflows/orka-compat-image.yml"
      - "experimental/orka/worker-patches/**"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orka-compat-worker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.compat.outputs.image_tag }}
      orka_commit: ${{ steps.compat.outputs.orka_commit }}
      patch_sha256: ${{ steps.compat.outputs.patch_sha256 }}
      dashboard_commit: ${{ steps.compat.outputs.dashboard_commit }}
    steps:
      - name: Check out dashboard
        uses: actions/checkout@v4

      - name: Validate compatibility scripts
        run: make orka-compat-check

      - name: Read compatibility metadata
        id: compat
        run: |
          experimental/orka/worker-patches/compat-worker.sh metadata "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out pinned Orka
        uses: actions/checkout@v4
        with:
          repository: orka-agents/orka
          ref: ${{ steps.compat.outputs.orka_commit }}
          path: _orka
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: _orka/go.mod
          cache-dependency-path: _orka/go.sum

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Verify Orka worker image overrides
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}/orka-ai-worker
          IMAGE_TAG: ${{ steps.compat.outputs.image_tag }}
        run: |
          helm template orka _orka/charts/orka \
            --set-string workers.ai.image.repository="$IMAGE_REPOSITORY" \
            --set-string workers.ai.image.tag="$IMAGE_TAG" \
            | grep -Fq -- "--ai-worker-image=$IMAGE_REPOSITORY:$IMAGE_TAG"
          digest=$(printf 'a%.0s' {1..64})
          helm template orka _orka/charts/orka \
            --set-string workers.ai.image.repository="$IMAGE_REPOSITORY@sha256" \
            --set-string workers.ai.image.tag="$digest" \
            | grep -Fq -- "--ai-worker-image=$IMAGE_REPOSITORY@sha256:$digest"

      - name: Apply compatibility patch
        run: experimental/orka/worker-patches/compat-worker.sh prepare _orka

      - name: Test patched worker
        run: experimental/orka/worker-patches/compat-worker.sh test _orka

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build compatibility image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: _orka
          file: _orka/workers/ai/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/${{ github.repository }}/orka-ai-worker:${{ steps.compat.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.compat.outputs.dashboard_commit }}
            io.orka.compatibility.revision=${{ steps.compat.outputs.orka_commit }}
            io.orka.compatibility.patch-sha256=${{ steps.compat.outputs.patch_sha256 }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=orka-compat-worker

      - name: Inspect compatibility image
        env:
          IMAGE: ghcr.io/${{ github.repository }}/orka-ai-worker:${{ steps.compat.outputs.image_tag }}
        run: |
          docker image inspect "$IMAGE" --format '{{json .}}' > image-inspect.json
          jq -e '
            .Os == "linux" and
            .Architecture == "amd64" and
            .Config.User == "65532:65532" and
            .Config.Entrypoint == ["/worker"]
          ' image-inspect.json > /dev/null

      - name: Record validation coordinates
        env:
          IMAGE: ghcr.io/${{ github.repository }}/orka-ai-worker:${{ steps.compat.outputs.image_tag }}
          LOCAL_DIGEST: ${{ steps.build.outputs.digest }}
          ORKA_COMMIT: ${{ steps.compat.outputs.orka_commit }}
          PATCH_SHA256: ${{ steps.compat.outputs.patch_sha256 }}
          DASHBOARD_COMMIT: ${{ steps.compat.outputs.dashboard_commit }}
        run: |
          jq -n \
            --arg image "$IMAGE" \
            --arg localDigest "$LOCAL_DIGEST" \
            --arg orkaCommit "$ORKA_COMMIT" \
            --arg patchSHA256 "$PATCH_SHA256" \
            --arg dashboardCommit "$DASHBOARD_COMMIT" \
            '{image:$image,local_digest:$localDigest,orka_commit:$orkaCommit,patch_sha256:$patchSHA256,dashboard_commit:$dashboardCommit,published:false}' \
            > orka-compat-validation.json
          {
            echo "### Orka compatibility worker validation"
            echo
            echo "- Image tag: \`$IMAGE\`"
            echo "- Local build digest: \`${LOCAL_DIGEST:-unavailable}\`"
            echo "- Orka commit: \`$ORKA_COMMIT\`"
            echo "- Dashboard commit: \`$DASHBOARD_COMMIT\`"
            echo "- Patch SHA-256: \`$PATCH_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation record
        uses: actions/upload-artifact@v4
        with:
          name: orka-compat-validation-${{ steps.compat.outputs.dashboard_commit }}
          path: orka-compat-validation.json
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out dashboard
        uses: actions/checkout@v4

      - name: Check out pinned Orka
        uses: actions/checkout@v4
        with:
          repository: orka-agents/orka
          ref: ${{ needs.validate.outputs.orka_commit }}
          path: _orka
          fetch-depth: 1

      - name: Apply compatibility patch
        run: experimental/orka/worker-patches/compat-worker.sh prepare _orka

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect existing immutable tag
        id: existing
        env:
          IMAGE: ghcr.io/${{ github.repository }}/orka-ai-worker:${{ needs.validate.outputs.image_tag }}
          DASHBOARD_COMMIT: ${{ needs.validate.outputs.dashboard_commit }}
        run: |
          set +e
          experimental/orka/worker-patches/compat-worker.sh \
            inspect-published "$IMAGE" "$DASHBOARD_COMMIT" > existing-image.json
          rc=$?
          set -e
          case $rc in
            0)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "digest=$(jq -r '.digest' existing-image.json)" >> "$GITHUB_OUTPUT"
              ;;
            10)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit "$rc"
              ;;
          esac

      - name: Build and push compatibility image
        if: steps.existing.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: _orka
          file: _orka/workers/ai/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/orka-ai-worker:${{ needs.validate.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.dashboard_commit }}
            io.orka.compatibility.revision=${{ needs.validate.outputs.orka_commit }}
            io.orka.compatibility.patch-sha256=${{ needs.validate.outputs.patch_sha256 }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=orka-compat-worker
          cache-to: type=gha,mode=max,scope=orka-compat-worker

      - name: Resolve published digest
        id: coordinates
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          digest=${EXISTING_DIGEST:-$BUILT_DIGEST}
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "invalid published digest: $digest" >&2
            exit 1
          }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Record published image
        env:
          IMAGE: ghcr.io/${{ github.repository }}/orka-ai-worker:${{ needs.validate.outputs.image_tag }}
          DIGEST: ${{ steps.coordinates.outputs.digest }}
          ORKA_COMMIT: ${{ needs.validate.outputs.orka_commit }}
          PATCH_SHA256: ${{ needs.validate.outputs.patch_sha256 }}
          DASHBOARD_COMMIT: ${{ needs.validate.outputs.dashboard_commit }}
          RECOVERED: ${{ steps.existing.outputs.exists }}
        run: |
          jq -n \
            --arg image "$IMAGE" \
            --arg digest "$DIGEST" \
            --arg orkaCommit "$ORKA_COMMIT" \
            --arg patchSHA256 "$PATCH_SHA256" \
            --arg dashboardCommit "$DASHBOARD_COMMIT" \
            --arg recovered "$RECOVERED" \
            '{image:$image,digest:$digest,orka_commit:$orkaCommit,patch_sha256:$patchSHA256,dashboard_commit:$dashboardCommit,published:true,recovered:($recovered == "true")}' \
            > orka-compat-image.json
          {
            echo "### Published Orka compatibility worker"
            echo
            echo "- Image: \`$IMAGE\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Orka commit: \`$ORKA_COMMIT\`"
            echo "- Dashboard commit: \`$DASHBOARD_COMMIT\`"
            echo "- Patch SHA-256: \`$PATCH_SHA256\`"
            echo "- Recovered existing tag: \`$RECOVERED\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compatibility record
        uses: actions/upload-artifact@v4
        with:
          name: orka-compat-image-${{ needs.validate.outputs.dashboard_commit }}
          path: orka-compat-image.json
          if-no-files-found: error
