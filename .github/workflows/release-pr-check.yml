name: Release PR preflight

# A new indexed changelog file is release intent, but merging never tags on
# its own. This read-only check has no App credentials or publishing token.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test release policy and PR detection
        run: |
          python3 hack/release_policy.py --self-test
          python3 hack/check_release_intent.py --self-test

      - name: Validate new indexed release notes
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 hack/check_release_intent.py --base-ref "$BASE_REF" --base-sha "$BASE_SHA"
