name: Release

# Cuts a release when a full semantic-version tag is pushed. Moving major
# aliases such as v1 do not match this trigger.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-publication
  queue: max
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # Provenance signs via Sigstore with an OIDC token and records the
      # attestation against the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log Docker in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log Helm in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish charts and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          GOTOOLCHAIN: local
          RELEASE_CHECKSUMS_OUT: ${{ runner.temp }}/SHA256SUMS
        run: hack/publish-release.sh

      # Attests every asset named in the published SHA256SUMS: both charts, the
      # four CLI binaries, the source archive, and the release manifest. A
      # consumer can then verify where a downloaded binary was built with
      # `gh attestation verify <file> --repo ${{ github.repository }}` instead of
      # trusting a checksum they recorded by hand.
      - name: Attest release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ${{ runner.temp }}/SHA256SUMS
