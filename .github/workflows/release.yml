name: Release

# Cuts a release when a semver tag is pushed. The tag glob requires a full
# MAJOR.MINOR.PATCH so the moving `vMAJOR` alias this workflow pushes (e.g. `v1`)
# does not re-trigger it. (The default GITHUB_TOKEN also does not retrigger
# workflows, so this is belt-and-suspenders.)
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # Re-run the full CI gate against the tagged commit before releasing.
  gate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release and move major alias
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A pre-release tag carries a suffix (e.g. v1.0.0-beta.1, v1.0.0-rc.1).
          case "$TAG" in
            *-*)
              echo "Pre-release $TAG"
              gh release create "$TAG" --title "$TAG" --generate-notes --prerelease
              ;;
            *)
              echo "Stable release $TAG"
              gh release create "$TAG" --title "$TAG" --generate-notes
              # Fast-forward the major alias (vMAJOR) to this commit so consumers
              # pinning @vMAJOR get the latest stable patch/minor.
              MAJOR="$(printf '%s' "$TAG" | sed -E 's/^(v[0-9]+).*/\1/')"
              echo "Moving alias $MAJOR -> $TAG"
              git tag -f "$MAJOR" "$TAG"
              git push origin -f "refs/tags/$MAJOR"
              ;;
          esac

  # Publish the Helm chart for the Kubernetes-native deploy mode: package it at
  # the release version (pinning its image to the released tag), push it to GHCR
  # as an OCI artifact, and attach the .tgz to the release. Runs after `release`
  # so the release exists for the asset upload. The container image itself is
  # built by image.yml, which the same tag triggers in parallel.
  publish-chart:
    needs: [gate, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package, push, and attach the chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Chart versions must be strict SemVer with no leading v; appVersion
          # is the released image tag (the chart defaults image.tag to it).
          CHART_VERSION="${TAG#v}"
          helm lint deploy/helm/prow-ai-dashboard
          helm package deploy/helm/prow-ai-dashboard \
            --version "$CHART_VERSION" --app-version "$TAG"
          PKG="prow-ai-dashboard-${CHART_VERSION}.tgz"
          # A charts/ sub-namespace avoids colliding with the image package,
          # which shares the prow-ai-dashboard name under the owner root.
          helm push "$PKG" "oci://ghcr.io/${{ github.repository_owner }}/charts"
          gh release upload "$TAG" "$PKG" --clobber
