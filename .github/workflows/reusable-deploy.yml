name: Reusable Deploy

# Reusable workflow that builds and deploys an Aster dashboard for a single
# project. Consumer repos call this from a workflow in their own repo and
# point at the directory in their checkout that holds project.yaml plus
# prompts/system.md. The engine repo is checked out separately for the Go
# and frontend code.
#
# Example consumer workflow:
#   jobs:
#     deploy:
#       uses: willie-yao/aster/.github/workflows/reusable-deploy.yml@main
#       with:
#         # Optional: keep private or preview model identifiers and private
#         # endpoint URLs out of the public project.yaml by sourcing them
#         # from repo variables (`gh variable set AI_MODEL ...`) instead.
#         # The project.yaml `ai.model` / `ai.endpoint` fields still win
#         # if set.
#         ai-model: ${{ vars.AI_MODEL }}
#         ai-endpoint: ${{ vars.AI_ENDPOINT }}
#         ai-reasoning-effort: ${{ vars.AI_REASONING_EFFORT }}
#         ai-context-window-tokens: ${{ vars.AI_CONTEXT_WINDOW_TOKENS }}
#       secrets:
#         AI_TOKEN: ${{ secrets.AI_TOKEN }}

on:
  workflow_call:
    inputs:
      project_dir:
        description: "Directory in the caller repo containing project.yaml and prompts/system.md. Defaults to the repo root."
        required: false
        type: string
        default: "."
      builds:
        description: "Number of recent builds to fetch per job."
        required: false
        type: number
        default: 8
      workers:
        description: "Number of parallel workers in the fetcher."
        required: false
        type: number
        default: 5
      fetch-timeout:
        description: "Fetcher timeout. The long default gives a cold AI pass room to finish; lower it for fast providers."
        required: false
        type: string
        default: 150m
      ai:
        description: "Whether to run AI analysis on failures."
        required: false
        type: boolean
        default: true
      ai-api:
        description: "Optional. AI API: chat_completions (default) or responses. The yaml ai.api field wins if set."
        required: false
        type: string
        default: ""
      ai-model:
        description: "Optional. AI model identifier passed to the fetcher as AI_MODEL. Use this with a repo variable (vars.AI_MODEL) to keep private or preview model labels out of the public project.yaml. The yaml ai.model field wins if set."
        required: false
        type: string
        default: ""
      ai-endpoint:
        description: "Optional. URL for the selected AI API, passed to the fetcher as AI_ENDPOINT. Use this with a repo variable (vars.AI_ENDPOINT) to keep private endpoint URLs out of the public project.yaml. The yaml ai.endpoint field wins if set."
        required: false
        type: string
        default: ""
      ai-reasoning-effort:
        description: "Optional. Provider reasoning effort passed as AI_REASONING_EFFORT. Empty uses the provider default; accepted values are none, low, medium, high, xhigh, and max."
        required: false
        type: string
        default: ""
      ai-context-window-tokens:
        description: "Optional. Total provider context window passed to the fetcher as AI_CONTEXT_WINDOW_TOKENS. Set only with independent endpoint evidence; it overrides /v1/models metadata."
        required: false
        type: string
        default: ""
      ai-cache-generation:
        description: "Optional. Reversible AI cache namespace passed as AI_CACHE_GENERATION. Empty preserves existing cache keys."
        required: false
        type: string
        default: ""
      include-presubmits:
        description: "Include presubmit jobs in addition to periodics. ORed with project.yaml source.include_presubmits — setting either to true enables presubmits."
        required: false
        type: boolean
        default: false
      skip-fetch:
        description: "Skip the data fetcher and publish pre-fetched data from <project_dir>/data/ in the consumer repo. Useful when the AI endpoint is unreachable from GitHub-hosted runners (e.g. a private cluster service) — run the fetcher locally, commit data/, set this true."
        required: false
        type: boolean
        default: false
      runs-on:
        description: "Runner label for the deploy job. Accepts a single label (e.g. 'ubuntu-latest') or a JSON-encoded array (e.g. '[\"self-hosted\", \"qwen-cluster\"]') for multi-label self-hosted runners with cluster-internal connectivity."
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      AI_TOKEN:
        description: "Token used to call the chat completions endpoint."
        required: false
      EMAIL_SMTP_PASSWORD:
        description: "SMTP password for email notifications when notifications.email is enabled and smtp.username is set."
        required: false
      ISSUE_TOKEN:
        description: "GitHub token (PAT or App token) with issues:write on the target repo, for auto-filing issues when issues.enabled is set. Optional; omit to disable."
        required: false
      FIX_TOKEN:
        description: "GitHub PAT of a CLA-signed identity that can fork the source repo and open PRs, for agent-proposed fix PRs when ai.fix_prs.enabled is set. Optional; omit to disable. See docs/fix-prs.md."
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    # Prevent overlapping fetches from racing cache writes or external side effects.
    # Scope by caller repository and project directory so independent dashboards can run.
    concurrency:
      group: prow-ai-dashboard-${{ github.repository }}-${{ inputs.project_dir }}
      cancel-in-progress: false
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@v4
        with:
          path: consumer

      - name: Resolve reusable workflow identity
        id: engine-identity
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if ! echo "$WORKFLOW_REPOSITORY" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "::error::Reusable workflow repository is unavailable or invalid"
            exit 1
          fi
          if ! echo "$WORKFLOW_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "::error::Reusable workflow SHA is unavailable or invalid"
            exit 1
          fi
          if [ -z "$WORKFLOW_REF" ]; then
            echo "::error::Reusable workflow ref is unavailable"
            exit 1
          fi
          NORMALIZED_SHA="$(printf '%s' "$WORKFLOW_SHA" | tr '[:upper:]' '[:lower:]')"
          {
            echo "repository=$WORKFLOW_REPOSITORY"
            echo "ref=$WORKFLOW_REF"
            echo "sha=$NORMALIZED_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved reusable workflow $WORKFLOW_REF at $NORMALIZED_SHA"

      - name: Checkout engine repo
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.engine-identity.outputs.repository }}
          # Build the engine code from the exact commit of the reusable workflow
          # the consumer pinned (uses:@<ref>), so the pinned ref controls both
          # the pipeline and the code with no separate engine-ref knob.
          ref: ${{ steps.engine-identity.outputs.sha }}
          fetch-tags: true
          path: engine

      - name: Verify engine checkout
        id: engine-checkout
        working-directory: engine
        env:
          EXPECTED_SHA: ${{ steps.engine-identity.outputs.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Engine checkout resolved to $ACTUAL_SHA, expected $EXPECTED_SHA"
            exit 1
          fi
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "Verified engine checkout at $ACTUAL_SHA"

      - name: Resolve project paths and base path
        id: cfg
        run: |
          CONFIG_PATH="$GITHUB_WORKSPACE/consumer/${{ inputs.project_dir }}/project.yaml"
          if [ ! -f "$CONFIG_PATH" ]; then
            echo "::error::project.yaml not found at $CONFIG_PATH"
            exit 1
          fi
          # Extract branding.base_path. Strip surrounding quotes.
          BASE_PATH="$(awk '
            $1 == "branding:" { in_b=1; next }
            in_b && $1 == "base_path:" {
              sub(/^[ \t]*base_path:[ \t]*/, "", $0)
              gsub(/^["'"'"']|["'"'"']$/, "", $0)
              print $0
              exit
            }
          ' "$CONFIG_PATH")"
          if [ -z "$BASE_PATH" ]; then
            echo "::error::branding.base_path missing in $CONFIG_PATH"
            exit 1
          fi
          # Ensure trailing slash for vite base.
          case "$BASE_PATH" in
            */) ;;
            *) BASE_PATH="${BASE_PATH}/";;
          esac
          echo "base_path=$BASE_PATH" >> "$GITHUB_OUTPUT"
          PROJECT_DIR_ABS="$GITHUB_WORKSPACE/consumer/${{ inputs.project_dir }}"
          echo "project_dir_abs=$PROJECT_DIR_ABS" >> "$GITHUB_OUTPUT"
          # Stable slug used for cache keys (replace slashes/dots with dashes).
          SLUG="$(echo "${{ inputs.project_dir }}" | tr '/.' '--' | sed 's/^-*//; s/-*$//')"
          [ -z "$SLUG" ] && SLUG="root"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Resolved project_dir=$PROJECT_DIR_ABS base_path=$BASE_PATH slug=$SLUG"

      # --- Go data fetcher (skipped when skip-fetch=true) ---
      - uses: actions/setup-go@v5
        if: ${{ !inputs.skip-fetch }}
        with:
          go-version-file: engine/backend/go.mod
          cache-dependency-path: engine/backend/go.sum

      - name: Build Aster data command
        if: ${{ !inputs.skip-fetch }}
        working-directory: engine/backend
        run: |
          # Embed the engine version. Pick the full MAJOR.MINOR.PATCH tag at the
          # built commit (ignore the moving vMAJOR alias, which would understate
          # the version), else dev-<sha> for branch or @main builds (which the
          # version check then skips).
          VERSION="$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          [ -z "$VERSION" ] && VERSION="dev-$(git rev-parse --short HEAD)"
          COMMIT="$(git rev-parse HEAD)"
          echo "Building fetcher version $VERSION at $COMMIT"
          go build -ldflags "-X main.version=$VERSION -X main.commit=$COMMIT -X main.imageTag=github-pages" -o "$GITHUB_WORKSPACE/aster" ./cmd/aster/

      # Restore cached data (job JSON + AI cache) so we only fetch new builds.
      - name: Restore data cache
        if: ${{ !inputs.skip-fetch }}
        uses: actions/cache/restore@v4
        with:
          path: engine/frontend/public/data
          key: data-cache-${{ steps.cfg.outputs.slug }}-${{ github.run_id }}
          restore-keys: data-cache-${{ steps.cfg.outputs.slug }}-

      - name: Fetch test data
        if: ${{ !inputs.skip-fetch }}
        env:
          AI_TOKEN: ${{ secrets.AI_TOKEN }}
          AI_API: ${{ inputs.ai-api }}
          AI_MODEL: ${{ inputs.ai-model }}
          AI_ENDPOINT: ${{ inputs.ai-endpoint }}
          AI_REASONING_EFFORT: ${{ inputs.ai-reasoning-effort }}
          AI_CONTEXT_WINDOW_TOKENS: ${{ inputs.ai-context-window-tokens }}
          AI_CACHE_GENERATION: ${{ inputs.ai-cache-generation }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          ISSUE_TOKEN: ${{ secrets.ISSUE_TOKEN }}
          FIX_TOKEN: ${{ secrets.FIX_TOKEN }}
        run: |
          AI_FLAG=""
          if [ "${{ inputs.ai }}" = "true" ]; then
            AI_FLAG="-ai"
          fi
          PRESUBMITS_FLAG=""
          if [ "${{ inputs.include-presubmits }}" = "true" ]; then
            PRESUBMITS_FLAG="-include-presubmits"
          fi
          "$GITHUB_WORKSPACE/aster" \
            -project-dir="${{ steps.cfg.outputs.project_dir_abs }}" \
            -builds=${{ inputs.builds }} \
            -workers=${{ inputs.workers }} \
            -out="$GITHUB_WORKSPACE/engine/frontend/public/data" \
            -timeout=${{ inputs.fetch-timeout }} \
            $AI_FLAG \
            $PRESUBMITS_FLAG

      - name: Save data cache
        if: ${{ !inputs.skip-fetch && always() }}
        uses: actions/cache/save@v4
        with:
          path: engine/frontend/public/data
          key: data-cache-${{ steps.cfg.outputs.slug }}-${{ github.run_id }}

      # --- Pre-fetched data path (skip-fetch=true) ---
      - name: Copy pre-fetched data
        if: ${{ inputs.skip-fetch }}
        run: |
          DATA_SRC="${{ steps.cfg.outputs.project_dir_abs }}/data"
          if [ ! -d "$DATA_SRC" ]; then
            echo "::error::skip-fetch=true but no data/ directory found at $DATA_SRC. Run the fetcher locally and commit the output to <project_dir>/data/ in the consumer repo."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/engine/frontend/public/data"
          cp -r "$DATA_SRC/." "$GITHUB_WORKSPACE/engine/frontend/public/data/"
          echo "Copied pre-fetched data from $DATA_SRC"
          ls -la "$GITHUB_WORKSPACE/engine/frontend/public/data"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: engine/frontend/package-lock.json

      - name: Write public build provenance
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
          WORKFLOW_REPOSITORY: ${{ steps.engine-identity.outputs.repository }}
          WORKFLOW_REF: ${{ steps.engine-identity.outputs.ref }}
          WORKFLOW_SHA: ${{ steps.engine-identity.outputs.sha }}
          ENGINE_COMMIT: ${{ steps.engine-checkout.outputs.sha }}
        run: |
          node <<'JS'
          const fs = require("fs");
          const path = require("path");

          const output = path.join(process.env.GITHUB_WORKSPACE, "engine/frontend/public/data/provenance.json");
          for (const name of [
            "CALLER_REPOSITORY",
            "CALLER_SHA",
            "WORKFLOW_REPOSITORY",
            "WORKFLOW_REF",
            "WORKFLOW_SHA",
            "ENGINE_COMMIT",
          ]) {
            if (!process.env[name]) {
              throw new Error(`${name} is required`);
            }
          }
          if (process.env.WORKFLOW_SHA !== process.env.ENGINE_COMMIT) {
            throw new Error("Reusable workflow and engine commits differ");
          }
          const provenance = {
            version: 1,
            caller_repository: process.env.CALLER_REPOSITORY,
            caller_sha: process.env.CALLER_SHA,
            reusable_workflow_repository: process.env.WORKFLOW_REPOSITORY,
            reusable_workflow_ref: process.env.WORKFLOW_REF,
            reusable_workflow_sha: process.env.WORKFLOW_SHA,
            engine_commit: process.env.ENGINE_COMMIT,
          };
          const manifestPath = path.join(path.dirname(output), "manifest.json");
          if (fs.existsSync(manifestPath)) {
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            const revision = manifest?.discovery?.resolved_test_infra_revision;
            if (revision !== undefined) {
              if (!/^[0-9a-f]{40}$/.test(revision)) {
                throw new Error("manifest resolved test-infra revision is invalid");
              }
              provenance.test_infra_revision = revision;
            }
          }
          fs.mkdirSync(path.dirname(output), {recursive: true});
          fs.writeFileSync(output, JSON.stringify(provenance, null, 2) + "\n");
          console.log(`Wrote ${output}`);
          JS

      # --- React frontend ---
      - name: Install frontend dependencies
        working-directory: engine/frontend
        run: npm ci

      - name: Build frontend
        working-directory: engine/frontend
        env:
          VITE_BASE_PATH: ${{ steps.cfg.outputs.base_path }}
        run: npm run build

      # Keep operational files out of the public site. Vite copies public/data/
      # into dist/data/ at build; strip AI traces, the cache, and side-effect
      # state (they carry operational metadata, never dashboard data). The flat
      # files stay in sync with output.NonPublishedFiles; private status and
      # remediation cache files are hidden in dot-directories.
      - name: Strip non-published data files
        run: |
          d=engine/frontend/dist/data
          [ -d "$d" ] && rm -f "$d"/ai_cache.json "$d"/ai_traces.json \
            "$d"/ai_usage_fetcher.json "$d"/ai_usage_server.json "$d"/issue_state.json \
            "$d"/fix_pr_state.json "$d"/fix_previews.json \
            "$d"/notification_state.json "$d"/remediation_state.json \
            "$d"/remediation_prow_catalog.json "$d"/orka_analysis.json \
            "$d"/action_request_state.json "$d"/action_preview_state.json \
            "$d"/analysis_correction_state.json \
            "$d"/.fetch-status/status.json "$d"/.fetch-status/status.json.tmp-* \
            "$d"/.fetch-status/history.json "$d"/.fetch-status/history.json.tmp-* \
            "$d"/.remediation-investigations/cache.json \
            "$d"/.remediation-investigations/cache.json.tmp-* \
            "$d"/.remediation-investigations/cache.lock || true
          rmdir "$d"/.remediation-investigations 2>/dev/null || true

      # --- Deploy to GitHub Pages ---
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: engine/frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
