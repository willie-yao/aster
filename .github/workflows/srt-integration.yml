name: SRT integration

on:
  pull_request:
    paths:
      - ".github/workflows/srt-integration.yml"
      - "Dockerfile"
      - "hack/build-srt-seccomp.mjs"
      - "hack/install-srt.sh"
      - "backend/internal/runtime/sandbox.go"
      - "backend/internal/runtime/srt_*.go"
  push:
    branches: [main]
    paths:
      - ".github/workflows/srt-integration.yml"
      - "Dockerfile"
      - "hack/build-srt-seccomp.mjs"
      - "hack/install-srt.sh"
      - "backend/internal/runtime/sandbox.go"
      - "backend/internal/runtime/srt_*.go"
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Build verified sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap gcc libc6-dev libseccomp-dev ripgrep socat
          SRT_BIN="$(./hack/install-srt.sh "$RUNNER_TEMP/srt-0.0.70")"
          test -x "$SRT_BIN"
          "$SRT_BIN" --help >/dev/null
          node -e "if (require('$RUNNER_TEMP/srt-0.0.70/node_modules/@anthropic-ai/sandbox-runtime/package.json').version !== '0.0.70') process.exit(1)"
          grep -Fxq 'installer_schema=2' "$RUNNER_TEMP/srt-0.0.70/INSTALL_PROVENANCE"
          test -x "$RUNNER_TEMP/srt-0.0.70/node_modules/@anthropic-ai/sandbox-runtime/vendor/seccomp/x64/apply-seccomp"
          cd backend
          SRT_TEST_BIN="$SRT_BIN" go test ./internal/runtime -run '^TestSRTSandbox(Hostile|Cancellation)Integration$' -count=1
