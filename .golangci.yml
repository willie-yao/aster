version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - text: 'Error return value of `.*(Close|Remove|RemoveAll|Fprint).*` is not checked'
        linters:
          - errcheck
