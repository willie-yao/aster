# Generated by aster onboard.
#
# This file records consumer-specific decisions. All omitted settings use the
# defaults from the matching published chart version.
#
# The Kubernetes deploy wrapper passes project.yaml, prompts/system.md, and
# skills/* separately with --set-file.
#
# Published values reference:
# helm show values oci://ghcr.io/willie-yao/charts/aster \
#   --version <chart-version>

# The shared volume must support ReadWriteMany. Select either an existing claim
# or the reviewed storage class supplied during onboarding.
persistence:
  storageClass: "fixture-rwx"

# Provider coordinates and credentials are deployment-owned, not project.yaml.
ai:
  enabled: true
  api: "responses"
  endpoint: "https://provider.example/v1/responses"
  model: "fixture-model"
  existingSecret: "<existing-ai-secret>"

fetcher:
  # Intentionally longer than the chart default for first-run artifact discovery.
  timeout: 120m
  # Keep CronJob starts disabled while the chart-default watch worker is active.
  suspend: true
