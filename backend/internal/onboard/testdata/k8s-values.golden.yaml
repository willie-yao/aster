# yaml-language-server: $schema=https://raw.githubusercontent.com/willie-yao/prow-ai-dashboard/fixture-engine-ref/deploy/helm/prow-ai-dashboard/values.schema.json
# Generated by prow-ai-dashboard onboard.
#
# Active values below are settings a new consumer commonly owns. Commented
# values document optional chart features without pinning their current defaults.
# If the installed chart version differs from the engine ref above, use the
# schema that ships with that chart version.
#
# The Kubernetes deploy wrapper passes project.yaml, prompts/system.md, and
# skills/* separately with --set-file.
#
# Full values reference:
# https://github.com/willie-yao/prow-ai-dashboard/blob/fixture-engine-ref/deploy/helm/prow-ai-dashboard/values.yaml
#
# For a published chart version:
# helm show values oci://ghcr.io/willie-yao/charts/prow-ai-dashboard \
#   --version <chart-version>

# Empty tag overrides let stable chart upgrades follow the chart appVersion
# instead of retaining an older snapshot through reused values.
global:
  # Empty follows the chart appVersion.
  imageTag: ""

image:
  # Defaults to the engine image repository from the chart.
  # repository: ghcr.io/willie-yao/prow-ai-dashboard
  tag: ""
  # pullPolicy: IfNotPresent

# watch runs a continuously refreshing worker Deployment.
# cron runs a scheduled fetcher CronJob.
# Both modes must keep exactly one writer on the shared volume.
mode: watch

# The volume contains dashboard data and AI cache state. ReadWriteMany is
# required for the writer and server. existingClaim reuses a pre-provisioned
# PVC. retain protects chart-managed data during removal or claim changes.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: "<your-rwx-storage-class>"
  accessMode: ReadWriteMany
  size: 1Gi
  retain: true

ai:
  enabled: true
  api: "responses"
  endpoint: "https://provider.example/v1/responses"
  model: "fixture-model"
  # 0 uses provider metadata or the engine fallback. Set a nonzero value only
  # when the endpoint's documented context window supports it.
  contextWindowTokens: 0
  # The chart never creates external provider credentials. Reference a Secret
  # managed outside this file. When enabling AI later, set this field first.
  existingSecret: "fixture-dashboard-ai"
  tokenSecretKey: AI_TOKEN

  # Public repositories normally use anonymous source reads. Private source
  # grounding should use a separate read-only GitHub credential Secret.
  githubReadTokenSecretName: ""
  githubReadTokenSecretKey: GITHUB_READ_TOKEN

fetcher:
  # History depth affects dashboard coverage and fetch cost.
  buildsPerJob: 10
  # Concurrent artifact fetches. Increase only after checking storage limits.
  workers: 5
  # Bounds discovery and artifact fetching. Orka Tasks have a separate timeout.
  timeout: 120m

  # Watch-mode cadence. Cron settings below do not schedule a CronJob while
  # mode remains watch.
  watchInterval: 5m
  reconcileInterval: 1h

  # Keep scheduled starts suspended while watch mode is active. Set false only
  # when switching to mode: cron.
  suspend: true

  # Cron-mode settings. Deadlines and retries are separate from model or Orka
  # retries, and apply only when mode is cron.
  # schedule: "0 */6 * * *"
  # concurrencyPolicy: Forbid
  # activeDeadlineSeconds: 36000
  # backoffLimit: -1
  # restartPolicy: ""

  # Optional fetcher environment, resources, and placement:
  # extraEnv: []
  # resources: {}
  # nodeSelector: {}
  # tolerations: []
  # affinity: {}

analysisRuntime:
  # inprocess is the recommended default.
  # orka-container is an experimental opt-in lifecycle sidegrade.
  type: inprocess

  # Enabling these fields does not install Orka. Install and operate a separate
  # Orka release first. The model Secret must exist in the analysis namespace,
  # taskTimeout must exceed the project AI timeout plus startup and result
  # finalization time, and analyzer Tasks must use CPU placement.
  #
  # To use the experimental Orka container runtime, set type to orka-container
  # and uncomment the needed fields inside this existing mapping.
  orkaContainer:
    # namespace: ""
    # api: http://orka.orka-system.svc.cluster.local:8080
    # apiAuth:
    #   existingSecret: ""
    #   tokenKey: token
    # maxConcurrentTasks: 2
    # pollInterval: 2s
    # taskTimeout: 20m
    # retries: 1
    # Empty clears an older image-specific tag during upgrades.
    image:
      # repository: ghcr.io/willie-yao/prow-ai-dashboard/analyzer
      tag: ""
      # pullPolicy: IfNotPresent
    # modelAuth:
    #   existingSecret: "<model-secret-in-analysis-namespace>"
    #   tokenKey: token
    # state:
    #   existingSecret: ""
    #   key: state-key
    # nodeSelector:
    #   agentpool: "<cpu-agentpool>"
    # tolerations: []
    # affinity: {}

# Fix generation is independent of analysisRuntime.type and must also be
# configured in project.yaml. It remains disabled in the generated scaffold.
orka:
  namespace: orka-system

  fixRuntime:
    enabled: false
    # Empty clears an older image-specific tag during upgrades.
    image:
      tag: ""
    # Required before enabling. Match the effective project.yaml fix runtime.
    # admission:
    #   agentRef: "<orka-agent-name>"
    #   repository:
    #     owner: "<github-owner>"
    #     name: "<github-repository>"
    #   maxTurns: 30
    #   allowBash: true
    #   timeout: 10m
    #   retries: 1

  # rbac:
  #   create: true
  #   serviceAccountName: ""

server:
  # Chat is read-only but still authenticated. Enabling chat requires the
  # actions authentication settings and a secure origin.
  chat:
    enabled: false
    # timeout: 2m
    # correctionsEnabled: false

  # Actions enable GitHub writes. admins is a fail-closed allowlist. OAuth and
  # proxy credentials belong in existing Secrets, never in this file. Enabling
  # chat or actions requires secure origin configuration.
  actions:
    enabled: false
    # mode: oauth
    # admins:
    #   - "<github-login>"
    # oauth:
    #   clientId: "<oauth-client-id>"
    #   redirectUrl: "https://dashboard.example.com/api/auth/callback"
    #   privateRepositories: false
    #   existingSecret: "<oauth-secret>"
    # proxy:
    #   header: X-Auth-Request-Email
    #   existingSecret: "<proxy-secret>"

  # ClusterIP behind ingress or an SSO proxy is preferred for authenticated
  # features. Do not expose a public LoadBalancer without origin restrictions.
  service:
    type: ClusterIP
    port: 80
    # loadBalancerSourceRanges: []
    # externalTrafficPolicy: ""
    # internal:
    #   enabled: false
    #   annotations: {}
    # publicOriginAcknowledged: false
    # annotations: {}

  # Optional server resources and placement:
  # resources: {}
  # nodeSelector: {}
  # tolerations: []
  # affinity: {}

ingress:
  enabled: false
  # className: nginx
  # annotations: {}
  # hosts:
  #   - host: dashboard.example.com
  #     paths:
  #       - path: /
  #         pathType: Prefix
  # tls: []

# Enabling NetworkPolicy with an empty ingress list denies all ingress. The
# wizard cannot infer the ingress controller namespace or network topology.
networkPolicy:
  enabled: false
  ingress: []
  # To allow an ingress controller to the server container port, change the
  # ingress value above from [] to a list and add:
  #   - from:
  #       - namespaceSelector:
  #           matchLabels:
  #             kubernetes.io/metadata.name: ingress-nginx
  #     ports:
  #       - protocol: TCP
  #         port: 8080

# The chart also provides non-root pod and container security defaults.
# Override them only after reviewing the complete chart values.
