apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.execution.workloadServiceAccountName }}
  namespace: {{ .Values.execution.namespace }}
  annotations:
    helm.sh/resource-policy: keep
    prow-ai-dashboard/runtime-class: {{ .Values.execution.runtimeClassName | quote }}
  labels:
    {{- include "aster-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox-workload
automountServiceAccountToken: false
