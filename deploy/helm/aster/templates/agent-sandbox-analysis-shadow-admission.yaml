{{- include "aster.validateAgentAnalysisShadow" . -}}
{{- if .Values.agentSandbox.analysisShadow.enabled }}
{{- $cfg := .Values.agentSandbox.analysisShadow -}}
{{- $provider := $cfg.modelProvider -}}
{{- $reasoningEffort := default "" $provider.reasoningEffort -}}
{{- $directBearer := and (eq (default "direct" $provider.credentialMode) "direct") (eq (default "none" $provider.auth.type) "bearer") -}}
{{- $clientSA := include "aster.agentSandboxClientServiceAccountName" . -}}
{{- $requester := printf "system:serviceaccount:%s:%s" .Release.Namespace $clientSA -}}
{{- $executorImage := include "aster.agentAnalysisShadowExecutorImage" . -}}
{{- $stagerImage := include "aster.agentAnalysisShadowStagerImage" . -}}
{{- $workloadSA := include "aster.agentAnalysisShadowWorkloadServiceAccountName" . -}}
{{- $timeoutText := printf "%v" $cfg.timeout -}}
{{- $timeoutSeconds := 0 -}}
{{- if hasSuffix "m" $timeoutText -}}
  {{- $timeoutSeconds = mul (trimSuffix "m" $timeoutText | int) 60 -}}
{{- else -}}
  {{- $timeoutSeconds = trimSuffix "s" $timeoutText | int -}}
{{- end -}}
{{- $activeDeadline := add $timeoutSeconds 15 -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "aster.agentAnalysisShadowAdmissionName" . }}
  labels:
    {{- include "aster.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox-analysis-shadow
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["agents.x-k8s.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["sandboxes"]
        scope: Namespaced
  matchConditions:
    - name: execution-namespace
      expression: {{ printf "object.metadata.namespace == %s" (toJson $cfg.namespace) | quote }}
    - name: analysis-shadow-create-or-update
      expression: "request.operation == 'CREATE' || (has(oldObject.metadata.labels) && oldObject.metadata.labels['prow-ai-dashboard/purpose'] == 'analysis')"
  variables:
    - name: pod
      expression: "object.spec.podTemplate.spec"
    - name: container
      expression: "object.spec.podTemplate.spec.containers[0]"
    - name: stager
      expression: "object.spec.podTemplate.spec.initContainers[0]"
  validations:
    - expression: {{ printf "request.operation != 'CREATE' || request.userInfo.username == %s" (toJson $requester) | quote }}
      message: "only the dashboard Agent Sandbox client may create analysis shadow workloads"
    - expression: "request.operation != 'UPDATE' || object.spec == oldObject.spec"
      message: "dashboard analysis shadow Sandbox workload specs are immutable"
    - expression: "request.operation != 'UPDATE' || object.metadata.labels == oldObject.metadata.labels"
      message: "dashboard analysis shadow Sandbox labels are immutable"
    - expression: "request.operation != 'UPDATE' || (has(object.metadata.annotations) && has(oldObject.metadata.annotations) && object.metadata.annotations['prow-ai-dashboard/execution-contract-sha256'] == oldObject.metadata.annotations['prow-ai-dashboard/execution-contract-sha256'] && object.metadata.annotations['prow-ai-dashboard/execution-id'] == oldObject.metadata.annotations['prow-ai-dashboard/execution-id'] && object.metadata.annotations['prow-ai-dashboard/prepared-manifest-sha256'] == oldObject.metadata.annotations['prow-ai-dashboard/prepared-manifest-sha256'] && object.metadata.annotations['prow-ai-dashboard/prepared-workspace-sha256'] == oldObject.metadata.annotations['prow-ai-dashboard/prepared-workspace-sha256'])"
      message: "dashboard analysis shadow execution identity is immutable"
    - expression: "request.operation != 'CREATE' || (object.metadata.name.matches('^analysis-[a-z0-9-]+-[0-9a-f]{12}$') && has(object.metadata.labels) && size(object.metadata.labels) == 4 && object.metadata.labels['app.kubernetes.io/managed-by'] == 'prow-ai-dashboard' && object.metadata.labels['agents.x-k8s.io/created-by'] == 'prow-ai-dashboard' && object.metadata.labels['prow-ai-dashboard/execution'] == object.metadata.name && object.metadata.labels['prow-ai-dashboard/purpose'] == 'analysis' && (!has(object.metadata.finalizers) || size(object.metadata.finalizers) == 0))"
      message: "dashboard analysis shadow Sandboxes require exact content-addressed metadata"
    - expression: "request.operation != 'CREATE' || (has(object.metadata.annotations) && size(object.metadata.annotations) == {{ add 4 (ternary 1 0 (ne $reasoningEffort "")) }} && object.metadata.annotations['prow-ai-dashboard/execution-contract-sha256'].matches('^[0-9a-f]{64}$') && size(object.metadata.annotations['prow-ai-dashboard/execution-id']) > 0 && object.metadata.annotations['prow-ai-dashboard/prepared-manifest-sha256'].matches('^[0-9a-f]{64}$') && object.metadata.annotations['prow-ai-dashboard/prepared-workspace-sha256'].matches('^[0-9a-f]{64}$'))"
      message: "dashboard analysis shadow Sandboxes require exact execution annotations"
    {{- if $reasoningEffort }}
    - expression: {{ printf "request.operation != 'CREATE' || (has(object.metadata.annotations) && object.metadata.annotations['prow-ai-dashboard/model-provider-reasoning-effort'] == %s)" (toJson $reasoningEffort) | quote }}
      message: "dashboard analysis shadow Sandboxes must use the configured reasoning effort"
    - expression: "request.operation != 'UPDATE' || object.metadata.annotations['prow-ai-dashboard/model-provider-reasoning-effort'] == oldObject.metadata.annotations['prow-ai-dashboard/model-provider-reasoning-effort']"
      message: "dashboard analysis shadow reasoning effort is immutable"
    {{- else }}
    - expression: "request.operation != 'CREATE' || !has(object.metadata.annotations) || !('prow-ai-dashboard/model-provider-reasoning-effort' in object.metadata.annotations)"
      message: "dashboard analysis shadow Sandboxes must not add a reasoning effort override"
    - expression: "request.operation != 'UPDATE' || ((has(object.metadata.annotations) && 'prow-ai-dashboard/model-provider-reasoning-effort' in object.metadata.annotations) == (has(oldObject.metadata.annotations) && 'prow-ai-dashboard/model-provider-reasoning-effort' in oldObject.metadata.annotations) && (!has(object.metadata.annotations) || !('prow-ai-dashboard/model-provider-reasoning-effort' in object.metadata.annotations) || (has(oldObject.metadata.annotations) && 'prow-ai-dashboard/model-provider-reasoning-effort' in oldObject.metadata.annotations && object.metadata.annotations['prow-ai-dashboard/model-provider-reasoning-effort'] == oldObject.metadata.annotations['prow-ai-dashboard/model-provider-reasoning-effort'])))"
      message: "dashboard analysis shadow reasoning effort overrides cannot be introduced"
    {{- end }}
    - expression: "object.spec.operatingMode == 'Running' && has(object.spec.shutdownTime) && object.spec.shutdownPolicy == 'Delete' && object.spec.service == false && (!has(object.spec.volumeClaimTemplates) || size(object.spec.volumeClaimTemplates) == 0)"
      message: "dashboard analysis shadow Sandboxes require bounded delete lifecycle without Services or PVC creation"
    - expression: "has(object.spec.podTemplate.metadata.labels) && size(object.spec.podTemplate.metadata.labels) == 2 && object.spec.podTemplate.metadata.labels['prow-ai-dashboard/execution'] == object.metadata.name && object.spec.podTemplate.metadata.labels['prow-ai-dashboard/purpose'] == 'analysis' && (!has(object.spec.podTemplate.metadata.annotations) || size(object.spec.podTemplate.metadata.annotations) == 0)"
      message: "dashboard analysis shadow Pod metadata is fixed"
    - expression: {{ printf "variables.pod.serviceAccountName == %s && (!has(variables.pod.serviceAccount) || variables.pod.serviceAccount == '') && has(variables.pod.automountServiceAccountToken) && variables.pod.automountServiceAccountToken == false && variables.pod.runtimeClassName == %s" (toJson $workloadSA) (toJson $cfg.runtimeClassName) | quote }}
      message: "dashboard analysis shadow identity and RuntimeClass must match configured values"
    - expression: {{ printf "variables.pod.restartPolicy == 'Never' && variables.pod.activeDeadlineSeconds == %d && variables.pod.terminationGracePeriodSeconds == 5 && has(variables.pod.enableServiceLinks) && variables.pod.enableServiceLinks == false" $activeDeadline | quote }}
      message: "dashboard analysis shadow Pod lifecycle must match configured bounds"
    - expression: "(!has(variables.pod.hostNetwork) || variables.pod.hostNetwork == false) && (!has(variables.pod.hostPID) || variables.pod.hostPID == false) && (!has(variables.pod.hostIPC) || variables.pod.hostIPC == false) && (!has(variables.pod.shareProcessNamespace) || variables.pod.shareProcessNamespace == false) && !has(variables.pod.hostUsers) && (!has(variables.pod.hostAliases) || size(variables.pod.hostAliases) == 0) && !has(variables.pod.dnsPolicy) && !has(variables.pod.dnsConfig) && !has(variables.pod.setHostnameAsFQDN)"
      message: "dashboard analysis shadow Sandboxes must not join host namespaces or override DNS"
    - expression: "has(variables.pod.securityContext) && variables.pod.securityContext.runAsNonRoot == true && variables.pod.securityContext.runAsUser == 65532 && variables.pod.securityContext.runAsGroup == 65532 && variables.pod.securityContext.fsGroup == 65532 && variables.pod.securityContext.seccompProfile.type == 'RuntimeDefault' && variables.pod.securityContext.appArmorProfile.type == 'RuntimeDefault' && (!has(variables.pod.securityContext.sysctls) || size(variables.pod.securityContext.sysctls) == 0) && (!has(variables.pod.securityContext.supplementalGroups) || size(variables.pod.securityContext.supplementalGroups) == 0) && !has(variables.pod.securityContext.supplementalGroupsPolicy) && !has(variables.pod.securityContext.fsGroupChangePolicy) && !has(variables.pod.securityContext.seLinuxChangePolicy) && !has(variables.pod.securityContext.seLinuxOptions) && !has(variables.pod.securityContext.windowsOptions)"
      message: "dashboard analysis shadow Pod security context is fixed"
    - expression: "size(variables.pod.containers) == 1 && size(variables.pod.initContainers) == 1 && (!has(variables.pod.ephemeralContainers) || size(variables.pod.ephemeralContainers) == 0)"
      message: "dashboard analysis shadow Sandboxes require exactly one executor and one stager init container"
    - expression: {{ printf "variables.container.name == 'executor' && variables.container.image == %s && variables.container.imagePullPolicy == %s && (!has(variables.container.command) || size(variables.container.command) == 0) && (!has(variables.container.args) || size(variables.container.args) == 0)" (toJson $executorImage) (toJson $cfg.image.pullPolicy) | quote }}
      message: "dashboard analysis shadow Sandboxes must use the configured immutable executor entrypoint"
    - expression: "has(variables.container.securityContext) && variables.container.securityContext.runAsNonRoot == true && variables.container.securityContext.runAsUser == 65532 && variables.container.securityContext.runAsGroup == 65532 && variables.container.securityContext.allowPrivilegeEscalation == false && variables.container.securityContext.readOnlyRootFilesystem == true && variables.container.securityContext.seccompProfile.type == 'RuntimeDefault' && variables.container.securityContext.appArmorProfile.type == 'RuntimeDefault' && has(variables.container.securityContext.capabilities) && size(variables.container.securityContext.capabilities.drop) == 1 && variables.container.securityContext.capabilities.drop[0] == 'ALL' && (!has(variables.container.securityContext.capabilities.add) || size(variables.container.securityContext.capabilities.add) == 0) && (!has(variables.container.securityContext.privileged) || variables.container.securityContext.privileged == false) && (!has(variables.container.securityContext.procMount) || variables.container.securityContext.procMount == 'Default') && !has(variables.container.securityContext.seLinuxOptions) && !has(variables.container.securityContext.windowsOptions)"
      message: "dashboard analysis shadow executor security context is fixed"
    {{- if $directBearer }}
    - expression: {{ printf "size(variables.container.env) == 1 && variables.container.env[0].name == 'PROW_AI_MODEL_PROVIDER_TOKEN' && !has(variables.container.env[0].value) && has(variables.container.env[0].valueFrom) && has(variables.container.env[0].valueFrom.secretKeyRef) && variables.container.env[0].valueFrom.secretKeyRef.name == %s && variables.container.env[0].valueFrom.secretKeyRef.key == %s && (!has(variables.container.env[0].valueFrom.secretKeyRef.optional) || variables.container.env[0].valueFrom.secretKeyRef.optional == false) && !has(variables.container.env[0].valueFrom.configMapKeyRef) && !has(variables.container.env[0].valueFrom.fieldRef) && !has(variables.container.env[0].valueFrom.resourceFieldRef) && (!has(variables.container.envFrom) || size(variables.container.envFrom) == 0)" (toJson $provider.auth.existingSecret) (toJson $provider.auth.tokenKey) | quote }}
    {{- else }}
    - expression: "size(variables.container.env) == 0 && (!has(variables.container.envFrom) || size(variables.container.envFrom) == 0)"
    {{- end }}
      message: "dashboard analysis shadow executor environment must match the configured request and provider credential"
    - expression: "(!has(variables.container.ports) || size(variables.container.ports) == 0) && (!has(variables.container.volumeDevices) || size(variables.container.volumeDevices) == 0) && !has(variables.container.lifecycle) && !has(variables.container.livenessProbe) && !has(variables.container.readinessProbe) && !has(variables.container.startupProbe) && !has(variables.container.restartPolicy) && (!has(variables.container.restartPolicyRules) || size(variables.container.restartPolicyRules) == 0) && (!has(variables.container.resizePolicy) || size(variables.container.resizePolicy) == 0) && (!has(variables.container.stdin) || variables.container.stdin == false) && (!has(variables.container.stdinOnce) || variables.container.stdinOnce == false) && (!has(variables.container.tty) || variables.container.tty == false) && !has(variables.container.workingDir) && !has(variables.container.terminationMessagePath) && !has(variables.container.terminationMessagePolicy)"
      message: "dashboard analysis shadow executor process shape is fixed"
    - expression: {{ printf "size(variables.container.resources.requests) == 3 && size(variables.container.resources.limits) == 3 && (!has(variables.container.resources.claims) || size(variables.container.resources.claims) == 0) && variables.container.resources.requests['cpu'] == %s && variables.container.resources.requests['memory'] == %s && variables.container.resources.requests['ephemeral-storage'] == %s && variables.container.resources.limits['cpu'] == %s && variables.container.resources.limits['memory'] == %s && variables.container.resources.limits['ephemeral-storage'] == %s" (toJson (index $cfg.resources.requests "cpu")) (toJson (index $cfg.resources.requests "memory")) (toJson (index $cfg.resources.requests "ephemeral-storage")) (toJson (index $cfg.resources.limits "cpu")) (toJson (index $cfg.resources.limits "memory")) (toJson (index $cfg.resources.limits "ephemeral-storage")) | quote }}
      message: "dashboard analysis shadow executor resources must match configured bounds"
    - expression: "size(variables.container.volumeMounts) == 4 && variables.container.volumeMounts.exists(v, v.name == 'workspace' && v.mountPath == '/workspace' && v.readOnly == true && !has(v.subPath) && !has(v.subPathExpr) && !has(v.mountPropagation)) && variables.container.volumeMounts.exists(v, v.name == 'request' && v.mountPath == '/analysis-request' && v.readOnly == true && !has(v.subPath) && !has(v.subPathExpr) && !has(v.mountPropagation)) && variables.container.volumeMounts.exists(v, v.name == 'result' && v.mountPath == '/workspace/result' && (!has(v.readOnly) || v.readOnly == false) && !has(v.subPath) && !has(v.subPathExpr) && !has(v.mountPropagation)) && variables.container.volumeMounts.exists(v, v.name == 'executor-tmp' && v.mountPath == '/tmp' && (!has(v.readOnly) || v.readOnly == false) && !has(v.subPath) && !has(v.subPathExpr) && !has(v.mountPropagation))"
      message: "dashboard analysis shadow executor may read only the staged workspace and write only result and temporary storage"
    - expression: {{ printf "variables.stager.name == 'stager' && variables.stager.image == %s && variables.stager.imagePullPolicy == %s && (!has(variables.stager.command) || size(variables.stager.command) == 0) && (!has(variables.stager.args) || size(variables.stager.args) == 0)" (toJson $stagerImage) (toJson $cfg.stagerImage.pullPolicy) | quote }}
      message: "dashboard analysis shadow must use the configured immutable stager entrypoint"
    - expression: "has(variables.stager.securityContext) && variables.stager.securityContext.runAsNonRoot == true && variables.stager.securityContext.runAsUser == 65532 && variables.stager.securityContext.runAsGroup == 65532 && variables.stager.securityContext.allowPrivilegeEscalation == false && variables.stager.securityContext.readOnlyRootFilesystem == true && variables.stager.securityContext.seccompProfile.type == 'RuntimeDefault' && variables.stager.securityContext.appArmorProfile.type == 'RuntimeDefault' && has(variables.stager.securityContext.capabilities) && size(variables.stager.securityContext.capabilities.drop) == 1 && variables.stager.securityContext.capabilities.drop[0] == 'ALL'"
      message: "dashboard analysis shadow stager security context is fixed"
    - expression: {{ include "aster.agentAnalysisRequestChunkAdmission" . | quote }}
      message: "dashboard analysis shadow stager environment is limited to the sealed stage request"
    - expression: "(!has(variables.stager.ports) || size(variables.stager.ports) == 0) && (!has(variables.stager.volumeDevices) || size(variables.stager.volumeDevices) == 0) && !has(variables.stager.lifecycle) && !has(variables.stager.livenessProbe) && !has(variables.stager.readinessProbe) && !has(variables.stager.startupProbe) && !has(variables.stager.restartPolicy) && (!has(variables.stager.restartPolicyRules) || size(variables.stager.restartPolicyRules) == 0) && (!has(variables.stager.stdin) || variables.stager.stdin == false) && (!has(variables.stager.stdinOnce) || variables.stager.stdinOnce == false) && (!has(variables.stager.tty) || variables.stager.tty == false) && !has(variables.stager.workingDir)"
      message: "dashboard analysis shadow stager process shape is fixed"
    - expression: {{ printf "size(variables.stager.resources.requests) == 3 && size(variables.stager.resources.limits) == 3 && variables.stager.resources.requests['cpu'] == %s && variables.stager.resources.requests['memory'] == %s && variables.stager.resources.requests['ephemeral-storage'] == %s && variables.stager.resources.limits['cpu'] == %s && variables.stager.resources.limits['memory'] == %s && variables.stager.resources.limits['ephemeral-storage'] == %s" (toJson (index $cfg.resources.requests "cpu")) (toJson (index $cfg.resources.requests "memory")) (toJson (index $cfg.resources.requests "ephemeral-storage")) (toJson (index $cfg.resources.limits "cpu")) (toJson (index $cfg.resources.limits "memory")) (toJson (index $cfg.resources.limits "ephemeral-storage")) | quote }}
      message: "dashboard analysis shadow stager resources must match configured bounds"
    - expression: "size(variables.stager.volumeMounts) == 4 && variables.stager.volumeMounts.exists(v, v.name == 'input' && v.mountPath == '/input' && v.readOnly == true && !has(v.subPath) && !has(v.subPathExpr) && !has(v.mountPropagation)) && variables.stager.volumeMounts.exists(v, v.name == 'workspace' && v.mountPath == '/workspace' && (!has(v.readOnly) || v.readOnly == false) && !has(v.subPath) && !has(v.subPathExpr) && !has(v.mountPropagation)) && variables.stager.volumeMounts.exists(v, v.name == 'request' && v.mountPath == '/analysis-request' && (!has(v.readOnly) || v.readOnly == false) && !has(v.subPath) && !has(v.subPathExpr) && !has(v.mountPropagation)) && variables.stager.volumeMounts.exists(v, v.name == 'stager-tmp' && v.mountPath == '/tmp' && (!has(v.readOnly) || v.readOnly == false) && !has(v.subPath) && !has(v.subPathExpr) && !has(v.mountPropagation))"
      message: "dashboard analysis shadow stager may read only the private input and write only the fresh workspace and temporary storage"
    - expression: {{ printf "size(variables.pod.volumes) == 6 && variables.pod.volumes.exists(v, v.name == 'input' && has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == %s && v.persistentVolumeClaim.readOnly == true) && variables.pod.volumes.exists(v, v.name == 'workspace' && has(v.emptyDir) && v.emptyDir.sizeLimit == %s) && variables.pod.volumes.exists(v, v.name == 'request' && has(v.emptyDir) && v.emptyDir.sizeLimit == '1Mi') && variables.pod.volumes.exists(v, v.name == 'result' && has(v.emptyDir) && v.emptyDir.sizeLimit == '4Mi') && variables.pod.volumes.exists(v, v.name == 'executor-tmp' && has(v.emptyDir) && v.emptyDir.sizeLimit == '64Mi') && variables.pod.volumes.exists(v, v.name == 'stager-tmp' && has(v.emptyDir) && v.emptyDir.sizeLimit == '64Mi')" (toJson $cfg.input.existingClaim) (toJson (index $cfg.resources.limits "ephemeral-storage")) | quote }}
      message: "dashboard analysis shadow storage is limited to the read-only input and fresh bounded workspace, result, and temporary volumes"
    - expression: "(!has(variables.pod.imagePullSecrets) || size(variables.pod.imagePullSecrets) == 0) && (!has(variables.pod.nodeSelector) || size(variables.pod.nodeSelector) == 0) && (!has(variables.pod.tolerations) || size(variables.pod.tolerations) == 0) && !has(variables.pod.nodeName) && !has(variables.pod.hostname) && !has(variables.pod.hostnameOverride) && !has(variables.pod.subdomain) && !has(variables.pod.affinity) && !has(variables.pod.schedulerName) && !has(variables.pod.priority) && !has(variables.pod.priorityClassName) && !has(variables.pod.preemptionPolicy) && (!has(variables.pod.topologySpreadConstraints) || size(variables.pod.topologySpreadConstraints) == 0) && (!has(variables.pod.schedulingGates) || size(variables.pod.schedulingGates) == 0) && !has(variables.pod.schedulingGroup) && (!has(variables.pod.readinessGates) || size(variables.pod.readinessGates) == 0) && (!has(variables.pod.resourceClaims) || size(variables.pod.resourceClaims) == 0) && !has(variables.pod.resources) && !has(variables.pod.os) && !has(variables.pod.overhead)"
      message: "dashboard analysis shadow Sandboxes must not override placement, scheduling, devices, registry credentials, or network identity"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "aster.agentAnalysisShadowAdmissionName" . }}
  labels:
    {{- include "aster.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox-analysis-shadow
spec:
  policyName: {{ include "aster.agentAnalysisShadowAdmissionName" . }}
  validationActions: [Deny]
{{- end }}
