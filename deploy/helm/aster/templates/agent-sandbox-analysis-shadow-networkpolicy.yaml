{{- include "aster.validateAgentAnalysisShadow" . -}}
{{- if and .Values.agentSandbox.analysisShadow.enabled .Values.agentSandbox.analysisShadow.networkPolicy.enabled }}
{{- $cfg := .Values.agentSandbox.analysisShadow.networkPolicy -}}
{{- $gatewayTargetPort := int $cfg.gatewayPort -}}
{{- if and (hasKey $cfg "gatewayTargetPort") (ne (index $cfg "gatewayTargetPort") nil) -}}
  {{- $gatewayTargetPort = int (index $cfg "gatewayTargetPort") -}}
{{- end -}}
{{- if eq $cfg.mode "cilium" }}
{{- $providerAuthority := trimPrefix "https://" (regexFind "^https://[^/]+" .Values.agentSandbox.analysisShadow.modelProvider.endpoint) -}}
{{- $providerHost := regexReplaceAll ":[0-9]+$" $providerAuthority "" -}}
{{- $providerParts := splitList "." $providerHost -}}
{{- $providerInternalService := regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?[.][a-z0-9]([-a-z0-9]*[a-z0-9])?[.]svc([.]cluster[.]local)?$" $providerHost -}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "aster.agentAnalysisShadowAdmissionName" . }}
  namespace: {{ .Values.agentSandbox.analysisShadow.namespace }}
  labels:
    {{- include "aster.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox-analysis-shadow
spec:
  endpointSelector:
    matchLabels:
      prow-ai-dashboard/purpose: analysis
  ingress: []
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: {{ index $cfg.dnsNamespaceSelector "kubernetes.io/metadata.name" | quote }}
            {{- toYaml $cfg.dnsPodSelector | nindent 12 }}
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    {{- if $providerInternalService }}
    - toServices:
        - k8sService:
            serviceName: {{ index $providerParts 0 | quote }}
            namespace: {{ index $providerParts 1 | quote }}
      toPorts:
        - ports:
            - port: {{ $gatewayTargetPort | quote }}
              protocol: TCP
    {{- else }}
    - toFQDNs:
        - matchName: {{ $providerHost | quote }}
      toPorts:
        - ports:
            - port: {{ $cfg.gatewayPort | quote }}
              protocol: TCP
    {{- end }}
{{- else }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aster.agentAnalysisShadowAdmissionName" . }}
  namespace: {{ .Values.agentSandbox.analysisShadow.namespace }}
  labels:
    {{- include "aster.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox-analysis-shadow
spec:
  podSelector:
    matchLabels:
      prow-ai-dashboard/purpose: analysis
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $cfg.dnsNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $cfg.dnsPodSelector | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $cfg.gatewayNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $cfg.gatewayPodSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $gatewayTargetPort }}
{{- end }}
{{- end }}
