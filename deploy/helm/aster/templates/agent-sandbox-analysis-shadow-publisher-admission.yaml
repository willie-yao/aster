{{- include "aster.validateAgentAnalysisShadow" . -}}
{{- if .Values.agentSandbox.analysisShadow.enabled }}
{{- $cfg := .Values.agentSandbox.analysisShadow -}}
{{- $clientSA := include "aster.agentSandboxClientServiceAccountName" . -}}
{{- $requester := printf "system:serviceaccount:%s:%s" .Release.Namespace $clientSA -}}
{{- $stagerImage := include "aster.agentAnalysisShadowStagerImage" . -}}
{{- $workloadSA := include "aster.agentAnalysisShadowWorkloadServiceAccountName" . -}}
{{- $timeoutText := printf "%v" $cfg.timeout -}}
{{- $timeoutSeconds := 0 -}}
{{- if hasSuffix "m" $timeoutText -}}
  {{- $timeoutSeconds = mul (trimSuffix "m" $timeoutText | int) 60 -}}
{{- else -}}
  {{- $timeoutSeconds = trimSuffix "s" $timeoutText | int -}}
{{- end -}}
{{- $activeDeadline := add $timeoutSeconds 15 -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "aster.agentAnalysisShadowPublisherAdmissionName" . }}
  labels:
    {{- include "aster.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox-analysis-shadow-input
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
        scope: Namespaced
  matchConditions:
    - name: execution-namespace
      expression: {{ printf "object.metadata.namespace == %s" (toJson $cfg.namespace) | quote }}
    - name: analysis-input-create-or-update
      expression: "request.operation == 'CREATE' || (has(oldObject.metadata.labels) && oldObject.metadata.labels['prow-ai-dashboard/purpose'].startsWith('analysis-input-'))"
  variables:
    - name: pod
      expression: "object.spec.template.spec"
    - name: container
      expression: "object.spec.template.spec.containers[0]"
  validations:
    - expression: {{ printf "request.operation != 'CREATE' || request.userInfo.username == %s" (toJson $requester) | quote }}
      message: "only the dashboard Agent Sandbox client may create analysis input Jobs"
    - expression: "request.operation != 'UPDATE' || object.spec == oldObject.spec"
      message: "analysis input Job specs are immutable"
    - expression: "request.operation != 'UPDATE' || object.metadata.labels == oldObject.metadata.labels && object.metadata.annotations == oldObject.metadata.annotations"
      message: "analysis input Job identity is immutable"
    - expression: "request.operation != 'CREATE' || ((object.metadata.name.matches('^analysis-input-publish-[0-9a-f]{12}$') && object.metadata.labels['prow-ai-dashboard/purpose'] == 'analysis-input-publish') || (object.metadata.name.matches('^analysis-input-cleanup-[0-9a-f]{12}$') && object.metadata.labels['prow-ai-dashboard/purpose'] == 'analysis-input-cleanup'))"
      message: "analysis input Job name and purpose must match"
    - expression: "request.operation != 'CREATE' || (has(object.metadata.labels) && size(object.metadata.labels) <= 7 && object.metadata.labels['app.kubernetes.io/managed-by'] == 'prow-ai-dashboard' && object.metadata.labels['prow-ai-dashboard/execution'] == object.metadata.name && object.metadata.labels.all(k, k in ['app.kubernetes.io/managed-by','prow-ai-dashboard/purpose','prow-ai-dashboard/execution','batch.kubernetes.io/controller-uid','batch.kubernetes.io/job-name','controller-uid','job-name']))"
      message: "analysis input Job labels are fixed"
    - expression: "request.operation != 'CREATE' || (has(object.metadata.annotations) && size(object.metadata.annotations) == 2 && object.metadata.annotations['prow-ai-dashboard/execution-contract-sha256'].matches('^[0-9a-f]{64}$') && object.metadata.annotations['prow-ai-dashboard/prepared-manifest-sha256'].matches('^[0-9a-f]{64}$'))"
      message: "analysis input Job annotations are content-addressed"
    - expression: {{ printf "request.operation != 'CREATE' || (object.spec.backoffLimit == 0 && object.spec.activeDeadlineSeconds == %d && (!has(object.spec.parallelism) || object.spec.parallelism == 1) && (!has(object.spec.completions) || object.spec.completions == 1) && (!has(object.spec.suspend) || object.spec.suspend == false) && (!has(object.spec.ttlSecondsAfterFinished)) && (!has(object.spec.manualSelector) || object.spec.manualSelector == false) && !has(object.spec.selector) && !has(object.spec.completionMode) && !has(object.spec.backoffLimitPerIndex) && !has(object.spec.maxFailedIndexes) && !has(object.spec.podFailurePolicy) && !has(object.spec.successPolicy) && !has(object.spec.podReplacementPolicy) && !has(object.spec.managedBy))" $activeDeadline | quote }}
      message: "analysis input Job lifecycle is fixed"
    - expression: "request.operation != 'CREATE' || (has(object.spec.template.metadata.labels) && size(object.spec.template.metadata.labels) <= 7 && object.spec.template.metadata.labels['app.kubernetes.io/managed-by'] == 'prow-ai-dashboard' && object.spec.template.metadata.labels['prow-ai-dashboard/purpose'] == object.metadata.labels['prow-ai-dashboard/purpose'] && object.spec.template.metadata.labels['prow-ai-dashboard/execution'] == object.metadata.name && object.spec.template.metadata.labels.all(k, k in ['app.kubernetes.io/managed-by','prow-ai-dashboard/purpose','prow-ai-dashboard/execution','batch.kubernetes.io/controller-uid','batch.kubernetes.io/job-name','controller-uid','job-name']) && (!has(object.spec.template.metadata.annotations) || size(object.spec.template.metadata.annotations) == 0))"
      message: "analysis input Pod metadata is fixed"
    - expression: {{ printf "variables.pod.serviceAccountName == %s && (!has(variables.pod.serviceAccount) || variables.pod.serviceAccount == '') && has(variables.pod.automountServiceAccountToken) && variables.pod.automountServiceAccountToken == false && variables.pod.restartPolicy == 'Never' && variables.pod.activeDeadlineSeconds == %d && variables.pod.terminationGracePeriodSeconds == 5 && has(variables.pod.enableServiceLinks) && variables.pod.enableServiceLinks == false" (toJson $workloadSA) $activeDeadline | quote }}
      message: "analysis input Pod identity and lifecycle are fixed"
    - expression: "(!has(variables.pod.runtimeClassName) || variables.pod.runtimeClassName == '') && (!has(variables.pod.hostNetwork) || variables.pod.hostNetwork == false) && (!has(variables.pod.hostPID) || variables.pod.hostPID == false) && (!has(variables.pod.hostIPC) || variables.pod.hostIPC == false) && (!has(variables.pod.shareProcessNamespace) || variables.pod.shareProcessNamespace == false) && !has(variables.pod.hostUsers) && (!has(variables.pod.hostAliases) || size(variables.pod.hostAliases) == 0) && !has(variables.pod.dnsPolicy) && !has(variables.pod.dnsConfig) && !has(variables.pod.setHostnameAsFQDN)"
      message: "analysis input Jobs must not join host namespaces or secure-runtime nodes"
    - expression: "has(variables.pod.securityContext) && variables.pod.securityContext.runAsNonRoot == true && variables.pod.securityContext.runAsUser == 65532 && variables.pod.securityContext.runAsGroup == 65532 && variables.pod.securityContext.fsGroup == 65532 && variables.pod.securityContext.seccompProfile.type == 'RuntimeDefault' && variables.pod.securityContext.appArmorProfile.type == 'RuntimeDefault' && (!has(variables.pod.securityContext.sysctls) || size(variables.pod.securityContext.sysctls) == 0) && (!has(variables.pod.securityContext.supplementalGroups) || size(variables.pod.securityContext.supplementalGroups) == 0) && !has(variables.pod.securityContext.supplementalGroupsPolicy) && !has(variables.pod.securityContext.fsGroupChangePolicy) && !has(variables.pod.securityContext.seLinuxChangePolicy) && !has(variables.pod.securityContext.seLinuxOptions) && !has(variables.pod.securityContext.windowsOptions)"
      message: "analysis input Pod security context is fixed"
    - expression: "size(variables.pod.containers) == 1 && (!has(variables.pod.initContainers) || size(variables.pod.initContainers) == 0) && (!has(variables.pod.ephemeralContainers) || size(variables.pod.ephemeralContainers) == 0)"
      message: "analysis input Jobs require exactly one stager container"
    - expression: {{ printf "variables.container.name == 'stager' && variables.container.image == %s && variables.container.imagePullPolicy == 'IfNotPresent' && (!has(variables.container.command) || size(variables.container.command) == 0) && (!has(variables.container.args) || size(variables.container.args) == 0)" (toJson $stagerImage) | quote }}
      message: "analysis input Jobs must use the configured immutable stager entrypoint"
    - expression: "has(variables.container.securityContext) && variables.container.securityContext.runAsNonRoot == true && variables.container.securityContext.runAsUser == 65532 && variables.container.securityContext.runAsGroup == 65532 && variables.container.securityContext.allowPrivilegeEscalation == false && variables.container.securityContext.readOnlyRootFilesystem == true && variables.container.securityContext.seccompProfile.type == 'RuntimeDefault' && variables.container.securityContext.appArmorProfile.type == 'RuntimeDefault' && has(variables.container.securityContext.capabilities) && size(variables.container.securityContext.capabilities.drop) == 1 && variables.container.securityContext.capabilities.drop[0] == 'ALL' && (!has(variables.container.securityContext.capabilities.add) || size(variables.container.securityContext.capabilities.add) == 0) && (!has(variables.container.securityContext.privileged) || variables.container.securityContext.privileged == false) && (!has(variables.container.securityContext.procMount) || variables.container.securityContext.procMount == 'Default') && !has(variables.container.securityContext.seLinuxOptions) && !has(variables.container.securityContext.windowsOptions)"
      message: "analysis input stager security context is fixed"
    - expression: "size(variables.container.env) == 1 && (((object.metadata.labels['prow-ai-dashboard/purpose'] == 'analysis-input-publish') && variables.container.env[0].name == 'PROW_AI_ANALYSIS_PUBLISH_REQUEST_B64') || ((object.metadata.labels['prow-ai-dashboard/purpose'] == 'analysis-input-cleanup') && variables.container.env[0].name == 'PROW_AI_ANALYSIS_CLEANUP_REQUEST_B64')) && has(variables.container.env[0].value) && size(variables.container.env[0].value) > 0 && size(variables.container.env[0].value) <= 1048576 && variables.container.env[0].value.matches('^[A-Za-z0-9+/]+={0,2}$') && !has(variables.container.env[0].valueFrom) && (!has(variables.container.envFrom) || size(variables.container.envFrom) == 0)"
      message: "analysis input stager environment is limited to one sealed request"
    - expression: {{ printf "size(variables.container.resources.requests) == 3 && size(variables.container.resources.limits) == 3 && (!has(variables.container.resources.claims) || size(variables.container.resources.claims) == 0) && variables.container.resources.requests['cpu'] == %s && variables.container.resources.requests['memory'] == %s && variables.container.resources.requests['ephemeral-storage'] == %s && variables.container.resources.limits['cpu'] == %s && variables.container.resources.limits['memory'] == %s && variables.container.resources.limits['ephemeral-storage'] == %s" (toJson (index $cfg.resources.requests "cpu")) (toJson (index $cfg.resources.requests "memory")) (toJson (index $cfg.resources.requests "ephemeral-storage")) (toJson (index $cfg.resources.limits "cpu")) (toJson (index $cfg.resources.limits "memory")) (toJson (index $cfg.resources.limits "ephemeral-storage")) | quote }}
      message: "analysis input stager resources must match configured bounds"
    - expression: "size(variables.container.volumeMounts) == 2 && variables.container.volumeMounts.exists(v, v.name == 'input' && v.mountPath == '/input' && (!has(v.readOnly) || v.readOnly == false) && !has(v.subPath) && !has(v.subPathExpr) && !has(v.mountPropagation)) && variables.container.volumeMounts.exists(v, v.name == 'tmp' && v.mountPath == '/tmp' && (!has(v.readOnly) || v.readOnly == false) && !has(v.subPath) && !has(v.subPathExpr) && !has(v.mountPropagation))"
      message: "analysis input stager may write only private input and temporary storage"
    - expression: {{ printf "size(variables.pod.volumes) == 2 && variables.pod.volumes.exists(v, v.name == 'input' && has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == %s && (!has(v.persistentVolumeClaim.readOnly) || v.persistentVolumeClaim.readOnly == false)) && variables.pod.volumes.exists(v, v.name == 'tmp' && has(v.emptyDir) && v.emptyDir.sizeLimit == '64Mi')" (toJson $cfg.input.existingClaim) | quote }}
      message: "analysis input Job storage is limited to the private input claim and temporary space"
    - expression: "(!has(variables.container.ports) || size(variables.container.ports) == 0) && (!has(variables.container.volumeDevices) || size(variables.container.volumeDevices) == 0) && !has(variables.container.lifecycle) && !has(variables.container.livenessProbe) && !has(variables.container.readinessProbe) && !has(variables.container.startupProbe) && !has(variables.container.restartPolicy) && (!has(variables.container.restartPolicyRules) || size(variables.container.restartPolicyRules) == 0) && (!has(variables.container.resizePolicy) || size(variables.container.resizePolicy) == 0) && (!has(variables.container.stdin) || variables.container.stdin == false) && (!has(variables.container.stdinOnce) || variables.container.stdinOnce == false) && (!has(variables.container.tty) || variables.container.tty == false) && !has(variables.container.workingDir) && !has(variables.container.terminationMessagePath) && !has(variables.container.terminationMessagePolicy)"
      message: "analysis input stager process shape is fixed"
    - expression: "(!has(variables.pod.imagePullSecrets) || size(variables.pod.imagePullSecrets) == 0) && (!has(variables.pod.nodeSelector) || size(variables.pod.nodeSelector) == 0) && (!has(variables.pod.tolerations) || size(variables.pod.tolerations) == 0) && !has(variables.pod.nodeName) && !has(variables.pod.hostname) && !has(variables.pod.hostnameOverride) && !has(variables.pod.subdomain) && !has(variables.pod.affinity) && !has(variables.pod.schedulerName) && !has(variables.pod.priority) && !has(variables.pod.priorityClassName) && !has(variables.pod.preemptionPolicy) && (!has(variables.pod.topologySpreadConstraints) || size(variables.pod.topologySpreadConstraints) == 0) && (!has(variables.pod.schedulingGates) || size(variables.pod.schedulingGates) == 0) && !has(variables.pod.schedulingGroup) && (!has(variables.pod.readinessGates) || size(variables.pod.readinessGates) == 0) && (!has(variables.pod.resourceClaims) || size(variables.pod.resourceClaims) == 0) && !has(variables.pod.resources) && !has(variables.pod.os) && !has(variables.pod.overhead)"
      message: "analysis input Jobs must not override placement, scheduling, devices, registry credentials, or network identity"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "aster.agentAnalysisShadowPublisherAdmissionName" . }}
  labels:
    {{- include "aster.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox-analysis-shadow-input
spec:
  policyName: {{ include "aster.agentAnalysisShadowPublisherAdmissionName" . }}
  validationActions: [Deny]
{{- end }}
