{{- include "aster.validateAgentSandboxFixRuntime" . -}}
{{- if .Values.agentSandbox.fixRuntime.enabled }}
{{- $clientSA := include "aster.agentSandboxClientServiceAccountName" . -}}
{{- $workloadSA := include "aster.agentSandboxWorkloadServiceAccountName" . -}}
{{- if .Values.agentSandbox.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $clientSA }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aster.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox-fix-client
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aster.agentSandboxAdmissionName" . }}
  namespace: {{ .Values.agentSandbox.fixRuntime.namespace }}
  labels:
    {{- include "aster.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox-fix-runtime
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  {{- if .Values.agentSandbox.fixRuntime.caBundle.existingConfigMap }}
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ .Values.agentSandbox.fixRuntime.caBundle.existingConfigMap | quote }}]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aster.agentSandboxAdmissionName" . }}
  namespace: {{ .Values.agentSandbox.fixRuntime.namespace }}
  labels:
    {{- include "aster.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox-fix-runtime
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aster.agentSandboxAdmissionName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ $clientSA }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.agentSandbox.fixRuntime.workloadServiceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $workloadSA }}
  namespace: {{ .Values.agentSandbox.fixRuntime.namespace }}
  labels:
    {{- include "aster.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox-fix-workload
automountServiceAccountToken: false
{{- end }}
{{- end }}
