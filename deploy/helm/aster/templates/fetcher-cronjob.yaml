{{- include "aster.validateAgentSandboxFixRuntime" . -}}
{{- include "aster.validateAI" . -}}
{{- if not (or (eq .Values.mode "cron") (eq .Values.mode "watch")) }}
{{- fail (printf "mode must be \"cron\" or \"watch\", got %q" .Values.mode) }}
{{- end }}
{{- if eq .Values.mode "cron" }}
{{- $restartPolicy := .Values.fetcher.restartPolicy | default "OnFailure" }}
{{- if not (or (eq $restartPolicy "Never") (eq $restartPolicy "OnFailure")) }}
  {{- fail "fetcher.restartPolicy must be Never or OnFailure" }}
{{- end }}
{{- $backoffLimitValue := printf "%v" .Values.fetcher.backoffLimit }}
{{- if not (regexMatch "^(-1|0|[1-9][0-9]{0,17})$" $backoffLimitValue) }}
  {{- fail "fetcher.backoffLimit must be -1 or a non-negative integer" }}
{{- end }}
{{- $backoffLimit := int64 $backoffLimitValue }}
{{- if gt $backoffLimit 2147483647 }}
  {{- fail "fetcher.backoffLimit must not exceed 2147483647" }}
{{- end }}
{{- $activeDeadlineValue := printf "%v" .Values.fetcher.activeDeadlineSeconds }}
{{- if not (regexMatch "^(0|[1-9][0-9]{0,17})$" $activeDeadlineValue) }}
  {{- fail "fetcher.activeDeadlineSeconds must be a non-negative integer" }}
{{- end }}
{{- $activeDeadlineSeconds := int64 $activeDeadlineValue }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "aster.fullname" . }}-fetcher
  labels:
    {{- include "aster.labels" . | nindent 4 }}
    app.kubernetes.io/component: fetcher
spec:
  schedule: {{ .Values.fetcher.schedule | quote }}
  suspend: {{ .Values.fetcher.suspend }}
  concurrencyPolicy: {{ .Values.fetcher.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.fetcher.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.fetcher.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      {{- if ge $backoffLimit 0 }}
      backoffLimit: {{ $backoffLimit }}
      {{- end }}
      {{- if gt $activeDeadlineSeconds 0 }}
      activeDeadlineSeconds: {{ $activeDeadlineSeconds }}
      {{- end }}
      template:
        metadata:
          labels:
            {{- include "aster.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: fetcher
        spec:
          restartPolicy: {{ $restartPolicy }}
          automountServiceAccountToken: false
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: fetcher
              image: {{ include "aster.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - /usr/local/bin/fetcher
                - -project-dir={{ .Values.project.mountPath }}
                - -out={{ .Values.persistence.mountPath }}
                - -builds={{ .Values.fetcher.buildsPerJob }}
                - -workers={{ .Values.fetcher.workers }}
                - -timeout={{ .Values.fetcher.timeout }}
                {{- if .Values.ai.enabled }}
                - -ai
                {{- end }}
                {{- if .Values.server.chat.enabled }}
                - -prepare-cause-findings
                {{- end }}
                {{- if gt (int .Values.ai.maxOutputTokens) 0 }}
                - -ai-max-output-tokens={{ .Values.ai.maxOutputTokens }}
                {{- end }}
              env:
                {{- if .Values.ai.enabled }}
                - name: AI_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "aster.aiSecret" . }}
                      key: {{ .Values.ai.tokenSecretKey }}
                - name: AI_API
                  value: {{ .Values.ai.api | quote }}
                {{- if .Values.ai.reasoningEffort }}
                - name: AI_REASONING_EFFORT
                  value: {{ .Values.ai.reasoningEffort | quote }}
                {{- end }}
                {{- if ne (printf "%v" .Values.analysisCache.generation) "" }}
                - name: AI_CACHE_GENERATION
                  value: {{ .Values.analysisCache.generation | quote }}
                {{- end }}
                {{- if .Values.ai.endpoint }}
                - name: AI_ENDPOINT
                  value: {{ .Values.ai.endpoint | quote }}
                {{- end }}
                {{- if .Values.ai.model }}
                - name: AI_MODEL
                  value: {{ .Values.ai.model | quote }}
                {{- end }}
                {{- if gt (int .Values.ai.contextWindowTokens) 0 }}
                - name: AI_CONTEXT_WINDOW_TOKENS
                  value: {{ .Values.ai.contextWindowTokens | quote }}
                {{- end }}
                {{- end }}
                {{- /* Read-only GitHub token, independent of ai.enabled: pull request triage reads GitHub with no model calls. */}}
                {{- if or .Values.ai.githubReadToken .Values.ai.githubReadTokenSecretName (and .Values.ai.enabled .Values.ai.existingSecret) }}
                - name: GITHUB_READ_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "aster.githubReadSecret" . }}
                      key: {{ .Values.ai.githubReadTokenSecretKey }}
                      {{- if and (not .Values.ai.githubReadToken) (not .Values.ai.githubReadTokenSecretName) }}
                      optional: true
                      {{- end }}
                {{- end }}
                {{- with .Values.fetcher.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              volumeMounts:
                - name: data
                  mountPath: {{ .Values.persistence.mountPath }}
                - name: project
                  mountPath: {{ .Values.project.mountPath }}
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                {{- toYaml .Values.fetcher.resources | nindent 16 }}
          {{- with .Values.fetcher.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.fetcher.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.fetcher.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ include "aster.pvcName" . }}
            - name: project
              configMap:
                name: {{ include "aster.projectConfigMap" . }}
                items:
                  {{- include "aster.projectVolumeItems" . | nindent 18 }}
            - name: tmp
              emptyDir: {}
{{- end }}
