{{- include "aster.validateNetworkSecurity" . -}}
{{- if .Values.networkPolicy.enabled }}
{{- $ingressValue := get .Values.networkPolicy "ingress" -}}
{{- $ingressDefined := and (hasKey .Values.networkPolicy "ingress") (not (kindIs "invalid" $ingressValue)) -}}
{{- $ingress := $ingressValue | default list -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aster.fullname" . }}-server
  labels:
    {{- include "aster.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  podSelector:
    matchLabels:
      {{- include "aster.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
  ingress:
    {{- if $ingressDefined }}
    {{- toYaml $ingress | nindent 4 }}
    {{- else }}
    []
    {{- end }}
{{- end }}
