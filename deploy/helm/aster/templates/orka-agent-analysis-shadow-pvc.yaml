{{- include "aster.validateAgentAnalysisShadow" . -}}
{{- $cfg := .Values.orka.agentAnalysisShadow -}}
{{- if and $cfg.enabled (not $cfg.ledger.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "aster.agentAnalysisShadowPVCName" . }}
  {{- if $cfg.ledger.retain }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    {{- include "aster.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-analysis-shadow-ledger
spec:
  accessModes:
    - {{ $cfg.ledger.accessMode }}
  resources:
    requests:
      storage: {{ $cfg.ledger.size }}
  {{- if $cfg.ledger.storageClass }}
  storageClassName: {{ $cfg.ledger.storageClass | quote }}
  {{- end }}
{{- end }}
