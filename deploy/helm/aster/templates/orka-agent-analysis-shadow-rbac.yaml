{{- include "aster.validateAgentAnalysisShadow" . -}}
{{- if and .Values.orka.agentAnalysisShadow.enabled .Values.orka.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aster.agentAnalysisShadowServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aster.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-analysis-shadow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aster.agentAnalysisShadowRBACName" . }}
  namespace: {{ .Values.orka.namespace }}
  labels:
    {{- include "aster.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-analysis-shadow
rules:
  - apiGroups: ["core.orka.ai"]
    resources: ["tasks"]
    verbs: ["create", "get", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aster.agentAnalysisShadowRBACName" . }}
  namespace: {{ .Values.orka.namespace }}
  labels:
    {{- include "aster.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-analysis-shadow
subjects:
  - kind: ServiceAccount
    name: {{ include "aster.agentAnalysisShadowServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "aster.agentAnalysisShadowRBACName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
