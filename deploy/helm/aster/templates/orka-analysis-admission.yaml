{{- include "aster.validateAnalysisRuntime" . -}}
{{- if eq .Values.analysisRuntime.type "orka-container" }}
{{- $cfg := .Values.analysisRuntime.orkaContainer -}}
{{- $analysisNamespace := include "aster.orkaAnalysisNamespace" . -}}
{{- $image := include "aster.analyzerImage" . -}}
{{- $stateSecret := include "aster.orkaAnalysisStateSecret" . -}}
{{- $githubReadSecret := or (ne .Values.ai.githubReadToken "") (ne .Values.ai.githubReadTokenSecretName "") -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "aster.orkaAnalysisAdmissionName" . }}
  labels:
    {{- include "aster.labels" . | nindent 4 }}
    app.kubernetes.io/component: orka-container-analysis
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["core.orka.ai"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["tasks"]
        scope: Namespaced
  matchConditions:
    - name: analysis-namespace
      expression: {{ printf "object.metadata.namespace == %s" (toJson $analysisNamespace) | quote }}
  validations:
    - expression: "object.spec.type == 'container'"
      message: "analysis Tasks must use type container"
    - expression: {{ printf "object.spec.image == %s" (toJson $image) | quote }}
      message: "analysis Tasks must use the configured analyzer image"
    - expression: "!has(object.spec.command) || size(object.spec.command) == 0"
      message: "analysis Tasks must use the analyzer image entrypoint"
    - expression: "object.spec.args == ['-data-dir=/tmp/prow-ai-analyzer']"
      message: "analysis Tasks must use the fixed analyzer arguments"
    - expression: {{ printf "duration(object.spec.timeout) == duration(%s)" (toJson (printf "%v" $cfg.taskTimeout)) | quote }}
      message: "analysis Tasks must use the configured timeout"
    - expression: {{ printf "object.spec.retryPolicy.maxRetries == %v" $cfg.retries | quote }}
      message: "analysis Tasks must use the configured retry count"
    - expression: "(!has(object.spec.retryPolicy.backoffMultiplier) || object.spec.retryPolicy.backoffMultiplier == 2.0) && !has(object.spec.retryPolicy.initialDelay)"
      message: "analysis Tasks must use the default retry timing"
    - expression: "!has(object.spec.resources) || ((!has(object.spec.resources.limits) || size(object.spec.resources.limits) == 0) && (!has(object.spec.resources.requests) || size(object.spec.resources.requests) == 0) && (!has(object.spec.resources.claims) || size(object.spec.resources.claims) == 0))"
      message: "analysis Tasks must not request custom resources"
    - expression: {{ printf "object.spec.execution.nodeSelector == %s" (toJson $cfg.nodeSelector) | quote }}
      message: "analysis Tasks must use the configured CPU node selector"
    - expression: "(!has(object.spec.execution.runtimeClassName) || object.spec.execution.runtimeClassName == '') && !has(object.spec.execution.workspace)"
      message: "analysis Tasks must not use a runtime class or execution workspace"
    {{- if $cfg.tolerations }}
    - expression: {{ printf "has(object.spec.execution.tolerations) && object.spec.execution.tolerations == %s" (toJson $cfg.tolerations) | quote }}
      message: "analysis Tasks must use only the configured tolerations"
    {{- else }}
    - expression: "!has(object.spec.execution.tolerations) || size(object.spec.execution.tolerations) == 0"
      message: "analysis Tasks must not add tolerations"
    {{- end }}
    {{- if $cfg.affinity }}
    - expression: {{ printf "has(object.spec.execution.affinity) && object.spec.execution.affinity == %s" (toJson $cfg.affinity) | quote }}
      message: "analysis Tasks must use only the configured affinity"
    {{- else }}
    - expression: "!has(object.spec.execution.affinity) || object.spec.execution.affinity == {}"
      message: "analysis Tasks must not add affinity"
    {{- end }}
    - expression: {{ printf "size(object.spec.env) == %d + (object.spec.env.exists(e, e.name == 'AI_CACHE_GENERATION') ? 1 : 0)" (add (add (add 10 (ternary 1 0 (gt (int .Values.ai.contextWindowTokens) 0))) (ternary 1 0 $githubReadSecret)) (ternary 1 0 (ne (printf "%v" .Values.ai.reasoningEffort) ""))) | quote }}
      message: "analysis Tasks must use the exact analyzer environment"
    - expression: "object.spec.env.all(e, e.name in ['PROW_AI_ANALYSIS_BUNDLE', 'PROW_AI_ANALYSIS_BUNDLE_SHA256', 'PROW_AI_TASK_NAMESPACE', 'PROW_AI_TASK_NAME', 'PROW_AI_CONTRACT_VERSION', 'AI_API', 'AI_ENDPOINT', 'AI_MODEL', 'AI_REASONING_EFFORT', 'AI_CACHE_GENERATION', 'AI_CONTEXT_WINDOW_TOKENS', 'AI_TOKEN', 'GITHUB_READ_TOKEN', 'PROW_AI_STATE_KEY'])"
      message: "analysis Tasks contain an unauthorized environment variable"
    - expression: "object.spec.env.exists(e, e.name == 'PROW_AI_ANALYSIS_BUNDLE' && has(e.valueFrom) && has(e.valueFrom.configMapKeyRef) && e.valueFrom.configMapKeyRef.name == object.metadata.name + '-input' && e.valueFrom.configMapKeyRef.key == 'bundle.json')"
      message: "analysis Tasks must use their content-addressed bundle"
    - expression: "object.spec.env.exists(e, e.name == 'PROW_AI_ANALYSIS_BUNDLE_SHA256' && has(e.value) && e.value.matches('^[0-9a-f]{64}$'))"
      message: "analysis Tasks must carry a valid bundle digest"
    - expression: {{ printf "object.spec.env.exists(e, e.name == 'PROW_AI_TASK_NAMESPACE' && has(e.value) && e.value == %s)" (toJson $analysisNamespace) | quote }}
      message: "analysis Tasks must use the configured namespace identity"
    - expression: "object.spec.env.exists(e, e.name == 'PROW_AI_TASK_NAME' && has(e.value) && e.value == object.metadata.name)"
      message: "analysis Tasks must bind their Task identity"
    - expression: "object.spec.env.exists(e, e.name == 'PROW_AI_CONTRACT_VERSION' && has(e.value) && e.value == 'dashboard-failure-analyzer-v7')"
      message: "analysis Tasks must use the current analyzer contract"
    - expression: {{ printf "object.spec.env.exists(e, e.name == 'AI_API' && has(e.value) && e.value == %s)" (toJson .Values.ai.api) | quote }}
      message: "analysis Tasks must use the configured model API"
    - expression: {{ printf "object.spec.env.exists(e, e.name == 'AI_ENDPOINT' && has(e.value) && e.value == %s)" (toJson .Values.ai.endpoint) | quote }}
      message: "analysis Tasks must use the configured model endpoint"
    - expression: {{ printf "object.spec.env.exists(e, e.name == 'AI_MODEL' && has(e.value) && e.value == %s)" (toJson .Values.ai.model) | quote }}
      message: "analysis Tasks must use the configured model"
    {{- if .Values.ai.reasoningEffort }}
    - expression: {{ printf "object.spec.env.exists(e, e.name == 'AI_REASONING_EFFORT' && has(e.value) && e.value == %s)" (toJson .Values.ai.reasoningEffort) | quote }}
      message: "analysis Tasks must use the configured reasoning effort"
    {{- else }}
    - expression: "!object.spec.env.exists(e, e.name == 'AI_REASONING_EFFORT')"
      message: "analysis Tasks must not add a reasoning effort override"
    {{- end }}
    {{- if ne (printf "%v" .Values.analysisCache.generation) "" }}
    - expression: {{ printf "object.spec.env.exists(e, e.name == 'AI_CACHE_GENERATION' && has(e.value) && e.value == %s)" (toJson (printf "%v" .Values.analysisCache.generation)) | quote }}
      message: "analysis Tasks must use the configured cache generation"
    {{- else }}
    - expression: "!object.spec.env.exists(e, e.name == 'AI_CACHE_GENERATION') || object.spec.env.exists(e, e.name == 'AI_CACHE_GENERATION' && has(e.value) && e.value.matches('^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'))"
      message: "analysis Tasks must use a valid project cache generation"
    {{- end }}
    {{- if gt (int .Values.ai.contextWindowTokens) 0 }}
    - expression: {{ printf "object.spec.env.exists(e, e.name == 'AI_CONTEXT_WINDOW_TOKENS' && has(e.value) && e.value == %s)" (toJson (printf "%v" .Values.ai.contextWindowTokens)) | quote }}
      message: "analysis Tasks must use the configured context window"
    {{- else }}
    - expression: "!object.spec.env.exists(e, e.name == 'AI_CONTEXT_WINDOW_TOKENS')"
      message: "analysis Tasks must not add a context window override"
    {{- end }}
    - expression: {{ printf "object.spec.env.exists(e, e.name == 'AI_TOKEN' && has(e.valueFrom) && has(e.valueFrom.secretKeyRef) && e.valueFrom.secretKeyRef.name == %s && e.valueFrom.secretKeyRef.key == %s)" (toJson $cfg.modelAuth.existingSecret) (toJson $cfg.modelAuth.tokenKey) | quote }}
      message: "analysis Tasks must use only the configured model Secret"
    {{- if $githubReadSecret }}
    - expression: {{ printf "object.spec.env.exists(e, e.name == 'GITHUB_READ_TOKEN' && has(e.valueFrom) && has(e.valueFrom.secretKeyRef) && e.valueFrom.secretKeyRef.name == %s && e.valueFrom.secretKeyRef.key == %s)" (toJson (include "aster.githubReadSecret" .)) (toJson .Values.ai.githubReadTokenSecretKey) | quote }}
      message: "analysis Tasks must use only the configured GitHub read Secret"
    {{- else }}
    - expression: "!object.spec.env.exists(e, e.name == 'GITHUB_READ_TOKEN')"
      message: "analysis Tasks must not use a GitHub read Secret when source credentials are not configured"
    {{- end }}
    - expression: {{ printf "object.spec.env.exists(e, e.name == 'PROW_AI_STATE_KEY' && has(e.valueFrom) && has(e.valueFrom.secretKeyRef) && e.valueFrom.secretKeyRef.name == %s && e.valueFrom.secretKeyRef.key == %s)" (toJson $stateSecret) (toJson $cfg.state.key) | quote }}
      message: "analysis Tasks must use only the configured state Secret"
    - expression: "(!has(object.spec.priority) || object.spec.priority == 500) && (!has(object.spec.webhookURL) || object.spec.webhookURL == '') && !has(object.spec.secretRef) && !has(object.spec.sessionRef)"
      message: "analysis Tasks must not add priority, webhooks, or Task-level Secret/session references"
    - expression: "(!has(object.spec.schedule) || object.spec.schedule == '') && !has(object.spec.timeZone) && (!has(object.spec.concurrencyPolicy) || object.spec.concurrencyPolicy == 'Forbid') && (!has(object.spec.startingDeadlineSeconds) || object.spec.startingDeadlineSeconds == 100) && (!has(object.spec.successfulRunsHistoryLimit) || object.spec.successfulRunsHistoryLimit == 3) && (!has(object.spec.failedRunsHistoryLimit) || object.spec.failedRunsHistoryLimit == 1) && (!has(object.spec.suspend) || object.spec.suspend == false)"
      message: "analysis Tasks must not schedule recurring executions"
    - expression: "!has(object.spec.ai) && !has(object.spec.agentRef) && (!has(object.spec.prompt) || object.spec.prompt == '') && !has(object.spec.agentRuntime) && !has(object.spec.workspace) && !has(object.spec.priorTaskRef) && !has(object.spec.requestedBy) && !has(object.spec.transaction)"
      message: "analysis Tasks must not add AI, agent, workspace, or transaction fields"
    - expression: "has(object.metadata.labels) && object.metadata.labels['app.kubernetes.io/managed-by'] == 'prow-ai-dashboard' && object.metadata.labels['prow-ai-dashboard/adapter'] == 'container-analyzer'"
      message: "analysis Tasks must carry the dashboard lifecycle labels"
    - expression: "has(object.metadata.annotations) && object.metadata.annotations['prow-ai-dashboard/contract-version'] == 'dashboard-failure-analyzer-v7' && object.metadata.annotations['prow-ai-dashboard/bundle-digest'].matches('^[0-9a-f]{64}$') && object.metadata.annotations['prow-ai-dashboard/state-key-fingerprint'].matches('^[0-9a-f]{64}$') && object.spec.env.exists(e, e.name == 'PROW_AI_ANALYSIS_BUNDLE_SHA256' && e.value == object.metadata.annotations['prow-ai-dashboard/bundle-digest'])"
      message: "analysis Tasks must carry the authenticated dashboard identity"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "aster.orkaAnalysisAdmissionName" . }}
  labels:
    {{- include "aster.labels" . | nindent 4 }}
    app.kubernetes.io/component: orka-container-analysis
spec:
  policyName: {{ include "aster.orkaAnalysisAdmissionName" . }}
  validationActions: [Deny]
{{- end }}
