{{- include "aster.validateAnalysisRuntime" . -}}
{{- $cfg := .Values.analysisRuntime.orkaContainer -}}
{{- $analysisNamespace := include "aster.orkaAnalysisNamespace" . -}}
{{- if and (eq .Values.analysisRuntime.type "orka-container") (not $cfg.state.existingSecret) -}}
{{- $name := include "aster.orkaAnalysisStateSecret" . -}}
{{- $keyName := $cfg.state.key -}}
{{- $encoded := randBytes 32 | b64enc -}}
{{- $local := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and $local (index $local.data $keyName) -}}
  {{- $encoded = index $local.data $keyName -}}
{{- else -}}
  {{- $remote := lookup "v1" "Secret" $analysisNamespace $name -}}
  {{- if and $remote (index $remote.data $keyName) -}}
    {{- $encoded = index $remote.data $keyName -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "aster.labels" . | nindent 4 }}
    app.kubernetes.io/component: orka-container-analysis-state
type: Opaque
data:
  {{ $keyName }}: {{ $encoded | quote }}
{{- if ne .Release.Namespace $analysisNamespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $analysisNamespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "aster.labels" . | nindent 4 }}
    app.kubernetes.io/component: orka-container-analysis-state
type: Opaque
data:
  {{ $keyName }}: {{ $encoded | quote }}
{{- end }}
{{- end }}
