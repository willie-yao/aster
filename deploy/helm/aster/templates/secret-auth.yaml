{{- $actions := .Values.server.actions.enabled -}}
{{- $interactive := include "aster.serverInteractive" . -}}
{{- if $interactive }}
{{- $a := .Values.server.actions }}
{{- if eq $a.mode "oauth" }}
{{- if not $a.oauth.existingSecret }}
{{- if or (not $a.oauth.clientSecret) (not $a.oauth.sessionKey) (and $actions (not $a.oauth.botToken)) }}
{{- fail "server.actions.oauth.clientSecret and sessionKey are required, and botToken is required when actions are enabled (or set oauth.existingSecret)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aster.authSecret" . }}
  labels:
    {{- include "aster.labels" . | nindent 4 }}
type: Opaque
stringData:
  OAUTH_CLIENT_SECRET: {{ $a.oauth.clientSecret | quote }}
  SESSION_KEY: {{ $a.oauth.sessionKey | quote }}
{{- if $actions }}
  BOT_TOKEN: {{ $a.oauth.botToken | quote }}
{{- end }}
{{- end }}
{{- else if eq $a.mode "proxy" }}
{{- if not $a.proxy.existingSecret }}
{{- if and $actions (not $a.proxy.botToken) }}
{{- fail "server.actions.proxy.botToken is required (or set proxy.existingSecret)" }}
{{- end }}
{{- if or (and $actions $a.proxy.botToken) $a.proxy.secret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aster.authSecret" . }}
  labels:
    {{- include "aster.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- if $actions }}
  BOT_TOKEN: {{ $a.proxy.botToken | quote }}
{{- end }}
{{- if $a.proxy.secret }}
  AUTH_PROXY_SECRET: {{ $a.proxy.secret | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- else }}
{{- fail (printf "server.actions.mode must be \"oauth\" or \"proxy\", got %q" $a.mode) }}
{{- end }}
{{- end }}
