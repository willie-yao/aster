{{- if and (or .Values.ai.enabled .Values.server.actions.enabled) .Values.ai.githubReadToken (not .Values.ai.githubReadTokenSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aster.githubReadSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aster.labels" . | nindent 4 }}
    app.kubernetes.io/component: source-grounding
type: Opaque
stringData:
  {{ .Values.ai.githubReadTokenSecretKey }}: {{ .Values.ai.githubReadToken | quote }}
{{- end }}
