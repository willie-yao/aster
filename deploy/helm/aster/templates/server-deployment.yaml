{{- include "aster.validateAgentSandboxFixRuntime" . -}}
{{- include "aster.validateNetworkSecurity" . -}}
{{- $actions := .Values.server.actions.enabled -}}
{{- $chat := .Values.server.chat.enabled -}}
{{- $escalation := .Values.server.pullRequestEscalation.enabled -}}
{{- $interactive := include "aster.serverInteractive" . -}}
{{- $agentSandboxActions := and .Values.agentSandbox.fixRuntime.enabled $actions -}}
{{- $a := .Values.server.actions -}}
{{- $extraHSTS := false -}}
{{- $extraInsecureCookies := false -}}
{{- $extraOAuthScope := false -}}
{{- $extraOAuthPrivateRepositories := false -}}
{{- $extraEscalation := false -}}
{{- $extraChatTimeout := false -}}
{{- range .Values.server.extraEnv -}}
{{- if eq (default "" .name) "HSTS_ENABLED" -}}
{{- $extraHSTS = true -}}
{{- end -}}
{{- if eq (default "" .name) "COOKIE_INSECURE" -}}
{{- $extraInsecureCookies = true -}}
{{- end -}}
{{- if eq (default "" .name) "OAUTH_SCOPE" -}}
{{- $extraOAuthScope = true -}}
{{- end -}}
{{- if eq (default "" .name) "OAUTH_PRIVATE_REPOSITORIES" -}}
{{- $extraOAuthPrivateRepositories = true -}}
{{- end -}}
{{- if eq (default "" .name) "PULL_REQUEST_ESCALATION_ENABLED" -}}
{{- $extraEscalation = true -}}
{{- end -}}
{{- if eq (default "" .name) "ANALYSIS_CHAT_TIMEOUT" -}}
{{- $extraChatTimeout = true -}}
{{- end -}}
{{- end -}}
{{- if $extraHSTS -}}
{{- fail "server.extraEnv must not set HSTS_ENABLED; use server.security.hsts.enabled" -}}
{{- end -}}
{{- if $extraInsecureCookies -}}
{{- fail "server.extraEnv must not set COOKIE_INSECURE; use server.development.allowInsecureCookies for local OAuth testing" -}}
{{- end -}}
{{- if or (hasKey $a.oauth "scope") (hasKey $a.oauth "chatScope") (hasKey $a.oauth "privateRepositories") -}}
{{- fail "server.actions.oauth.scope, chatScope, and privateRepositories are no longer supported; OAuth uses read:user and BOT_TOKEN performs writes" -}}
{{- end -}}
{{- if $extraOAuthScope -}}
{{- fail "server.extraEnv must not set OAUTH_SCOPE; OAuth uses read:user and BOT_TOKEN performs writes" -}}
{{- end -}}
{{- if $extraOAuthPrivateRepositories -}}
{{- fail "server.extraEnv must not set OAUTH_PRIVATE_REPOSITORIES; grant repository access to BOT_TOKEN instead" -}}
{{- end -}}
{{- if $extraEscalation -}}
{{- fail "server.extraEnv must not set PULL_REQUEST_ESCALATION_ENABLED; use server.pullRequestEscalation.enabled" -}}
{{- end -}}
{{- if $extraChatTimeout -}}
{{- fail "server.extraEnv must not set ANALYSIS_CHAT_TIMEOUT; use server.chat.timeout" -}}
{{- end -}}
{{- if and (not .Values.server.security.hsts.enabled) (not (or .Values.server.development.allowInsecureHTTP .Values.server.development.allowInsecureCookies)) -}}
{{- fail "server.security.hsts.enabled=false requires explicit local HTTP acknowledgement through server.development.allowInsecureHTTP=true" -}}
{{- end -}}
{{- if and .Values.server.development.allowInsecureHTTP .Values.server.security.hsts.enabled -}}
{{- fail "server.development.allowInsecureHTTP requires server.security.hsts.enabled=false" -}}
{{- end -}}
{{- if and .Values.server.development.allowInsecureCookies (not (and $interactive (eq $a.mode "oauth"))) -}}
{{- fail "server.development.allowInsecureCookies requires interactive OAuth mode" -}}
{{- end -}}
{{- if and .Values.server.development.allowInsecureCookies .Values.server.security.hsts.enabled -}}
{{- fail "server.development.allowInsecureCookies requires server.security.hsts.enabled=false" -}}
{{- end -}}
{{- if and $chat (not .Values.ai.enabled) -}}
{{- fail "server.chat.enabled requires ai.enabled" -}}
{{- end -}}
{{- if and $escalation (not .Values.ai.enabled) -}}
{{- fail "server.pullRequestEscalation.enabled requires ai.enabled" -}}
{{- end -}}
{{- if and $chat (le (int .Values.server.chat.maxSessions) 0) -}}
{{- fail "server.chat.maxSessions must be positive" -}}
{{- end -}}
{{- if and $chat (le (int .Values.server.chat.maxSessionsPerOwner) 0) -}}
{{- fail "server.chat.maxSessionsPerOwner must be positive" -}}
{{- end -}}
{{- if and $chat (le (int .Values.server.chat.maxActiveTurnsPerOwner) 0) -}}
{{- fail "server.chat.maxActiveTurnsPerOwner must be positive" -}}
{{- end -}}
{{- if and $chat (le (int .Values.server.chat.requestsPerMinute) 0) -}}
{{- fail "server.chat.requestsPerMinute must be positive" -}}
{{- end -}}
{{- if and $chat (gt (int .Values.server.chat.maxSessionsPerOwner) (int .Values.server.chat.maxSessions)) -}}
{{- fail "server.chat.maxSessionsPerOwner cannot exceed server.chat.maxSessions" -}}
{{- end -}}
{{- if and $chat (not .Values.server.chat.sessionTTL) -}}
{{- fail "server.chat.sessionTTL is required" -}}
{{- end -}}
{{- if and $chat (not .Values.server.chat.timeout) -}}
{{- fail "server.chat.timeout is required" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aster.fullname" . }}-server
  labels:
    {{- include "aster.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicaCount }}
  {{- if $chat }}
  # Chat state migrations require old replicas to stop before new replicas start.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "aster.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      {{- if and $interactive (not .Values.project.existingConfigMap) }}
      annotations:
        checksum/project-config: {{ include (print $.Template.BasePath "/configmap-project.yaml") . | sha256sum }}
      {{- end }}
      labels:
        {{- include "aster.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $agentSandboxActions }}
      serviceAccountName: {{ include "aster.agentSandboxFixClientServiceAccountName" . }}
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          {{- if $agentSandboxActions }}
          image: {{ include "aster.agentSandboxDashboardImage" . }}
          imagePullPolicy: {{ .Values.agentSandbox.fixRuntime.dashboardImage.pullPolicy }}
          {{- else }}
          image: {{ include "aster.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- end }}
          command:
            - /usr/local/bin/server
            - -addr=:{{ .Values.server.port }}
            - -data-dir={{ .Values.persistence.mountPath }}
            - -static-dir={{ .Values.server.staticDir }}
            {{- if $interactive }}
            - -project-dir={{ .Values.project.mountPath }}
            {{- end }}
          {{- if or $interactive .Values.server.security.hsts.enabled .Values.server.extraEnv }}
          env:
            {{- if .Values.server.security.hsts.enabled }}
            - name: HSTS_ENABLED
              value: "true"
            {{- end }}
            {{- if $interactive }}
            {{- if gt (int .Values.ai.maxOutputTokens) 0 }}
            - name: AI_MAX_OUTPUT_TOKENS
              value: {{ .Values.ai.maxOutputTokens | quote }}
            {{- end }}
            {{- if $actions }}
            - name: ACTIONS_ENABLED
              value: "true"
            {{- end }}
            {{- if $agentSandboxActions }}
            {{- include "aster.agentSandboxEnv" . | nindent 12 }}
            {{- end }}
            {{- if $escalation }}
            - name: PULL_REQUEST_ESCALATION_ENABLED
              value: "true"
            {{- end }}
            {{- if $chat }}
            - name: ANALYSIS_CHAT_ENABLED
              value: "true"
            - name: ANALYSIS_CHAT_STATE_DIR
              value: {{ printf "%s/.analysis-chat" .Values.persistence.mountPath | quote }}
            - name: ANALYSIS_CHAT_TIMEOUT
              value: {{ .Values.server.chat.timeout | quote }}
            - name: ANALYSIS_CHAT_SESSION_TTL
              value: {{ .Values.server.chat.sessionTTL | quote }}
            - name: ANALYSIS_CHAT_MAX_SESSIONS
              value: {{ .Values.server.chat.maxSessions | quote }}
            - name: ANALYSIS_CHAT_MAX_SESSIONS_PER_OWNER
              value: {{ .Values.server.chat.maxSessionsPerOwner | quote }}
            - name: ANALYSIS_CHAT_MAX_ACTIVE_TURNS_PER_OWNER
              value: {{ .Values.server.chat.maxActiveTurnsPerOwner | quote }}
            - name: ANALYSIS_CHAT_REQUESTS_PER_MINUTE
              value: {{ .Values.server.chat.requestsPerMinute | quote }}
            {{- end }}
            - name: AUTH_MODE
              value: {{ $a.mode | quote }}
            {{- if and (eq $a.mode "oauth") .Values.server.development.allowInsecureCookies }}
            - name: COOKIE_INSECURE
              value: "1"
            {{- end }}
            {{- if $a.admins }}
            - name: ADMIN_LOGINS
              value: {{ join "," $a.admins | quote }}
            {{- end }}
            {{- if eq $a.mode "oauth" }}
            - name: OAUTH_CLIENT_ID
              value: {{ $a.oauth.clientId | quote }}
            - name: OAUTH_REDIRECT_URL
              value: {{ $a.oauth.redirectUrl | quote }}
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "aster.authSecret" . }}
                  key: OAUTH_CLIENT_SECRET
            - name: SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aster.authSecret" . }}
                  key: SESSION_KEY
            {{- if $actions }}
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "aster.authSecret" . }}
                  key: BOT_TOKEN
            {{- end }}
            {{- else if eq $a.mode "proxy" }}
            - name: AUTH_PROXY_HEADER
              value: {{ $a.proxy.header | quote }}
            {{- if $actions }}
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "aster.authSecret" . }}
                  key: BOT_TOKEN
            {{- end }}
            {{- if or $a.proxy.secret $a.proxy.existingSecret }}
            - name: AUTH_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "aster.authSecret" . }}
                  key: AUTH_PROXY_SECRET
                  {{- if $a.proxy.existingSecret }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- end }}
            {{- with $a.trustedOrigins }}
            - name: TRUSTED_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.ai.enabled }}
            - name: AI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "aster.aiSecret" . }}
                  key: {{ .Values.ai.tokenSecretKey }}
            - name: AI_API
              value: {{ .Values.ai.api | quote }}
            {{- if .Values.ai.reasoningEffort }}
            - name: AI_REASONING_EFFORT
              value: {{ .Values.ai.reasoningEffort | quote }}
            {{- end }}
            {{- if ne (printf "%v" .Values.analysisCache.generation) "" }}
            - name: AI_CACHE_GENERATION
              value: {{ .Values.analysisCache.generation | quote }}
            {{- end }}
            {{- if .Values.ai.endpoint }}
            - name: AI_ENDPOINT
              value: {{ .Values.ai.endpoint | quote }}
            {{- end }}
            {{- if .Values.ai.model }}
            - name: AI_MODEL
              value: {{ .Values.ai.model | quote }}
            {{- end }}
            {{- if gt (int .Values.ai.contextWindowTokens) 0 }}
            - name: AI_CONTEXT_WINDOW_TOKENS
              value: {{ .Values.ai.contextWindowTokens | quote }}
            {{- end }}
            {{- end }}
            {{- /* Read-only GitHub token: escalation reads the pull request's changed files. */}}
            {{- if and $escalation (or .Values.ai.githubReadToken .Values.ai.githubReadTokenSecretName) }}
            - name: GITHUB_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "aster.githubReadSecret" . }}
                  key: {{ .Values.ai.githubReadTokenSecretKey }}
            {{- end }}
            {{- end }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
              # Interactive features persist private operational state.
              readOnly: {{ not $interactive }}
            {{- if $interactive }}
            - name: project
              mountPath: {{ .Values.project.mountPath }}
              readOnly: true
            {{- end }}
            {{- if $actions }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "aster.pvcName" . }}
        {{- if $interactive }}
        - name: project
          configMap:
            name: {{ include "aster.projectConfigMap" . }}
            items:
              {{- include "aster.projectVolumeItems" . | nindent 14 }}
        {{- end }}
        {{- if $actions }}
        - name: tmp
          emptyDir: {}
        {{- end }}
