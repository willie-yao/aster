{{- include "aster.validateAgentSandboxFixRuntime" . -}}
{{- include "aster.validateAgentSandboxCausalCritic" . -}}
{{- include "aster.validateAnalysisRuntime" . -}}
{{- include "aster.validateAgentAnalysisShadow" . -}}
{{- if eq .Values.mode "watch" }}
{{- $shadow := .Values.agentSandbox.analysisShadow.enabled }}
{{- $agentSandboxScheduled := eq (include "aster.agentSandboxScheduledEnabled" .) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aster.fullname" . }}-worker
  labels:
    {{- include "aster.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  # Single writer: Recreate ensures the old pod stops before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "aster.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      {{- $cmManaged := not .Values.project.existingConfigMap }}
      {{- $secretManaged := and .Values.ai.enabled (not .Values.ai.existingSecret) }}
      {{- if or $cmManaged $secretManaged }}
      annotations:
        {{- if $cmManaged }}
        checksum/project-config: {{ include (print $.Template.BasePath "/configmap-project.yaml") . | sha256sum }}
        {{- end }}
        {{- if $secretManaged }}
        checksum/ai-secret: {{ include (print $.Template.BasePath "/secret-ai.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "aster.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- if $agentSandboxScheduled }}
      serviceAccountName: {{ include "aster.agentSandboxScheduledClientServiceAccountName" . }}
      {{- end }}
      automountServiceAccountToken: {{ ternary "true" "false" $agentSandboxScheduled }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          {{- if $shadow }}
          image: {{ include "aster.agentAnalysisShadowDashboardImage" . }}
          imagePullPolicy: {{ .Values.agentSandbox.analysisShadow.dashboardImage.pullPolicy }}
          {{- else }}
          image: {{ include "aster.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- end }}
          command:
            - /usr/local/bin/worker
            - -project-dir={{ .Values.project.mountPath }}
            - -out={{ .Values.persistence.mountPath }}
            - -builds={{ .Values.fetcher.buildsPerJob }}
            - -workers={{ .Values.fetcher.workers }}
            - -timeout={{ .Values.fetcher.timeout }}
            - -watch-interval={{ .Values.fetcher.watchInterval }}
            - -reconcile-interval={{ .Values.fetcher.reconcileInterval }}
            {{- if .Values.ai.enabled }}
            - -ai
            {{- end }}
            {{- if .Values.server.chat.enabled }}
            - -prepare-cause-findings
            {{- end }}
            {{- if gt (int .Values.ai.maxOutputTokens) 0 }}
            - -ai-max-output-tokens={{ .Values.ai.maxOutputTokens }}
            {{- end }}
            {{- if $shadow }}
            - -agent-analysis-shadow
            - -agent-analysis-shadow-ledger={{ include "aster.agentAnalysisShadowLedgerPath" . }}
            - -agent-analysis-shadow-input-root={{ .Values.agentSandbox.analysisShadow.input.localRoot }}
            - -agent-analysis-shadow-max-per-run={{ .Values.agentSandbox.analysisShadow.maxPerRun }}
            - -agent-analysis-shadow-max-steps={{ .Values.agentSandbox.analysisShadow.maxSteps }}
            - -agent-analysis-shadow-timeout={{ .Values.agentSandbox.analysisShadow.timeout }}
            - -agent-analysis-shadow-output-limit-bytes={{ .Values.agentSandbox.analysisShadow.outputLimitBytes }}
            - -agent-analysis-shadow-model-context-tokens={{ .Values.agentSandbox.analysisShadow.modelContextTokens }}
            - -agent-analysis-shadow-model-output-tokens={{ .Values.agentSandbox.analysisShadow.modelOutputTokens }}
            - -agent-analysis-shadow-require-source-evidence={{ .Values.agentSandbox.analysisShadow.requireSourceEvidence }}
            - -agent-analysis-shadow-provider-endpoint={{ .Values.agentSandbox.analysisShadow.modelProvider.endpoint }}
            - -agent-analysis-shadow-provider-model={{ .Values.agentSandbox.analysisShadow.modelProvider.model }}
            - -agent-analysis-shadow-provider-api={{ .Values.agentSandbox.analysisShadow.modelProvider.api }}
            - -agent-analysis-shadow-credential-mode={{ .Values.agentSandbox.analysisShadow.modelProvider.credentialMode }}
            - -agent-analysis-shadow-provider-reasoning-effort={{ .Values.agentSandbox.analysisShadow.modelProvider.reasoningEffort }}
            - -agent-analysis-shadow-provider-auth-type={{ .Values.agentSandbox.analysisShadow.modelProvider.auth.type }}
            {{- end }}
            {{- if .Values.agentSandbox.causalCritic.enabled }}
            - -causal-critic-shadow
            - -causal-critic-shadow-ledger={{ include "aster.causalCriticLedgerPath" . }}
            - -causal-critic-shadow-max-per-run={{ .Values.agentSandbox.causalCritic.maxPerRun }}
            - -causal-critic-shadow-timeout={{ .Values.agentSandbox.causalCritic.timeout }}
            - -causal-critic-shadow-output-limit-bytes={{ .Values.agentSandbox.causalCritic.outputLimitBytes }}
            - -causal-critic-shadow-gateway-endpoint={{ .Values.agentSandbox.causalCritic.modelGateway.endpoint }}
            - -causal-critic-shadow-gateway-model={{ .Values.agentSandbox.causalCritic.modelGateway.model }}
            - -causal-critic-shadow-gateway-protocol={{ .Values.agentSandbox.causalCritic.modelGateway.protocolVersion }}
            {{- end }}
          env:
            {{- if $shadow }}
            {{- include "aster.agentAnalysisShadowEnv" . | nindent 12 }}
            {{- end }}
            {{- if .Values.agentSandbox.causalCritic.enabled }}
            {{- include "aster.agentSandboxCriticEnv" . | nindent 12 }}
            {{- end }}
            {{- if .Values.ai.enabled }}
            - name: AI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "aster.aiSecret" . }}
                  key: {{ .Values.ai.tokenSecretKey }}
            - name: AI_API
              value: {{ .Values.ai.api | quote }}
            {{- if .Values.ai.reasoningEffort }}
            - name: AI_REASONING_EFFORT
              value: {{ .Values.ai.reasoningEffort | quote }}
            {{- end }}
            {{- if ne (printf "%v" .Values.analysisCache.generation) "" }}
            - name: AI_CACHE_GENERATION
              value: {{ .Values.analysisCache.generation | quote }}
            {{- end }}
            {{- if .Values.ai.endpoint }}
            - name: AI_ENDPOINT
              value: {{ .Values.ai.endpoint | quote }}
            {{- end }}
            {{- if .Values.ai.model }}
            - name: AI_MODEL
              value: {{ .Values.ai.model | quote }}
            {{- end }}
            {{- if gt (int .Values.ai.contextWindowTokens) 0 }}
            - name: AI_CONTEXT_WINDOW_TOKENS
              value: {{ .Values.ai.contextWindowTokens | quote }}
            {{- end }}
            {{- end }}
            {{- /* Read-only GitHub token, independent of ai.enabled: pull request triage reads GitHub with no model calls. */}}
            {{- if or .Values.ai.githubReadToken .Values.ai.githubReadTokenSecretName (and .Values.ai.enabled .Values.ai.existingSecret) }}
            - name: GITHUB_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "aster.githubReadSecret" . }}
                  key: {{ .Values.ai.githubReadTokenSecretKey }}
                  {{- if and (not .Values.ai.githubReadToken) (not .Values.ai.githubReadTokenSecretName) }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- with .Values.fetcher.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- if $shadow }}
            - name: agent-analysis-shadow-ledger
              mountPath: {{ .Values.agentSandbox.analysisShadow.ledger.mountPath }}
            - name: agent-analysis-shadow-input
              mountPath: {{ .Values.agentSandbox.analysisShadow.input.localRoot }}
            {{- end }}
            {{- if .Values.agentSandbox.causalCritic.enabled }}
            - name: causal-critic-ledger
              mountPath: {{ .Values.agentSandbox.causalCritic.ledger.mountPath }}
            {{- end }}
            - name: project
              mountPath: {{ .Values.project.mountPath }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.fetcher.resources | nindent 12 }}
      {{- with .Values.fetcher.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.fetcher.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.fetcher.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "aster.pvcName" . }}
        {{- if $shadow }}
        - name: agent-analysis-shadow-ledger
          persistentVolumeClaim:
            claimName: {{ .Values.agentSandbox.analysisShadow.ledger.existingClaim }}
        - name: agent-analysis-shadow-input
          emptyDir:
            sizeLimit: {{ .Values.agentSandbox.analysisShadow.input.localSizeLimit }}
        {{- end }}
        {{- if .Values.agentSandbox.causalCritic.enabled }}
        - name: causal-critic-ledger
          persistentVolumeClaim:
            claimName: {{ .Values.agentSandbox.causalCritic.ledger.existingClaim }}
        {{- end }}
        - name: project
          configMap:
            name: {{ include "aster.projectConfigMap" . }}
            items:
              {{- include "aster.projectVolumeItems" . | nindent 14 }}
        - name: tmp
          emptyDir: {}
{{- end }}
