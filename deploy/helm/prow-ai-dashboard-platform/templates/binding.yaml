apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "prow-ai-dashboard-platform.bindingName" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "prow-ai-dashboard-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform-binding
data:
  applicationReleaseName: {{ .Values.application.releaseName | quote }}
  executionNamespace: {{ .Values.execution.namespace | quote }}
  runtimeClassName: {{ .Values.execution.runtimeClassName | quote }}
  executionPolicySHA256: {{ include "prow-ai-dashboard-platform.executionPolicyHash" . | quote }}
  modelGatewayEnabled: {{ .Values.modelGateway.enabled | quote }}
  {{- if .Values.modelGateway.enabled }}
  modelGatewayPublicHost: {{ .Values.modelGateway.publicHost | quote }}
  modelGatewayUpstreamHost: {{ .Values.modelGateway.upstreamHost | quote }}
  modelGatewayExecutionNamespace: {{ .Values.execution.namespace | quote }}
  modelGatewayTargetPort: {{ .Values.modelGateway.service.targetPort | quote }}
  modelGatewayPolicySHA256: {{ include "prow-ai-dashboard-platform.gatewayPolicyHash" . | quote }}
  {{- end }}
