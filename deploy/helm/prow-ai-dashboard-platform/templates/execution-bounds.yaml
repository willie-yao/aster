apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "prow-ai-dashboard-platform.fullname" . }}-execution
  namespace: {{ .Values.execution.namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "prow-ai-dashboard-platform.labels" . | nindent 4 }}
spec:
  hard:
    pods: {{ .Values.execution.quota.pods | quote }}
    count/sandboxes.agents.x-k8s.io: {{ .Values.execution.quota.sandboxes | quote }}
    requests.cpu: {{ .Values.execution.quota.requestsCPU | quote }}
    requests.memory: {{ .Values.execution.quota.requestsMemory | quote }}
    limits.cpu: {{ .Values.execution.quota.limitsCPU | quote }}
    limits.memory: {{ .Values.execution.quota.limitsMemory | quote }}
    requests.ephemeral-storage: {{ .Values.execution.quota.requestsEphemeralStorage | quote }}
    limits.ephemeral-storage: {{ .Values.execution.quota.limitsEphemeralStorage | quote }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "prow-ai-dashboard-platform.fullname" . }}-execution
  namespace: {{ .Values.execution.namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "prow-ai-dashboard-platform.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      min:
        cpu: {{ .Values.execution.limits.minCPU | quote }}
        memory: {{ .Values.execution.limits.minMemory | quote }}
        ephemeral-storage: {{ .Values.execution.limits.minEphemeralStorage | quote }}
      max:
        cpu: {{ .Values.execution.limits.maxCPU | quote }}
        memory: {{ .Values.execution.limits.maxMemory | quote }}
        ephemeral-storage: {{ .Values.execution.limits.maxEphemeralStorage | quote }}
