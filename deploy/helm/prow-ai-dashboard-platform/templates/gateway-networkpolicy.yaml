{{- if .Values.modelGateway.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "prow-ai-dashboard-platform.gatewayName" . }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prow-ai-dashboard-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-gateway
spec:
  podSelector:
    matchLabels:
      {{- include "prow-ai-dashboard-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: model-gateway
  policyTypes: [Ingress, Egress]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "prow-ai-dashboard-platform.gatewayName" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    prow-ai-dashboard/model-gateway-policy-sha256: {{ include "prow-ai-dashboard-platform.gatewayPolicyHash" . | quote }}
  labels:
    {{- include "prow-ai-dashboard-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-gateway
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "prow-ai-dashboard-platform.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: model-gateway
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.execution.namespace }}
      toPorts:
        - ports:
            - port: {{ .Values.modelGateway.service.targetPort | quote }}
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        {{- if .Values.modelGateway.networkPolicy.allowedFQDNs }}
        {{- range .Values.modelGateway.networkPolicy.allowedFQDNs }}
        - matchName: {{ . | quote }}
        {{- end }}
        {{- else }}
        - matchName: {{ .Values.modelGateway.upstreamHost | quote }}
        {{- end }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{- end }}
