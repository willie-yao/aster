# Submits the exact final analysis after deterministic evidence validation.
apiVersion: core.orka.ai/v1alpha1
kind: Tool
metadata:
  name: submit-analysis
  namespace: orka-system
spec:
  description: "Submit the final analysis. Include every required field and all evidence tokens from supporting artifact reads. A successful call becomes the Task result, so do not emit a separate final response."
  http:
    url: http://artifact-tool.orka-system.svc:8080/tool/submit_analysis
    method: POST
    authSecretRef:
      name: artifact-tool-auth
      key: token
    authInject: header
  parameters:
    type: object
    properties:
      summary: {type: string, minLength: 1}
      root_cause: {type: string, minLength: 1}
      severity:
        type: string
        enum: [Critical, High, Medium, Low]
      is_transient: {type: boolean}
      suggested_fix: {type: string, minLength: 1}
      relevant_files:
        type: array
        description: "Required source-repository paths. Use [] when no source files apply; never omit or use null."
        items: {type: string}
      evidence_tokens:
        type: array
        description: "Every evidence_token returned by supporting read_artifact, tail_artifact, and grep_artifact calls."
        items: {type: string}
    required: [summary, root_cause, severity, is_transient, suggested_fix, relevant_files, evidence_tokens]
