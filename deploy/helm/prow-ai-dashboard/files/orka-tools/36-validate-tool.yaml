# Deterministically verifies the exact final analysis and consumer skill evidence.
apiVersion: core.orka.ai/v1alpha1
kind: Tool
metadata:
  name: validate-analysis
  namespace: orka-system
spec:
  description: "Verify the exact final analysis object against evidence_tokens returned by successful read_artifact, tail_artifact, and grep_artifact calls. Copy validation_token from the successful result into the final JSON without changing any analysis field afterward."
  http:
    url: http://artifact-tool.orka-system.svc:8080/tool/validate_analysis
    method: POST
    authSecretRef:
      name: artifact-tool-auth
      key: token
    authInject: header
  parameters:
    type: object
    properties:
      analysis:
        type: object
        description: "The exact final analysis object that will be returned."
        properties:
          summary: {type: string}
          root_cause: {type: string}
          severity: {type: string}
          is_transient: {type: boolean}
          suggested_fix: {type: string}
          relevant_files:
            type: array
            items: {type: string}
        required: [summary, root_cause, severity, is_transient, suggested_fix, relevant_files]
      evidence_tokens:
        type: array
        description: "Every evidence_token returned by successful artifact content reads supporting this analysis."
        items: {type: string}
    required: [analysis, evidence_tokens]
