{{- include "prow-ai-dashboard.validateAgentSandboxAnalyzer" . -}}
{{- if .Values.agentSandbox.analyzer.enabled }}
{{- $cfg := .Values.agentSandbox.analyzer -}}
{{- $clientSA := include "prow-ai-dashboard.agentSandboxAnalyzerClientServiceAccountName" . -}}
{{- $requester := printf "system:serviceaccount:%s:%s" .Release.Namespace $clientSA -}}
{{- $executorImage := include "prow-ai-dashboard.agentSandboxAnalyzerExecutorImage" . -}}
{{- $workloadSA := include "prow-ai-dashboard.agentSandboxAnalyzerWorkloadServiceAccountName" . -}}
{{- $timeoutText := printf "%v" $cfg.timeout -}}
{{- $timeoutSeconds := 0 -}}
{{- if hasSuffix "m" $timeoutText -}}
  {{- $timeoutSeconds = mul (trimSuffix "m" $timeoutText | int) 60 -}}
{{- else -}}
  {{- $timeoutSeconds = trimSuffix "s" $timeoutText | int -}}
{{- end -}}
{{- $activeDeadline := add $timeoutSeconds 15 -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "prow-ai-dashboard.agentSandboxAnalyzerAdmissionName" . }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox-analyzer
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["agents.x-k8s.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["sandboxes"]
        scope: Namespaced
  matchConditions:
    - name: execution-namespace
      expression: {{ printf "object.metadata.namespace == %s" (toJson $cfg.namespace) | quote }}
    - name: analyzer-create-or-update
      expression: "request.operation == 'CREATE' || (has(oldObject.metadata.labels) && oldObject.metadata.labels['prow-ai-dashboard/purpose'] == 'analysis')"
  variables:
    - name: pod
      expression: "object.spec.podTemplate.spec"
    - name: container
      expression: "object.spec.podTemplate.spec.containers[0]"
  validations:
    - expression: {{ printf "request.operation != 'CREATE' || request.userInfo.username == %s" (toJson $requester) | quote }}
      message: "only the dashboard Agent Sandbox client may create analyzer workloads"
    - expression: "request.operation != 'UPDATE' || object.spec == oldObject.spec"
      message: "dashboard analyzer Sandbox workload specs are immutable"
    - expression: "request.operation != 'UPDATE' || object.metadata.labels == oldObject.metadata.labels"
      message: "dashboard analyzer Sandbox labels are immutable"
    - expression: "request.operation != 'UPDATE' || (has(object.metadata.annotations) && has(oldObject.metadata.annotations) && object.metadata.annotations['prow-ai-dashboard/execution-contract-sha256'] == oldObject.metadata.annotations['prow-ai-dashboard/execution-contract-sha256'] && object.metadata.annotations['prow-ai-dashboard/execution-id'] == oldObject.metadata.annotations['prow-ai-dashboard/execution-id'] && object.metadata.annotations['prow-ai-dashboard/prepared-manifest-sha256'] == oldObject.metadata.annotations['prow-ai-dashboard/prepared-manifest-sha256'])"
      message: "dashboard analyzer execution identity is immutable"
    - expression: "request.operation != 'CREATE' || (object.metadata.name.matches('^analysis-[a-z0-9-]+-[0-9a-f]{12}$') && has(object.metadata.labels) && size(object.metadata.labels) == 4 && object.metadata.labels['app.kubernetes.io/managed-by'] == 'prow-ai-dashboard' && object.metadata.labels['agents.x-k8s.io/created-by'] == 'prow-ai-dashboard' && object.metadata.labels['prow-ai-dashboard/execution'] == object.metadata.name && object.metadata.labels['prow-ai-dashboard/purpose'] == 'analysis' && (!has(object.metadata.finalizers) || size(object.metadata.finalizers) == 0))"
      message: "dashboard analyzer Sandboxes require exact content-addressed metadata"
    - expression: "request.operation != 'CREATE' || (has(object.metadata.annotations) && size(object.metadata.annotations) == 3 && object.metadata.annotations['prow-ai-dashboard/execution-contract-sha256'].matches('^[0-9a-f]{64}$') && size(object.metadata.annotations['prow-ai-dashboard/execution-id']) > 0 && object.metadata.annotations['prow-ai-dashboard/prepared-manifest-sha256'].matches('^[0-9a-f]{64}$'))"
      message: "dashboard analyzer Sandboxes require exact execution annotations"
    - expression: "object.spec.operatingMode == 'Running' && has(object.spec.shutdownTime) && object.spec.shutdownPolicy == 'Delete' && object.spec.service == false && (!has(object.spec.volumeClaimTemplates) || size(object.spec.volumeClaimTemplates) == 0)"
      message: "dashboard analyzer Sandboxes require bounded delete lifecycle without Services or PVC creation"
    - expression: "has(object.spec.podTemplate.metadata.labels) && size(object.spec.podTemplate.metadata.labels) == 2 && object.spec.podTemplate.metadata.labels['prow-ai-dashboard/execution'] == object.metadata.name && object.spec.podTemplate.metadata.labels['prow-ai-dashboard/purpose'] == 'analysis' && (!has(object.spec.podTemplate.metadata.annotations) || size(object.spec.podTemplate.metadata.annotations) == 0)"
      message: "dashboard analyzer Pod metadata is fixed"
    - expression: {{ printf "variables.pod.serviceAccountName == %s && (!has(variables.pod.serviceAccount) || variables.pod.serviceAccount == '') && has(variables.pod.automountServiceAccountToken) && variables.pod.automountServiceAccountToken == false && variables.pod.runtimeClassName == %s" (toJson $workloadSA) (toJson $cfg.runtimeClassName) | quote }}
      message: "dashboard analyzer identity and RuntimeClass must match configured values"
    - expression: {{ printf "variables.pod.restartPolicy == 'Never' && variables.pod.activeDeadlineSeconds == %d && variables.pod.terminationGracePeriodSeconds == 5 && has(variables.pod.enableServiceLinks) && variables.pod.enableServiceLinks == false" $activeDeadline | quote }}
      message: "dashboard analyzer Pod lifecycle must match configured bounds"
    - expression: "(!has(variables.pod.hostNetwork) || variables.pod.hostNetwork == false) && (!has(variables.pod.hostPID) || variables.pod.hostPID == false) && (!has(variables.pod.hostIPC) || variables.pod.hostIPC == false) && (!has(variables.pod.shareProcessNamespace) || variables.pod.shareProcessNamespace == false) && !has(variables.pod.hostUsers) && (!has(variables.pod.hostAliases) || size(variables.pod.hostAliases) == 0) && !has(variables.pod.dnsPolicy) && !has(variables.pod.dnsConfig) && !has(variables.pod.setHostnameAsFQDN)"
      message: "dashboard analyzer Sandboxes must not join host namespaces or override DNS"
    - expression: "has(variables.pod.securityContext) && variables.pod.securityContext.runAsNonRoot == true && variables.pod.securityContext.runAsUser == 65532 && variables.pod.securityContext.runAsGroup == 65532 && variables.pod.securityContext.fsGroup == 65532 && variables.pod.securityContext.seccompProfile.type == 'RuntimeDefault' && variables.pod.securityContext.appArmorProfile.type == 'RuntimeDefault' && (!has(variables.pod.securityContext.sysctls) || size(variables.pod.securityContext.sysctls) == 0) && (!has(variables.pod.securityContext.supplementalGroups) || size(variables.pod.securityContext.supplementalGroups) == 0) && !has(variables.pod.securityContext.supplementalGroupsPolicy) && !has(variables.pod.securityContext.fsGroupChangePolicy) && !has(variables.pod.securityContext.seLinuxChangePolicy) && !has(variables.pod.securityContext.seLinuxOptions) && !has(variables.pod.securityContext.windowsOptions)"
      message: "dashboard analyzer Pod security context is fixed"
    - expression: "size(variables.pod.containers) == 1 && (!has(variables.pod.initContainers) || size(variables.pod.initContainers) == 0) && (!has(variables.pod.ephemeralContainers) || size(variables.pod.ephemeralContainers) == 0)"
      message: "dashboard analyzer Sandboxes require exactly one executor and no init containers"
    - expression: {{ printf "variables.container.name == 'executor' && variables.container.image == %s && variables.container.imagePullPolicy == %s && (!has(variables.container.command) || size(variables.container.command) == 0) && (!has(variables.container.args) || size(variables.container.args) == 0)" (toJson $executorImage) (toJson $cfg.executorImage.pullPolicy) | quote }}
      message: "dashboard analyzer Sandboxes must use the configured immutable executor entrypoint"
    - expression: "has(variables.container.securityContext) && variables.container.securityContext.runAsNonRoot == true && variables.container.securityContext.runAsUser == 65532 && variables.container.securityContext.runAsGroup == 65532 && variables.container.securityContext.allowPrivilegeEscalation == false && variables.container.securityContext.readOnlyRootFilesystem == true && variables.container.securityContext.seccompProfile.type == 'RuntimeDefault' && variables.container.securityContext.appArmorProfile.type == 'RuntimeDefault' && has(variables.container.securityContext.capabilities) && size(variables.container.securityContext.capabilities.drop) == 1 && variables.container.securityContext.capabilities.drop[0] == 'ALL' && (!has(variables.container.securityContext.capabilities.add) || size(variables.container.securityContext.capabilities.add) == 0) && (!has(variables.container.securityContext.privileged) || variables.container.securityContext.privileged == false) && (!has(variables.container.securityContext.procMount) || variables.container.securityContext.procMount == 'Default') && !has(variables.container.securityContext.seLinuxOptions) && !has(variables.container.securityContext.windowsOptions)"
      message: "dashboard analyzer executor security context is fixed"
    - expression: "size(variables.container.env) == 1 && variables.container.env[0].name == 'PROW_AI_ANALYSIS_EXECUTION_REQUEST_B64' && has(variables.container.env[0].value) && size(variables.container.env[0].value) > 0 && size(variables.container.env[0].value) <= 131072 && variables.container.env[0].value.matches('^[A-Za-z0-9+/]+={0,2}$') && !has(variables.container.env[0].valueFrom) && (!has(variables.container.envFrom) || size(variables.container.envFrom) == 0)"
      message: "dashboard analyzer executor accepts only one bounded credential-free request"
    - expression: "(!has(variables.container.ports) || size(variables.container.ports) == 0) && (!has(variables.container.volumeDevices) || size(variables.container.volumeDevices) == 0) && !has(variables.container.lifecycle) && !has(variables.container.livenessProbe) && !has(variables.container.readinessProbe) && !has(variables.container.startupProbe) && !has(variables.container.restartPolicy) && (!has(variables.container.restartPolicyRules) || size(variables.container.restartPolicyRules) == 0) && (!has(variables.container.resizePolicy) || size(variables.container.resizePolicy) == 0) && (!has(variables.container.stdin) || variables.container.stdin == false) && (!has(variables.container.stdinOnce) || variables.container.stdinOnce == false) && (!has(variables.container.tty) || variables.container.tty == false) && !has(variables.container.workingDir) && !has(variables.container.terminationMessagePath) && !has(variables.container.terminationMessagePolicy)"
      message: "dashboard analyzer executor process shape is fixed"
    - expression: {{ printf "size(variables.container.resources.requests) == 3 && size(variables.container.resources.limits) == 3 && (!has(variables.container.resources.claims) || size(variables.container.resources.claims) == 0) && variables.container.resources.requests['cpu'] == %s && variables.container.resources.requests['memory'] == %s && variables.container.resources.requests['ephemeral-storage'] == %s && variables.container.resources.limits['cpu'] == %s && variables.container.resources.limits['memory'] == %s && variables.container.resources.limits['ephemeral-storage'] == %s" (toJson (index $cfg.resources.requests "cpu")) (toJson (index $cfg.resources.requests "memory")) (toJson (index $cfg.resources.requests "ephemeral-storage")) (toJson (index $cfg.resources.limits "cpu")) (toJson (index $cfg.resources.limits "memory")) (toJson (index $cfg.resources.limits "ephemeral-storage")) | quote }}
      message: "dashboard analyzer executor resources must match configured bounds"
    - expression: "size(variables.container.volumeMounts) == 4 && variables.container.volumeMounts.exists(v, v.name == 'input' && v.mountPath == '/workspace/source' && v.readOnly == true && has(v.subPath) && v.subPath == object.metadata.annotations['prow-ai-dashboard/prepared-manifest-sha256'] + '/source' && !has(v.subPathExpr) && !has(v.mountPropagation)) && variables.container.volumeMounts.exists(v, v.name == 'input' && v.mountPath == '/workspace/artifacts' && v.readOnly == true && has(v.subPath) && v.subPath == object.metadata.annotations['prow-ai-dashboard/prepared-manifest-sha256'] + '/artifacts' && !has(v.subPathExpr) && !has(v.mountPropagation)) && variables.container.volumeMounts.exists(v, v.name == 'result' && v.mountPath == '/workspace/result' && (!has(v.readOnly) || v.readOnly == false) && !has(v.subPath) && !has(v.subPathExpr) && !has(v.mountPropagation)) && variables.container.volumeMounts.exists(v, v.name == 'executor-tmp' && v.mountPath == '/tmp' && !has(v.subPath) && !has(v.subPathExpr) && (!has(v.readOnly) || v.readOnly == false) && !has(v.mountPropagation))"
      message: "dashboard analyzer executor may read only one content-addressed source and artifact snapshot and write only result and temporary storage"
    - expression: {{ printf "size(variables.pod.volumes) == 3 && variables.pod.volumes.exists(v, v.name == 'input' && has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == %s && v.persistentVolumeClaim.readOnly == true && !has(v.emptyDir) && !has(v.hostPath) && !has(v.secret) && !has(v.configMap) && !has(v.projected) && !has(v.csi) && !has(v.ephemeral)) && variables.pod.volumes.exists(v, v.name == 'result' && has(v.emptyDir) && v.emptyDir.sizeLimit == '4Mi' && !has(v.persistentVolumeClaim) && !has(v.hostPath) && !has(v.secret) && !has(v.configMap) && !has(v.projected) && !has(v.csi) && !has(v.ephemeral)) && variables.pod.volumes.exists(v, v.name == 'executor-tmp' && has(v.emptyDir) && v.emptyDir.sizeLimit == '64Mi' && !has(v.persistentVolumeClaim) && !has(v.hostPath) && !has(v.secret) && !has(v.configMap) && !has(v.projected) && !has(v.csi) && !has(v.ephemeral))" (toJson $cfg.input.existingClaim) | quote }}
      message: "dashboard analyzer storage is limited to the pinned read-only input claim and fresh bounded result and temporary volumes"
    - expression: "(!has(variables.pod.imagePullSecrets) || size(variables.pod.imagePullSecrets) == 0) && (!has(variables.pod.nodeSelector) || size(variables.pod.nodeSelector) == 0) && (!has(variables.pod.tolerations) || size(variables.pod.tolerations) == 0) && !has(variables.pod.nodeName) && !has(variables.pod.hostname) && !has(variables.pod.hostnameOverride) && !has(variables.pod.subdomain) && !has(variables.pod.affinity) && !has(variables.pod.schedulerName) && !has(variables.pod.priority) && !has(variables.pod.priorityClassName) && !has(variables.pod.preemptionPolicy) && (!has(variables.pod.topologySpreadConstraints) || size(variables.pod.topologySpreadConstraints) == 0) && (!has(variables.pod.schedulingGates) || size(variables.pod.schedulingGates) == 0) && !has(variables.pod.schedulingGroup) && (!has(variables.pod.readinessGates) || size(variables.pod.readinessGates) == 0) && (!has(variables.pod.resourceClaims) || size(variables.pod.resourceClaims) == 0) && !has(variables.pod.resources) && !has(variables.pod.os) && !has(variables.pod.overhead)"
      message: "dashboard analyzer Sandboxes must not override placement, scheduling, devices, registry credentials, or network identity"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "prow-ai-dashboard.agentSandboxAnalyzerAdmissionName" . }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox-analyzer
spec:
  policyName: {{ include "prow-ai-dashboard.agentSandboxAnalyzerAdmissionName" . }}
  validationActions: [Deny]
{{- end }}
