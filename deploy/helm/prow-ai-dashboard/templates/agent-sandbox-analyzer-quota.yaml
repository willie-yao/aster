{{- include "prow-ai-dashboard.validateAgentSandboxAnalyzer" . -}}
{{- if and .Values.agentSandbox.analyzer.enabled .Values.agentSandbox.analyzer.quota.enabled }}
{{- $cfg := .Values.agentSandbox.analyzer -}}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "prow-ai-dashboard.agentSandboxAnalyzerAdmissionName" . }}
  namespace: {{ $cfg.namespace }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox-analyzer
spec:
  hard:
    count/sandboxes.agents.x-k8s.io: "1"
    count/pods: "1"
    requests.cpu: {{ index $cfg.resources.requests "cpu" | quote }}
    requests.memory: {{ index $cfg.resources.requests "memory" | quote }}
    requests.ephemeral-storage: {{ index $cfg.resources.requests "ephemeral-storage" | quote }}
    limits.cpu: {{ index $cfg.resources.limits "cpu" | quote }}
    limits.memory: {{ index $cfg.resources.limits "memory" | quote }}
    limits.ephemeral-storage: {{ index $cfg.resources.limits "ephemeral-storage" | quote }}
{{- end }}
