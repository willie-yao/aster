{{- include "prow-ai-dashboard.validateAgentSandboxCausalCritic" . -}}
{{- if .Values.agentSandbox.causalCritic.enabled }}
{{- $clientSA := include "prow-ai-dashboard.agentSandboxClientServiceAccountName" . -}}
{{- $workloadSA := include "prow-ai-dashboard.agentSandboxCriticWorkloadServiceAccountName" . -}}
{{- if and .Values.agentSandbox.rbac.create (not .Values.agentSandbox.fixRuntime.enabled) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $clientSA }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox-client
---
{{- end }}
{{- if .Values.agentSandbox.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "prow-ai-dashboard.agentSandboxCriticAdmissionName" . }}
  namespace: {{ .Values.agentSandbox.causalCritic.namespace }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox-causal-critic
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "prow-ai-dashboard.agentSandboxCriticAdmissionName" . }}
  namespace: {{ .Values.agentSandbox.causalCritic.namespace }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox-causal-critic
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "prow-ai-dashboard.agentSandboxCriticAdmissionName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ $clientSA }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.agentSandbox.causalCritic.workloadServiceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $workloadSA }}
  namespace: {{ .Values.agentSandbox.causalCritic.namespace }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox-causal-critic-workload
automountServiceAccountToken: false
{{- end }}
{{- end }}
