{{- include "prow-ai-dashboard.validateAnalysis" . -}}
{{- if not (or (eq .Values.mode "cron") (eq .Values.mode "watch")) }}
{{- fail (printf "mode must be \"cron\" or \"watch\", got %q" .Values.mode) }}
{{- end }}
{{- if eq .Values.mode "cron" }}
{{- $orka := eq .Values.analysis "orka" }}
{{- $orkaAccess := or $orka .Values.orka.fixRuntime.enabled }}
{{- $hasTaskExecution := or (not (empty .Values.orka.taskExecution.nodeSelector)) (not (empty .Values.orka.taskExecution.tolerations)) (not (empty .Values.orka.taskExecution.affinity)) }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "prow-ai-dashboard.fullname" . }}-fetcher
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: fetcher
spec:
  schedule: {{ .Values.fetcher.schedule | quote }}
  suspend: {{ .Values.fetcher.suspend }}
  concurrencyPolicy: {{ .Values.fetcher.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.fetcher.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.fetcher.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "prow-ai-dashboard.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: fetcher
        spec:
          restartPolicy: OnFailure
          {{- if $orkaAccess }}
          serviceAccountName: {{ include "prow-ai-dashboard.orkaServiceAccountName" . }}
          automountServiceAccountToken: true
          {{- else }}
          automountServiceAccountToken: false
          {{- end }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          {{- if $orka }}
          # Orka analysis: fetch the skeleton (-ai=false), produce one Task per
          # failing test, then ingest the results. The engine's in-process AI is
          # not used; Orka + the tool shim + a Provider must already be installed.
          initContainers:
            - name: fetch
              {{- if .Values.orka.fixRuntime.enabled }}
              image: {{ include "prow-ai-dashboard.fixerImage" . }}
              imagePullPolicy: {{ .Values.orka.fixRuntime.image.pullPolicy }}
              {{- else }}
              image: {{ include "prow-ai-dashboard.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              {{- end }}
              command:
                - /usr/local/bin/fetcher
                - -project-dir={{ .Values.project.mountPath }}
                - -out={{ .Values.persistence.mountPath }}
                - -ai=false
                - -skip-side-effects
                - -builds={{ .Values.fetcher.buildsPerJob }}
                - -workers={{ .Values.fetcher.workers }}
                - -timeout={{ .Values.fetcher.timeout }}
                {{- if .Values.fetcher.includePresubmits }}
                - -include-presubmits
                {{- end }}
              {{- with .Values.fetcher.extraEnv }}
              env:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              volumeMounts:
                - { name: data, mountPath: {{ .Values.persistence.mountPath }} }
                - { name: project, mountPath: {{ .Values.project.mountPath }}, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              resources:
                {{- toYaml .Values.fetcher.resources | nindent 16 }}
            - name: produce
              image: {{ include "prow-ai-dashboard.orkaProducerImage" . }}
              imagePullPolicy: {{ .Values.orka.producer.image.pullPolicy }}
              command:
                - /app
                - -data={{ .Values.persistence.mountPath }}
                - -project-dir={{ .Values.project.mountPath }}
                - -tool-manifests=/base-tools
                - -tasks-out=/tmp/tasks
                - -tools-out=/tmp/build-tools
                - -tool-auth-secret={{ include "prow-ai-dashboard.orkaArtifactToolSecret" . }}
                - -tool-auth-key={{ .Values.orka.artifactTool.auth.tokenKey }}
                - -apply
                - -namespace={{ .Values.orka.namespace }}
                - -provider={{ .Values.orka.provider }}
                - -model={{ .Values.orka.model }}
                - -version={{ .Values.orka.version }}
                - -timeout={{ .Values.orka.taskTimeout }}
                - -retries={{ .Values.orka.retries | int }}
                - -max-concurrent-tasks={{ .Values.orka.producer.maxConcurrentTasks | int }}
                - -task-poll={{ .Values.orka.producer.taskPoll }}
                - -wave-timeout={{ .Values.orka.producer.waveTimeout }}
                {{- if $hasTaskExecution }}
                - {{ printf "-task-execution=%s" (toJson .Values.orka.taskExecution) | quote }}
                {{- end }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              volumeMounts:
                - { name: data, mountPath: {{ .Values.persistence.mountPath }} }
                - { name: project, mountPath: {{ .Values.project.mountPath }}, readOnly: true }
                - { name: base-tools, mountPath: /base-tools, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          containers:
            - name: ingest
              {{- if .Values.orka.fixRuntime.enabled }}
              image: {{ include "prow-ai-dashboard.fixerImage" . }}
              imagePullPolicy: {{ .Values.orka.fixRuntime.image.pullPolicy }}
              {{- else }}
              image: {{ include "prow-ai-dashboard.orkaIngestorImage" . }}
              imagePullPolicy: {{ .Values.orka.ingestor.image.pullPolicy }}
              {{- end }}
              command:
                {{- if .Values.orka.fixRuntime.enabled }}
                - /usr/local/bin/orka-ingestor
                {{- else }}
                - /app
                {{- end }}
                - -data={{ .Values.persistence.mountPath }}
                - -project-dir={{ .Values.project.mountPath }}
                - -api={{ .Values.orka.apiBase }}
                - -token-file=/var/run/secrets/kubernetes.io/serviceaccount/token
                - -namespace={{ .Values.orka.namespace }}
                - -version={{ .Values.orka.version }}
                - -provider={{ .Values.orka.provider }}
                - -model={{ .Values.orka.model }}
                - -wait={{ .Values.orka.ingestWait }}
                - -pattern-wait={{ .Values.orka.patternWait }}
                - -pattern-timeout={{ .Values.orka.taskTimeout }}
                - -pattern-retries={{ .Values.orka.retries | int }}
                {{- if $hasTaskExecution }}
                - {{ printf "-task-execution=%s" (toJson .Values.orka.taskExecution) | quote }}
                {{- end }}
                {{- if not .Values.orka.sideEffects.enabled }}
                - -skip-side-effects
                {{- end }}
                - -gc=true
              {{- if or .Values.ai.enabled .Values.fetcher.extraEnv }}
              env:
                {{- if .Values.ai.enabled }}
                - name: AI_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "prow-ai-dashboard.aiSecret" . }}
                      key: {{ .Values.ai.tokenSecretKey }}
                {{- if .Values.ai.endpoint }}
                - name: AI_ENDPOINT
                  value: {{ .Values.ai.endpoint | quote }}
                {{- end }}
                {{- if .Values.ai.model }}
                - name: AI_MODEL
                  value: {{ .Values.ai.model | quote }}
                {{- end }}
                {{- end }}
                {{- with .Values.fetcher.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              {{- end }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              volumeMounts:
                - { name: data, mountPath: {{ .Values.persistence.mountPath }} }
                - { name: project, mountPath: {{ .Values.project.mountPath }}, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              resources:
                {{- toYaml .Values.fetcher.resources | nindent 16 }}
          {{- else }}
          containers:
            - name: fetcher
              {{- if .Values.orka.fixRuntime.enabled }}
              image: {{ include "prow-ai-dashboard.fixerImage" . }}
              imagePullPolicy: {{ .Values.orka.fixRuntime.image.pullPolicy }}
              {{- else }}
              image: {{ include "prow-ai-dashboard.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              {{- end }}
              command:
                - /usr/local/bin/fetcher
                - -project-dir={{ .Values.project.mountPath }}
                - -out={{ .Values.persistence.mountPath }}
                - -builds={{ .Values.fetcher.buildsPerJob }}
                - -workers={{ .Values.fetcher.workers }}
                - -timeout={{ .Values.fetcher.timeout }}
                {{- if .Values.fetcher.includePresubmits }}
                - -include-presubmits
                {{- end }}
                {{- if .Values.ai.enabled }}
                - -ai
                {{- end }}
              env:
                {{- if .Values.ai.enabled }}
                - name: AI_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "prow-ai-dashboard.aiSecret" . }}
                      key: {{ .Values.ai.tokenSecretKey }}
                {{- if .Values.ai.endpoint }}
                - name: AI_ENDPOINT
                  value: {{ .Values.ai.endpoint | quote }}
                {{- end }}
                {{- if .Values.ai.model }}
                - name: AI_MODEL
                  value: {{ .Values.ai.model | quote }}
                {{- end }}
                {{- if or .Values.ai.githubReadToken .Values.ai.existingSecret }}
                - name: GITHUB_READ_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "prow-ai-dashboard.aiSecret" . }}
                      key: {{ .Values.ai.githubReadTokenSecretKey }}
                      optional: true
                {{- end }}
                {{- end }}
                {{- with .Values.fetcher.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              volumeMounts:
                - name: data
                  mountPath: {{ .Values.persistence.mountPath }}
                - name: project
                  mountPath: {{ .Values.project.mountPath }}
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                {{- toYaml .Values.fetcher.resources | nindent 16 }}
          {{- end }}
          {{- with .Values.fetcher.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.fetcher.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.fetcher.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ include "prow-ai-dashboard.pvcName" . }}
            - name: project
              configMap:
                name: {{ include "prow-ai-dashboard.projectConfigMap" . }}
                items:
                  {{- include "prow-ai-dashboard.projectVolumeItems" . | nindent 18 }}
            {{- if $orka }}
            - name: base-tools
              configMap:
                name: {{ include "prow-ai-dashboard.orkaBaseToolsConfigMap" . }}
            {{- end }}
            - name: tmp
              emptyDir: {}
{{- end }}
