{{- include "prow-ai-dashboard.validateNetworkSecurity" . -}}
{{- if .Values.networkPolicy.enabled }}
{{- $ingressValue := get .Values.networkPolicy "ingress" -}}
{{- $ingressDefined := and (hasKey .Values.networkPolicy "ingress") (not (kindIs "invalid" $ingressValue)) -}}
{{- $ingress := $ingressValue | default list -}}
{{- $legacyFrom := .Values.networkPolicy.from | default list -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "prow-ai-dashboard.fullname" . }}-server
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  podSelector:
    matchLabels:
      {{- include "prow-ai-dashboard.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
  ingress:
    {{- if $ingressDefined }}
    {{- toYaml $ingress | nindent 4 }}
    {{- else if $legacyFrom }}
    - from:
        {{- toYaml $legacyFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.server.port }}
    {{- else }}
    []
    {{- end }}
{{- end }}
