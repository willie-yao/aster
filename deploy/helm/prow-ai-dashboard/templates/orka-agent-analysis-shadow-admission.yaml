{{- include "prow-ai-dashboard.validateAgentAnalysisShadow" . -}}
{{- if .Values.orka.agentAnalysisShadow.enabled }}
{{- $cfg := .Values.orka.agentAnalysisShadow -}}
{{- $admission := $cfg.admission -}}
{{- $serviceAccount := include "prow-ai-dashboard.agentAnalysisShadowServiceAccountName" . -}}
{{- $requester := printf "system:serviceaccount:%s:%s" .Release.Namespace $serviceAccount -}}
{{- $repository := printf "https://github.com/%s/%s.git" $admission.repository.owner $admission.repository.name -}}
{{- $taskNamePattern := printf "^analysis-[0-9a-f]{16}-%s$" $cfg.agentVersion -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "prow-ai-dashboard.agentAnalysisShadowAdmissionName" . }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-analysis-shadow
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["core.orka.ai"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["tasks"]
        scope: Namespaced
  matchConditions:
    - name: dashboard-shadow-requester
      expression: {{ printf "request.operation == 'CREATE' ? request.userInfo.username == %s : (request.operation == 'DELETE' ? request.userInfo.username == %s : (request.userInfo.username == %s || (has(oldObject.metadata.labels) && 'app.kubernetes.io/managed-by' in oldObject.metadata.labels && 'prow-ai-dashboard/runtime' in oldObject.metadata.labels && oldObject.metadata.labels['app.kubernetes.io/managed-by'] == 'orka-agent-analysis' && oldObject.metadata.labels['prow-ai-dashboard/runtime'] == 'failure-analysis-shadow' && has(oldObject.metadata.annotations) && 'prow-ai-dashboard/agent-analysis-contract' in oldObject.metadata.annotations && oldObject.metadata.annotations['prow-ai-dashboard/agent-analysis-contract'] == 'agent-analysis-v1')))" (toJson $requester) (toJson $requester) (toJson $requester) | quote }}
    - name: dashboard-shadow-namespace
      expression: {{ printf "(request.operation == 'DELETE' ? oldObject.metadata.namespace : object.metadata.namespace) == %s" (toJson .Values.orka.namespace) | quote }}
  validations:
    - expression: "request.operation != 'DELETE' || (has(oldObject.metadata.labels) && size(oldObject.metadata.labels) == 2 && 'app.kubernetes.io/managed-by' in oldObject.metadata.labels && 'prow-ai-dashboard/runtime' in oldObject.metadata.labels && oldObject.metadata.labels['app.kubernetes.io/managed-by'] == 'orka-agent-analysis' && oldObject.metadata.labels['prow-ai-dashboard/runtime'] == 'failure-analysis-shadow' && has(oldObject.metadata.annotations) && size(oldObject.metadata.annotations) == 3 && 'prow-ai-dashboard/agent-analysis-contract' in oldObject.metadata.annotations && 'orka.ai/disable-coordination-tool-injection' in oldObject.metadata.annotations && 'prow-ai-dashboard/action-request' in oldObject.metadata.annotations && oldObject.metadata.annotations['prow-ai-dashboard/agent-analysis-contract'] == 'agent-analysis-v1' && oldObject.metadata.annotations['orka.ai/disable-coordination-tool-injection'] == 'true' && oldObject.metadata.annotations['prow-ai-dashboard/action-request'].matches('^agent-analysis-[0-9a-f]{16}$'))"
      message: "the shadow ServiceAccount may delete only exact shadow-analysis Tasks"
    - expression: "request.operation == 'DELETE' || request.operation != 'UPDATE' || (object.spec == oldObject.spec && object.metadata.labels == oldObject.metadata.labels && object.metadata.annotations == oldObject.metadata.annotations)"
      message: "agent analysis shadow Task contracts are immutable after creation"
    - expression: {{ printf "request.operation == 'DELETE' || object.metadata.name.matches(%s)" (toJson $taskNamePattern) | quote }}
      message: "agent analysis shadow Tasks must use the declared Agent version identity"
    - expression: "request.operation == 'DELETE' || (object.spec.type == 'agent' && (!has(object.spec.image) || object.spec.image == '') && (!has(object.spec.command) || size(object.spec.command) == 0) && (!has(object.spec.args) || size(object.spec.args) == 0) && (!has(object.spec.env) || size(object.spec.env) == 0) && !has(object.spec.secretRef))"
      message: "agent analysis shadow Tasks must use only the approved Agent runtime"
    - expression: {{ printf "request.operation == 'DELETE' || (has(object.spec.agentRef) && object.spec.agentRef.name == %s && object.spec.agentRef.namespace == %s)" (toJson $admission.agentRef) (toJson .Values.orka.namespace) | quote }}
      message: "agent analysis shadow Tasks must use the approved Agent"
    - expression: {{ printf "request.operation == 'DELETE' || (has(object.spec.agentRuntime) && has(object.spec.agentRuntime.workspace) && object.spec.agentRuntime.workspace.gitRepo == %s && object.spec.agentRuntime.workspace.ref.matches('^[0-9a-f]{40}$'))" (toJson $repository) | quote }}
      message: "agent analysis shadow Tasks must use the approved repository at an immutable commit"
    {{- if $admission.gitSecret }}
    - expression: {{ printf "request.operation == 'DELETE' || (has(object.spec.agentRuntime.workspace.gitSecretRef) && object.spec.agentRuntime.workspace.gitSecretRef.name == %s)" (toJson $admission.gitSecret) | quote }}
      message: "agent analysis shadow Tasks must use the approved read-only git Secret"
    {{- else }}
    - expression: "request.operation == 'DELETE' || !has(object.spec.agentRuntime.workspace.gitSecretRef)"
      message: "agent analysis shadow Tasks must not add a git Secret"
    {{- end }}
    - expression: "request.operation == 'DELETE' || (!has(object.spec.agentRuntime.workspace.branch) && !has(object.spec.agentRuntime.workspace.subPath) && !has(object.spec.agentRuntime.workspace.forkRepo) && !has(object.spec.agentRuntime.workspace.prBaseBranch) && !has(object.spec.agentRuntime.workspace.pushBranch))"
      message: "agent analysis shadow Tasks must use the fixed generation-only workspace shape"
    - expression: {{ printf "request.operation == 'DELETE' || (object.spec.agentRuntime.maxTurns == %v && object.spec.agentRuntime.allowBash == false && object.spec.agentRuntime.allowedTools == ['Read', 'Glob', 'Grep', 'Write'] && object.spec.agentRuntime.disallowedTools == ['Bash', 'Edit', 'MultiEdit', 'NotebookEdit', 'WebFetch', 'WebSearch', 'Task', 'TodoWrite', 'Question'])" $admission.maxTurns | quote }}
      message: "agent analysis shadow Tasks must use the bounded no-Bash tool policy"
    - expression: {{ printf "request.operation == 'DELETE' || (has(object.spec.timeout) && duration(object.spec.timeout) == duration(%s) && has(object.spec.retryPolicy) && object.spec.retryPolicy.maxRetries == %v && (!has(object.spec.retryPolicy.backoffMultiplier) || object.spec.retryPolicy.backoffMultiplier == 2.0) && !has(object.spec.retryPolicy.initialDelay) && object.spec.priority == 500)" (toJson (printf "%v" $admission.timeout)) $admission.retries | quote }}
      message: "agent analysis shadow Tasks must use the configured execution bounds"
    - expression: "request.operation == 'DELETE' || (!has(object.spec.resources) || ((!has(object.spec.resources.limits) || size(object.spec.resources.limits) == 0) && (!has(object.spec.resources.requests) || size(object.spec.resources.requests) == 0) && (!has(object.spec.resources.claims) || size(object.spec.resources.claims) == 0)))"
      message: "agent analysis shadow Tasks must inherit resources from the approved Agent"
    - expression: "request.operation == 'DELETE' || (!has(object.spec.execution) || ((!has(object.spec.execution.runtimeClassName) || object.spec.execution.runtimeClassName == '') && (!has(object.spec.execution.nodeSelector) || size(object.spec.execution.nodeSelector) == 0) && (!has(object.spec.execution.tolerations) || size(object.spec.execution.tolerations) == 0) && (!has(object.spec.execution.affinity) || object.spec.execution.affinity == {}) && !has(object.spec.execution.workspace)))"
      message: "agent analysis shadow Tasks must not override scheduling or execution workspaces"
    - expression: "request.operation == 'DELETE' || ((!has(object.spec.webhookURL) || object.spec.webhookURL == '') && !has(object.spec.sessionRef) && !has(object.spec.priorTaskRef) && (!has(object.spec.schedule) || object.spec.schedule == '') && !has(object.spec.timeZone) && (!has(object.spec.concurrencyPolicy) || object.spec.concurrencyPolicy == 'Forbid') && (!has(object.spec.startingDeadlineSeconds) || object.spec.startingDeadlineSeconds == 100) && (!has(object.spec.successfulRunsHistoryLimit) || object.spec.successfulRunsHistoryLimit == 3) && (!has(object.spec.failedRunsHistoryLimit) || object.spec.failedRunsHistoryLimit == 1) && (!has(object.spec.suspend) || object.spec.suspend == false))"
      message: "agent analysis shadow Tasks must not use alternate lifecycle or scheduling fields"
    - expression: "request.operation == 'DELETE' || (!has(object.spec.ai) && !has(object.spec.workspace) && !has(object.spec.requestedBy) && !has(object.spec.transaction))"
      message: "agent analysis shadow Tasks must not add alternate AI, workspace, or transaction fields"
    - expression: "request.operation == 'DELETE' || (has(object.spec.prompt) && size(object.spec.prompt) <= 1048576 && object.spec.prompt.startsWith('Trusted engine-owned skills follow.') && object.spec.prompt.contains('agent-analysis-v1') && object.spec.prompt.contains('.prow-ai-dashboard/analysis.json'))"
      message: "agent analysis shadow Tasks must carry the bounded engine-owned analysis contract"
    - expression: "request.operation == 'DELETE' || (has(object.metadata.labels) && size(object.metadata.labels) == 2 && 'app.kubernetes.io/managed-by' in object.metadata.labels && 'prow-ai-dashboard/runtime' in object.metadata.labels && object.metadata.labels['app.kubernetes.io/managed-by'] == 'orka-agent-analysis' && object.metadata.labels['prow-ai-dashboard/runtime'] == 'failure-analysis-shadow')"
      message: "agent analysis shadow Tasks must carry the exact lifecycle labels"
    - expression: "request.operation == 'DELETE' || (has(object.metadata.annotations) && size(object.metadata.annotations) == 3 && 'prow-ai-dashboard/agent-analysis-contract' in object.metadata.annotations && 'orka.ai/disable-coordination-tool-injection' in object.metadata.annotations && 'prow-ai-dashboard/action-request' in object.metadata.annotations && object.metadata.annotations['prow-ai-dashboard/agent-analysis-contract'] == 'agent-analysis-v1' && object.metadata.annotations['orka.ai/disable-coordination-tool-injection'] == 'true' && object.metadata.annotations['prow-ai-dashboard/action-request'].matches('^agent-analysis-[0-9a-f]{16}$'))"
      message: "agent analysis shadow Tasks must carry the exact immutable identity metadata"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "prow-ai-dashboard.agentAnalysisShadowAdmissionName" . }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-analysis-shadow
spec:
  policyName: {{ include "prow-ai-dashboard.agentAnalysisShadowAdmissionName" . }}
  validationActions: [Deny]
{{- end }}
