{{- include "prow-ai-dashboard.validateAnalysisRuntime" . -}}
{{- if and (eq .Values.analysisRuntime.type "orka-container") (not .Values.analysisRuntime.orkaContainer.namespace) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "prow-ai-dashboard.orkaAnalysisNamespace" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: orka-container-analysis
    prow-ai-dashboard.willieyao.dev/release-scope: {{ include "prow-ai-dashboard.orkaReleaseScope" . | quote }}
{{- end }}
