{{- include "prow-ai-dashboard.validateAnalysisRuntime" . -}}
{{- if and (eq .Values.analysisRuntime.type "orka-container") .Values.orka.rbac.create }}
# Analysis creates only container Tasks and their immutable input ConfigMaps.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "prow-ai-dashboard.orkaAnalysisRBACName" . }}
  namespace: {{ include "prow-ai-dashboard.orkaAnalysisNamespace" . }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: orka-container-analysis
rules:
  - apiGroups: ["core.orka.ai"]
    resources: ["tasks"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "prow-ai-dashboard.orkaAnalysisRBACName" . }}
  namespace: {{ include "prow-ai-dashboard.orkaAnalysisNamespace" . }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: orka-container-analysis
subjects:
  - kind: ServiceAccount
    name: {{ include "prow-ai-dashboard.orkaServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "prow-ai-dashboard.orkaAnalysisRBACName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
