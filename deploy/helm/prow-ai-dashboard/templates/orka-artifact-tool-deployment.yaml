{{- include "prow-ai-dashboard.validateAnalysis" . -}}
{{- if and (eq .Values.analysis "orka") .Values.orka.artifactTool.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prow-ai-dashboard.orkaArtifactToolName" . }}
  namespace: {{ .Values.orka.namespace }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: orka-artifact-tool
spec:
  replicas: {{ .Values.orka.artifactTool.replicas }}
  selector:
    matchLabels:
      {{- include "prow-ai-dashboard.orkaArtifactToolSelectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: orka-artifact-tool
  template:
    metadata:
      annotations:
        checksum/artifact-tool-auth: {{ printf "%s:%s:%s" (include "prow-ai-dashboard.orkaArtifactToolSecret" .) .Values.orka.artifactTool.auth.tokenKey .Values.orka.artifactTool.auth.token | sha256sum }}
      labels:
        {{- include "prow-ai-dashboard.orkaArtifactToolSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: orka-artifact-tool
    spec:
      automountServiceAccountToken: false
      {{- with .Values.orka.artifactTool.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.orka.artifactTool.podSecurityContext | nindent 8 }}
      containers:
        - name: artifact-tool
          image: {{ include "prow-ai-dashboard.orkaArtifactToolImage" . }}
          imagePullPolicy: {{ .Values.orka.artifactTool.image.pullPolicy }}
          env:
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "prow-ai-dashboard.orkaArtifactToolSecret" . }}
                  key: {{ .Values.orka.artifactTool.auth.tokenKey }}
            - name: ADDR
              value: {{ printf ":%v" .Values.orka.artifactTool.service.port | quote }}
            - name: BUCKET
              value: {{ .Values.orka.artifactTool.defaultBucket | quote }}
            - name: BUILD_PREFIX
              value: {{ .Values.orka.artifactTool.defaultBuildPrefix | quote }}
            - name: MODEL_BYTE_BUDGET
              value: {{ .Values.orka.artifactTool.modelByteBudget | quote }}
            - name: GCS_BYTE_BUDGET
              value: {{ .Values.orka.artifactTool.gcsByteBudget | quote }}
            {{- with .Values.orka.artifactTool.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.orka.artifactTool.service.port }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          securityContext:
            {{- toYaml .Values.orka.artifactTool.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.orka.artifactTool.resources | nindent 12 }}
      {{- with .Values.orka.artifactTool.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.orka.artifactTool.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.orka.artifactTool.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
