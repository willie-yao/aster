{{- include "prow-ai-dashboard.validateAnalysis" . -}}
{{- if and (eq .Values.analysis "orka") .Values.orka.artifactTool.enabled .Values.orka.artifactTool.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "prow-ai-dashboard.orkaArtifactToolName" . }}
  namespace: {{ .Values.orka.namespace }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: orka-artifact-tool
spec:
  podSelector:
    matchLabels:
      {{- include "prow-ai-dashboard.orkaArtifactToolSelectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: orka-artifact-tool
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              orka.ai/task-type: ai
        {{- with .Values.orka.artifactTool.networkPolicy.from }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.orka.artifactTool.service.port }}
{{- end }}
