{{- include "prow-ai-dashboard.validateAnalysis" . -}}
{{- if and (eq .Values.analysis "orka") .Values.orka.artifactTool.enabled (not .Values.orka.artifactTool.auth.existingSecret) }}
{{- $name := include "prow-ai-dashboard.orkaArtifactToolSecret" . -}}
{{- $key := .Values.orka.artifactTool.auth.tokenKey | default "token" -}}
{{- $existing := lookup "v1" "Secret" .Values.orka.namespace $name -}}
{{- $existingToken := "" -}}
{{- if and $existing (hasKey $existing.data $key) -}}
{{- $existingToken = index $existing.data $key | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.orka.namespace }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: orka-artifact-tool
type: Opaque
stringData:
  {{ $key }}: {{ .Values.orka.artifactTool.auth.token | default $existingToken | default (randAlphaNum 64) | quote }}
{{- end }}
