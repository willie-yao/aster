{{- include "prow-ai-dashboard.validateAnalysis" . -}}
{{- if and (eq .Values.analysis "orka") .Values.orka.artifactTool.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "prow-ai-dashboard.orkaArtifactToolName" . }}
  namespace: {{ .Values.orka.namespace }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: orka-artifact-tool
spec:
  selector:
    {{- include "prow-ai-dashboard.orkaArtifactToolSelectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: orka-artifact-tool
  ports:
    - name: http
      port: {{ .Values.orka.artifactTool.service.port }}
      targetPort: http
{{- end }}
