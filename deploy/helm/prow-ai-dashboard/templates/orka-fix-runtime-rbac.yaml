{{- include "prow-ai-dashboard.validateAI" . -}}
{{- if and .Values.orka.fixRuntime.enabled .Values.orka.rbac.create }}
# The dashboard pod runs in the release namespace and creates fix-generation
# Tasks in the Orka namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "prow-ai-dashboard.orkaServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: orka-fix-runtime
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "prow-ai-dashboard.orkaRBACName" . }}
  namespace: {{ .Values.orka.namespace }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: orka-fix-runtime
rules:
  - apiGroups: ["core.orka.ai"]
    resources: ["tasks"]
    verbs: ["create", "get", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "prow-ai-dashboard.orkaRBACName" . }}
  namespace: {{ .Values.orka.namespace }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: orka-fix-runtime
subjects:
  - kind: ServiceAccount
    name: {{ include "prow-ai-dashboard.orkaServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "prow-ai-dashboard.orkaRBACName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
