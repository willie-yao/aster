{{- include "prow-ai-dashboard.validateAnalysis" . -}}
{{- if and (or (eq .Values.analysis "orka") .Values.orka.fixRuntime.enabled) .Values.orka.rbac.create }}
# The pipeline pod runs in the release namespace but creates Tasks, Tools, and
# private analyzer bundle ConfigMaps in the Orka namespace. The ServiceAccount
# lives here while the Role and RoleBinding grant cross-namespace access there.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "prow-ai-dashboard.orkaServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: orka-pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "prow-ai-dashboard.orkaRBACName" . }}
  namespace: {{ .Values.orka.namespace }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: orka-pipeline
rules:
  {{- if eq .Values.analysis "orka" }}
  # Analysis applies Tasks and Tools and garbage-collects scoped Tool resources.
  - apiGroups: ["core.orka.ai"]
    resources: ["tasks", "tools"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]
  # Container analyzer bundles are immutable and deleted after result handling.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "patch", "delete"]
  {{- else }}
  # Fix generation only creates and polls Tasks.
  - apiGroups: ["core.orka.ai"]
    resources: ["tasks"]
    verbs: ["create", "get", "patch", "delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "prow-ai-dashboard.orkaRBACName" . }}
  namespace: {{ .Values.orka.namespace }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: orka-pipeline
subjects:
  - kind: ServiceAccount
    name: {{ include "prow-ai-dashboard.orkaServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "prow-ai-dashboard.orkaRBACName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
