{{- include "prow-ai-dashboard.validateAnalysisRuntime" . -}}
{{- $analysis := eq .Values.analysisRuntime.type "orka-container" -}}
{{- $source := .Values.server.chat.sourceInvestigation.enabled -}}
{{- if and (or .Values.orka.fixRuntime.enabled $analysis $source) .Values.orka.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "prow-ai-dashboard.orkaServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: orka-runtime
{{- end }}
