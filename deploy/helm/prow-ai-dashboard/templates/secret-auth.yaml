{{- if .Values.server.actions.enabled }}
{{- $a := .Values.server.actions }}
{{- if eq $a.mode "oauth" }}
{{- if not $a.oauth.existingSecret }}
{{- if or (not $a.oauth.clientSecret) (not $a.oauth.sessionKey) }}
{{- fail "server.actions.oauth.clientSecret and sessionKey are required (or set oauth.existingSecret)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prow-ai-dashboard.authSecret" . }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  OAUTH_CLIENT_SECRET: {{ $a.oauth.clientSecret | quote }}
  SESSION_KEY: {{ $a.oauth.sessionKey | quote }}
{{- end }}
{{- else if eq $a.mode "proxy" }}
{{- if not $a.proxy.existingSecret }}
{{- if not $a.proxy.botToken }}
{{- fail "server.actions.proxy.botToken is required (or set proxy.existingSecret)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prow-ai-dashboard.authSecret" . }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  BOT_TOKEN: {{ $a.proxy.botToken | quote }}
{{- if $a.proxy.secret }}
  AUTH_PROXY_SECRET: {{ $a.proxy.secret | quote }}
{{- end }}
{{- end }}
{{- else }}
{{- fail (printf "server.actions.mode must be \"oauth\" or \"proxy\", got %q" $a.mode) }}
{{- end }}
{{- end }}
