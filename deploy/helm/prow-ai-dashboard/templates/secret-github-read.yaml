{{- if and (or .Values.ai.enabled .Values.server.actions.enabled) .Values.ai.githubReadToken (not .Values.ai.githubReadTokenSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prow-ai-dashboard.githubReadSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: source-grounding
type: Opaque
stringData:
  {{ .Values.ai.githubReadTokenSecretKey }}: {{ .Values.ai.githubReadToken | quote }}
{{- if eq .Values.analysisRuntime.type "orka-container" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prow-ai-dashboard.githubReadSecret" . }}
  namespace: {{ include "prow-ai-dashboard.orkaAnalysisNamespace" . }}
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: source-grounding
type: Opaque
stringData:
  {{ .Values.ai.githubReadTokenSecretKey }}: {{ .Values.ai.githubReadToken | quote }}
{{- end }}
{{- end }}
