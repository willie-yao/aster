{{- $actions := .Values.server.actions.enabled -}}
{{- $a := .Values.server.actions -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prow-ai-dashboard.fullname" . }}-server
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "prow-ai-dashboard.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "prow-ai-dashboard.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          image: {{ include "prow-ai-dashboard.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/bin/server
            - -addr=:{{ .Values.server.port }}
            - -data-dir={{ .Values.persistence.mountPath }}
            - -static-dir={{ .Values.server.staticDir }}
            {{- if $actions }}
            - -project-dir={{ .Values.project.mountPath }}
            {{- end }}
          {{- if or $actions .Values.server.extraEnv }}
          env:
            {{- if $actions }}
            - name: AUTH_MODE
              value: {{ $a.mode | quote }}
            {{- if $a.admins }}
            - name: ADMIN_LOGINS
              value: {{ join "," $a.admins | quote }}
            {{- end }}
            {{- if eq $a.mode "oauth" }}
            - name: OAUTH_CLIENT_ID
              value: {{ $a.oauth.clientId | quote }}
            - name: OAUTH_REDIRECT_URL
              value: {{ $a.oauth.redirectUrl | quote }}
            - name: OAUTH_SCOPE
              value: {{ $a.oauth.scope | quote }}
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "prow-ai-dashboard.authSecret" . }}
                  key: OAUTH_CLIENT_SECRET
            - name: SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "prow-ai-dashboard.authSecret" . }}
                  key: SESSION_KEY
            {{- else if eq $a.mode "proxy" }}
            - name: AUTH_PROXY_HEADER
              value: {{ $a.proxy.header | quote }}
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "prow-ai-dashboard.authSecret" . }}
                  key: BOT_TOKEN
            {{- if $a.proxy.secret }}
            - name: AUTH_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "prow-ai-dashboard.authSecret" . }}
                  key: AUTH_PROXY_SECRET
            {{- end }}
            {{- end }}
            {{- with $a.trustedOrigins }}
            - name: TRUSTED_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.ai.enabled }}
            - name: AI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "prow-ai-dashboard.aiSecret" . }}
                  key: {{ .Values.ai.tokenSecretKey }}
            {{- if .Values.ai.endpoint }}
            - name: AI_ENDPOINT
              value: {{ .Values.ai.endpoint | quote }}
            {{- end }}
            {{- if .Values.ai.model }}
            - name: AI_MODEL
              value: {{ .Values.ai.model | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
              # Read-write when actions are enabled: the server persists issue
              # and fix-PR dedup state next to the data it serves.
              readOnly: {{ not $actions }}
            {{- if $actions }}
            - name: project
              mountPath: {{ .Values.project.mountPath }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- end }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "prow-ai-dashboard.pvcName" . }}
        {{- if $actions }}
        - name: project
          configMap:
            name: {{ include "prow-ai-dashboard.projectConfigMap" . }}
            items:
              {{- include "prow-ai-dashboard.projectVolumeItems" . | nindent 14 }}
        - name: tmp
          emptyDir: {}
        {{- end }}
