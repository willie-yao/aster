{{- $actions := .Values.server.actions.enabled -}}
{{- $chat := .Values.server.chat.enabled -}}
{{- $corrections := .Values.server.chat.correctionsEnabled -}}
{{- $interactive := or $actions $chat -}}
{{- $a := .Values.server.actions -}}
{{- if and $chat (not .Values.ai.enabled) -}}
{{- fail "server.chat.enabled requires ai.enabled" -}}
{{- end -}}
{{- if and $corrections (not $chat) -}}
{{- fail "server.chat.correctionsEnabled requires server.chat.enabled" -}}
{{- end -}}
{{- if and $chat (le (int .Values.server.chat.maxSessions) 0) -}}
{{- fail "server.chat.maxSessions must be positive" -}}
{{- end -}}
{{- if and $chat (le (int .Values.server.chat.maxSessionsPerOwner) 0) -}}
{{- fail "server.chat.maxSessionsPerOwner must be positive" -}}
{{- end -}}
{{- if and $chat (le (int .Values.server.chat.maxActiveTurnsPerOwner) 0) -}}
{{- fail "server.chat.maxActiveTurnsPerOwner must be positive" -}}
{{- end -}}
{{- if and $chat (le (int .Values.server.chat.requestsPerMinute) 0) -}}
{{- fail "server.chat.requestsPerMinute must be positive" -}}
{{- end -}}
{{- if and $chat (gt (int .Values.server.chat.maxSessionsPerOwner) (int .Values.server.chat.maxSessions)) -}}
{{- fail "server.chat.maxSessionsPerOwner cannot exceed server.chat.maxSessions" -}}
{{- end -}}
{{- if and $chat (not .Values.server.chat.sessionTTL) -}}
{{- fail "server.chat.sessionTTL is required" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prow-ai-dashboard.fullname" . }}-server
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "prow-ai-dashboard.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "prow-ai-dashboard.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.orka.fixRuntime.enabled $actions }}
      serviceAccountName: {{ include "prow-ai-dashboard.orkaServiceAccountName" . }}
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          {{- if and .Values.orka.fixRuntime.enabled $actions }}
          image: {{ include "prow-ai-dashboard.fixerImage" . }}
          imagePullPolicy: {{ .Values.orka.fixRuntime.image.pullPolicy }}
          {{- else }}
          image: {{ include "prow-ai-dashboard.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- end }}
          command:
            - /usr/local/bin/server
            - -addr=:{{ .Values.server.port }}
            - -data-dir={{ .Values.persistence.mountPath }}
            - -static-dir={{ .Values.server.staticDir }}
            {{- if $interactive }}
            - -project-dir={{ .Values.project.mountPath }}
            {{- end }}
          {{- if or $interactive .Values.server.extraEnv }}
          env:
            {{- if $interactive }}
            {{- if $actions }}
            - name: ACTIONS_ENABLED
              value: "true"
            {{- end }}
            {{- if $chat }}
            - name: ANALYSIS_CHAT_ENABLED
              value: "true"
            {{- if $corrections }}
            - name: ANALYSIS_CORRECTIONS_ENABLED
              value: "true"
            {{- end }}
            - name: ANALYSIS_CHAT_STATE_DIR
              value: {{ printf "%s/.analysis-chat" .Values.persistence.mountPath | quote }}
            - name: ANALYSIS_CHAT_SESSION_TTL
              value: {{ .Values.server.chat.sessionTTL | quote }}
            - name: ANALYSIS_CHAT_MAX_SESSIONS
              value: {{ .Values.server.chat.maxSessions | quote }}
            - name: ANALYSIS_CHAT_MAX_SESSIONS_PER_OWNER
              value: {{ .Values.server.chat.maxSessionsPerOwner | quote }}
            - name: ANALYSIS_CHAT_MAX_ACTIVE_TURNS_PER_OWNER
              value: {{ .Values.server.chat.maxActiveTurnsPerOwner | quote }}
            - name: ANALYSIS_CHAT_REQUESTS_PER_MINUTE
              value: {{ .Values.server.chat.requestsPerMinute | quote }}
            {{- end }}
            - name: AUTH_MODE
              value: {{ $a.mode | quote }}
            {{- if $a.admins }}
            - name: ADMIN_LOGINS
              value: {{ join "," $a.admins | quote }}
            {{- end }}
            {{- if eq $a.mode "oauth" }}
            - name: OAUTH_CLIENT_ID
              value: {{ $a.oauth.clientId | quote }}
            - name: OAUTH_REDIRECT_URL
              value: {{ $a.oauth.redirectUrl | quote }}
            - name: OAUTH_SCOPE
              {{- if $actions }}
              value: {{ $a.oauth.scope | quote }}
              {{- else }}
              value: {{ $a.oauth.chatScope | quote }}
              {{- end }}
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "prow-ai-dashboard.authSecret" . }}
                  key: OAUTH_CLIENT_SECRET
            - name: SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "prow-ai-dashboard.authSecret" . }}
                  key: SESSION_KEY
            {{- else if eq $a.mode "proxy" }}
            - name: AUTH_PROXY_HEADER
              value: {{ $a.proxy.header | quote }}
            {{- if $actions }}
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "prow-ai-dashboard.authSecret" . }}
                  key: BOT_TOKEN
            {{- end }}
            {{- if or $a.proxy.secret $a.proxy.existingSecret }}
            - name: AUTH_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "prow-ai-dashboard.authSecret" . }}
                  key: AUTH_PROXY_SECRET
                  {{- if $a.proxy.existingSecret }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- end }}
            {{- with $a.trustedOrigins }}
            - name: TRUSTED_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.ai.enabled }}
            - name: AI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "prow-ai-dashboard.aiSecret" . }}
                  key: {{ .Values.ai.tokenSecretKey }}
            - name: AI_API
              value: {{ .Values.ai.api | quote }}
            {{- if .Values.ai.endpoint }}
            - name: AI_ENDPOINT
              value: {{ .Values.ai.endpoint | quote }}
            {{- end }}
            {{- if .Values.ai.model }}
            - name: AI_MODEL
              value: {{ .Values.ai.model | quote }}
            {{- end }}
            {{- if gt (int .Values.ai.contextWindowTokens) 0 }}
            - name: AI_CONTEXT_WINDOW_TOKENS
              value: {{ .Values.ai.contextWindowTokens | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
              # Interactive features persist private operational state.
              readOnly: {{ not $interactive }}
            {{- if $interactive }}
            - name: project
              mountPath: {{ .Values.project.mountPath }}
              readOnly: true
            {{- end }}
            {{- if $actions }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "prow-ai-dashboard.pvcName" . }}
        {{- if $interactive }}
        - name: project
          configMap:
            name: {{ include "prow-ai-dashboard.projectConfigMap" . }}
            items:
              {{- include "prow-ai-dashboard.projectVolumeItems" . | nindent 14 }}
        {{- end }}
        {{- if $actions }}
        - name: tmp
          emptyDir: {}
        {{- end }}
