{{- include "prow-ai-dashboard.validateNetworkSecurity" . -}}
{{- $actions := .Values.server.actions.enabled -}}
{{- $chat := .Values.server.chat.enabled -}}
{{- $corrections := .Values.server.chat.correctionsEnabled -}}
{{- $source := .Values.server.chat.sourceInvestigation.enabled -}}
{{- $interactive := or $actions $chat -}}
{{- $a := .Values.server.actions -}}
{{- $extraInsecureCookies := false -}}
{{- $extraOAuthScope := false -}}
{{- $extraOAuthPrivateRepositories := false -}}
{{- range .Values.server.extraEnv -}}
{{- if eq (default "" .name) "COOKIE_INSECURE" -}}
{{- $extraInsecureCookies = true -}}
{{- end -}}
{{- if eq (default "" .name) "OAUTH_SCOPE" -}}
{{- $extraOAuthScope = true -}}
{{- end -}}
{{- if eq (default "" .name) "OAUTH_PRIVATE_REPOSITORIES" -}}
{{- $extraOAuthPrivateRepositories = true -}}
{{- end -}}
{{- end -}}
{{- if $extraInsecureCookies -}}
{{- fail "server.extraEnv must not set COOKIE_INSECURE; use server.development.allowInsecureCookies for local OAuth testing" -}}
{{- end -}}
{{- if or (hasKey $a.oauth "scope") (hasKey $a.oauth "chatScope") -}}
{{- fail "server.actions.oauth.scope and server.actions.oauth.chatScope are no longer supported; remove them and set server.actions.oauth.privateRepositories=true only when OAuth actions must access private repositories" -}}
{{- end -}}
{{- if $extraOAuthScope -}}
{{- fail "server.extraEnv must not set OAUTH_SCOPE; remove it and use server.actions.oauth.privateRepositories" -}}
{{- end -}}
{{- if $extraOAuthPrivateRepositories -}}
{{- fail "server.extraEnv must not set OAUTH_PRIVATE_REPOSITORIES; use server.actions.oauth.privateRepositories" -}}
{{- end -}}
{{- if and $a.oauth.privateRepositories (not $actions) -}}
{{- fail "server.actions.oauth.privateRepositories=true requires server.actions.enabled=true; chat-only OAuth uses read:user" -}}
{{- end -}}
{{- if and .Values.server.development.allowInsecureCookies (not (and $interactive (eq $a.mode "oauth"))) -}}
{{- fail "server.development.allowInsecureCookies requires interactive OAuth mode" -}}
{{- end -}}
{{- if and .Values.server.development.allowInsecureCookies .Values.server.security.hsts.enabled -}}
{{- fail "server.development.allowInsecureCookies requires server.security.hsts.enabled=false" -}}
{{- end -}}
{{- if and $chat (not .Values.ai.enabled) -}}
{{- fail "server.chat.enabled requires ai.enabled" -}}
{{- end -}}
{{- if and $corrections (not $chat) -}}
{{- fail "server.chat.correctionsEnabled requires server.chat.enabled" -}}
{{- end -}}
{{- if and $source (not $chat) -}}
{{- fail "server.chat.sourceInvestigation.enabled requires server.chat.enabled" -}}
{{- end -}}
{{- if and $source (le (int .Values.server.chat.sourceInvestigation.maxPerSession) 0) -}}
{{- fail "server.chat.sourceInvestigation.maxPerSession must be positive" -}}
{{- end -}}
{{- if and $source (le (int .Values.server.chat.sourceInvestigation.maxActivePerOwner) 0) -}}
{{- fail "server.chat.sourceInvestigation.maxActivePerOwner must be positive" -}}
{{- end -}}
{{- if and $chat (le (int .Values.server.chat.maxSessions) 0) -}}
{{- fail "server.chat.maxSessions must be positive" -}}
{{- end -}}
{{- if and $chat (le (int .Values.server.chat.maxSessionsPerOwner) 0) -}}
{{- fail "server.chat.maxSessionsPerOwner must be positive" -}}
{{- end -}}
{{- if and $chat (le (int .Values.server.chat.maxActiveTurnsPerOwner) 0) -}}
{{- fail "server.chat.maxActiveTurnsPerOwner must be positive" -}}
{{- end -}}
{{- if and $chat (le (int .Values.server.chat.requestsPerMinute) 0) -}}
{{- fail "server.chat.requestsPerMinute must be positive" -}}
{{- end -}}
{{- if and $chat (gt (int .Values.server.chat.maxSessionsPerOwner) (int .Values.server.chat.maxSessions)) -}}
{{- fail "server.chat.maxSessionsPerOwner cannot exceed server.chat.maxSessions" -}}
{{- end -}}
{{- if and $chat (not .Values.server.chat.sessionTTL) -}}
{{- fail "server.chat.sessionTTL is required" -}}
{{- end -}}
{{- if and $chat (not .Values.server.chat.timeout) -}}
{{- fail "server.chat.timeout is required" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prow-ai-dashboard.fullname" . }}-server
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "prow-ai-dashboard.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      {{- if and $interactive (not .Values.project.existingConfigMap) }}
      annotations:
        checksum/project-config: {{ include (print $.Template.BasePath "/configmap-project.yaml") . | sha256sum }}
      {{- end }}
      labels:
        {{- include "prow-ai-dashboard.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $source }}
      serviceAccountName: {{ include "prow-ai-dashboard.orkaSourceServiceAccountName" . }}
      automountServiceAccountToken: true
      {{- else if and .Values.orka.fixRuntime.enabled $actions }}
      serviceAccountName: {{ include "prow-ai-dashboard.orkaServiceAccountName" . }}
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: server
          {{- if and .Values.orka.fixRuntime.enabled $actions }}
          image: {{ include "prow-ai-dashboard.fixerImage" . }}
          imagePullPolicy: {{ .Values.orka.fixRuntime.image.pullPolicy }}
          {{- else }}
          image: {{ include "prow-ai-dashboard.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- end }}
          command:
            - /usr/local/bin/server
            - -addr=:{{ .Values.server.port }}
            - -data-dir={{ .Values.persistence.mountPath }}
            - -static-dir={{ .Values.server.staticDir }}
            {{- if $interactive }}
            - -project-dir={{ .Values.project.mountPath }}
            {{- end }}
          {{- if or $interactive .Values.server.security.hsts.enabled .Values.server.extraEnv }}
          env:
            {{- if .Values.server.security.hsts.enabled }}
            - name: HSTS_ENABLED
              value: "true"
            {{- end }}
            {{- if $interactive }}
            {{- if $actions }}
            - name: ACTIONS_ENABLED
              value: "true"
            {{- end }}
            {{- if or $source (and .Values.orka.fixRuntime.enabled $actions) }}
            - name: ORKA_API_TOKEN_FILE
              value: /var/run/secrets/kubernetes.io/serviceaccount/token
            {{- end }}
            {{- if and $actions (not $source) (or .Values.ai.githubReadToken .Values.ai.githubReadTokenSecretName .Values.ai.existingSecret) }}
            - name: SOURCE_INVESTIGATION_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "prow-ai-dashboard.githubReadSecret" . }}
                  key: {{ .Values.ai.githubReadTokenSecretKey }}
                  {{- if and (not .Values.ai.githubReadToken) (not .Values.ai.githubReadTokenSecretName) }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- if $chat }}
            - name: ANALYSIS_CHAT_ENABLED
              value: "true"
            {{- if $corrections }}
            - name: ANALYSIS_CORRECTIONS_ENABLED
              value: "true"
            {{- end }}
            {{- if $source }}
            - name: ANALYSIS_SOURCE_INVESTIGATION_ENABLED
              value: "true"
            - name: ANALYSIS_SOURCE_INVESTIGATION_MAX_PER_SESSION
              value: {{ .Values.server.chat.sourceInvestigation.maxPerSession | quote }}
            - name: ANALYSIS_SOURCE_INVESTIGATION_MAX_ACTIVE_PER_OWNER
              value: {{ .Values.server.chat.sourceInvestigation.maxActivePerOwner | quote }}
            {{- if or .Values.ai.githubReadToken .Values.ai.githubReadTokenSecretName .Values.ai.existingSecret }}
            - name: SOURCE_INVESTIGATION_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "prow-ai-dashboard.githubReadSecret" . }}
                  key: {{ .Values.ai.githubReadTokenSecretKey }}
                  {{- if and (not .Values.ai.githubReadToken) (not .Values.ai.githubReadTokenSecretName) }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- end }}
            - name: ANALYSIS_CHAT_STATE_DIR
              value: {{ printf "%s/.analysis-chat" .Values.persistence.mountPath | quote }}
            - name: ANALYSIS_CHAT_TIMEOUT
              value: {{ .Values.server.chat.timeout | quote }}
            - name: ANALYSIS_CHAT_SESSION_TTL
              value: {{ .Values.server.chat.sessionTTL | quote }}
            - name: ANALYSIS_CHAT_MAX_SESSIONS
              value: {{ .Values.server.chat.maxSessions | quote }}
            - name: ANALYSIS_CHAT_MAX_SESSIONS_PER_OWNER
              value: {{ .Values.server.chat.maxSessionsPerOwner | quote }}
            - name: ANALYSIS_CHAT_MAX_ACTIVE_TURNS_PER_OWNER
              value: {{ .Values.server.chat.maxActiveTurnsPerOwner | quote }}
            - name: ANALYSIS_CHAT_REQUESTS_PER_MINUTE
              value: {{ .Values.server.chat.requestsPerMinute | quote }}
            {{- end }}
            - name: AUTH_MODE
              value: {{ $a.mode | quote }}
            {{- if and (eq $a.mode "oauth") .Values.server.development.allowInsecureCookies }}
            - name: COOKIE_INSECURE
              value: "1"
            {{- end }}
            {{- if $a.admins }}
            - name: ADMIN_LOGINS
              value: {{ join "," $a.admins | quote }}
            {{- end }}
            {{- if eq $a.mode "oauth" }}
            - name: OAUTH_CLIENT_ID
              value: {{ $a.oauth.clientId | quote }}
            - name: OAUTH_REDIRECT_URL
              value: {{ $a.oauth.redirectUrl | quote }}
            - name: OAUTH_PRIVATE_REPOSITORIES
              value: {{ $a.oauth.privateRepositories | quote }}
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "prow-ai-dashboard.authSecret" . }}
                  key: OAUTH_CLIENT_SECRET
            - name: SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "prow-ai-dashboard.authSecret" . }}
                  key: SESSION_KEY
            {{- else if eq $a.mode "proxy" }}
            - name: AUTH_PROXY_HEADER
              value: {{ $a.proxy.header | quote }}
            {{- if $actions }}
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "prow-ai-dashboard.authSecret" . }}
                  key: BOT_TOKEN
            {{- end }}
            {{- if or $a.proxy.secret $a.proxy.existingSecret }}
            - name: AUTH_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "prow-ai-dashboard.authSecret" . }}
                  key: AUTH_PROXY_SECRET
                  {{- if $a.proxy.existingSecret }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- end }}
            {{- with $a.trustedOrigins }}
            - name: TRUSTED_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.ai.enabled }}
            - name: AI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "prow-ai-dashboard.aiSecret" . }}
                  key: {{ .Values.ai.tokenSecretKey }}
            - name: AI_API
              value: {{ .Values.ai.api | quote }}
            {{- if ne (printf "%v" .Values.analysisCache.generation) "" }}
            - name: AI_CACHE_GENERATION
              value: {{ .Values.analysisCache.generation | quote }}
            {{- end }}
            {{- if .Values.ai.endpoint }}
            - name: AI_ENDPOINT
              value: {{ .Values.ai.endpoint | quote }}
            {{- end }}
            {{- if .Values.ai.model }}
            - name: AI_MODEL
              value: {{ .Values.ai.model | quote }}
            {{- end }}
            {{- if gt (int .Values.ai.contextWindowTokens) 0 }}
            - name: AI_CONTEXT_WINDOW_TOKENS
              value: {{ .Values.ai.contextWindowTokens | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
              # Interactive features persist private operational state.
              readOnly: {{ not $interactive }}
            {{- if $interactive }}
            - name: project
              mountPath: {{ .Values.project.mountPath }}
              readOnly: true
            {{- end }}
            {{- if $actions }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "prow-ai-dashboard.pvcName" . }}
        {{- if $interactive }}
        - name: project
          configMap:
            name: {{ include "prow-ai-dashboard.projectConfigMap" . }}
            items:
              {{- include "prow-ai-dashboard.projectVolumeItems" . | nindent 14 }}
        {{- end }}
        {{- if $actions }}
        - name: tmp
          emptyDir: {}
        {{- end }}
