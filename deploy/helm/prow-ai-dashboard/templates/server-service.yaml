{{- include "prow-ai-dashboard.validateNetworkSecurity" . -}}
{{- $service := .Values.server.service -}}
{{- $internal := $service.internal | default dict -}}
{{- $annotations := deepCopy ($service.annotations | default dict) -}}
{{- if ($internal.enabled | default false) -}}
{{- $annotations = mergeOverwrite $annotations ($internal.annotations | default dict) -}}
{{- end -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "prow-ai-dashboard.fullname" . }}-server
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $service.type }}
  {{- with $service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  selector:
    {{- include "prow-ai-dashboard.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ $service.port }}
      targetPort: http
