{{- include "prow-ai-dashboard.validateFixRuntime" . -}}
{{- include "prow-ai-dashboard.validateAnalysisRuntime" . -}}
{{- if eq .Values.mode "watch" }}
{{- $containerAnalysis := eq .Values.analysisRuntime.type "orka-container" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prow-ai-dashboard.fullname" . }}-worker
  labels:
    {{- include "prow-ai-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  # Single writer: Recreate ensures the old pod stops before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "prow-ai-dashboard.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      {{- $cmManaged := not .Values.project.existingConfigMap }}
      {{- $secretManaged := and .Values.ai.enabled (not .Values.ai.existingSecret) }}
      {{- if or $cmManaged $secretManaged }}
      annotations:
        {{- if $cmManaged }}
        checksum/project-config: {{ include (print $.Template.BasePath "/configmap-project.yaml") . | sha256sum }}
        {{- end }}
        {{- if $secretManaged }}
        checksum/ai-secret: {{ include (print $.Template.BasePath "/secret-ai.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "prow-ai-dashboard.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- if or .Values.orka.fixRuntime.enabled $containerAnalysis }}
      serviceAccountName: {{ include "prow-ai-dashboard.orkaServiceAccountName" . }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if $containerAnalysis }}
      initContainers:
        - name: prepare-project
          image: {{ include "prow-ai-dashboard.projectMaterializerImage" . }}
          imagePullPolicy: {{ .Values.project.materializer.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /project/prompts /project/skills
              cp -L /source/project.yaml /project/project.yaml
              cp -L /source/prompts/system.md /project/prompts/system.md
              for file in /source/skills/*; do
                if [ -f "$file" ]; then
                  extension=${file##*.}
                  extension=$(printf '%s' "$extension" | tr '[:upper:]' '[:lower:]')
                  case "$extension" in
                    yaml|yml) cp -L "$file" /project/skills/ ;;
                  esac
                fi
              done
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: project
              mountPath: /source
              readOnly: true
            - name: project-runtime
              mountPath: /project
      {{- end }}
      containers:
        - name: worker
          {{- if .Values.orka.fixRuntime.enabled }}
          image: {{ include "prow-ai-dashboard.fixerImage" . }}
          imagePullPolicy: {{ .Values.orka.fixRuntime.image.pullPolicy }}
          {{- else }}
          image: {{ include "prow-ai-dashboard.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- end }}
          command:
            - /usr/local/bin/worker
            - -project-dir={{ .Values.project.mountPath }}
            - -out={{ .Values.persistence.mountPath }}
            - -builds={{ .Values.fetcher.buildsPerJob }}
            - -workers={{ .Values.fetcher.workers }}
            - -timeout={{ .Values.fetcher.timeout }}
            - -watch-interval={{ .Values.fetcher.watchInterval }}
            - -reconcile-interval={{ .Values.fetcher.reconcileInterval }}
            {{- if .Values.fetcher.includePresubmits }}
            - -include-presubmits
            {{- end }}
            {{- if .Values.ai.enabled }}
            - -ai
            {{- end }}
            {{- if $containerAnalysis }}
            - -analysis-runtime=orka-container
            - -orka-analysis-namespace={{ include "prow-ai-dashboard.orkaAnalysisNamespace" . }}
            - -orka-analysis-api={{ .Values.analysisRuntime.orkaContainer.api }}
            - -orka-analysis-image={{ include "prow-ai-dashboard.analyzerImage" . }}
            - -orka-analysis-model-secret={{ .Values.analysisRuntime.orkaContainer.modelAuth.existingSecret }}
            - -orka-analysis-model-token-key={{ .Values.analysisRuntime.orkaContainer.modelAuth.tokenKey }}
            {{- if or .Values.ai.githubReadToken .Values.ai.githubReadTokenSecretName }}
            - -orka-analysis-github-secret={{ include "prow-ai-dashboard.githubReadSecret" . }}
            - -orka-analysis-github-token-key={{ .Values.ai.githubReadTokenSecretKey }}
            {{- end }}
            - -orka-analysis-state-secret={{ include "prow-ai-dashboard.orkaAnalysisStateSecret" . }}
            - -orka-analysis-state-key={{ .Values.analysisRuntime.orkaContainer.state.key }}
            - -orka-analysis-max-concurrent-tasks={{ .Values.analysisRuntime.orkaContainer.maxConcurrentTasks }}
            - -orka-analysis-poll-interval={{ .Values.analysisRuntime.orkaContainer.pollInterval }}
            - -orka-analysis-task-timeout={{ .Values.analysisRuntime.orkaContainer.taskTimeout }}
            - -orka-analysis-retries={{ .Values.analysisRuntime.orkaContainer.retries }}
            - {{ printf "-orka-analysis-node-selector-json=%s" (toJson .Values.analysisRuntime.orkaContainer.nodeSelector) | quote }}
            - {{ printf "-orka-analysis-tolerations-json=%s" (toJson .Values.analysisRuntime.orkaContainer.tolerations) | quote }}
            - {{ printf "-orka-analysis-affinity-json=%s" (toJson .Values.analysisRuntime.orkaContainer.affinity) | quote }}
            {{- end }}
          env:
            {{- if .Values.ai.enabled }}
            - name: AI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "prow-ai-dashboard.aiSecret" . }}
                  key: {{ .Values.ai.tokenSecretKey }}
            - name: AI_API
              value: {{ .Values.ai.api | quote }}
            {{- if ne (printf "%v" .Values.analysisCache.generation) "" }}
            - name: AI_CACHE_GENERATION
              value: {{ .Values.analysisCache.generation | quote }}
            {{- end }}
            {{- if .Values.ai.endpoint }}
            - name: AI_ENDPOINT
              value: {{ .Values.ai.endpoint | quote }}
            {{- end }}
            {{- if .Values.ai.model }}
            - name: AI_MODEL
              value: {{ .Values.ai.model | quote }}
            {{- end }}
            {{- if gt (int .Values.ai.contextWindowTokens) 0 }}
            - name: AI_CONTEXT_WINDOW_TOKENS
              value: {{ .Values.ai.contextWindowTokens | quote }}
            {{- end }}
            {{- if or .Values.ai.githubReadToken .Values.ai.githubReadTokenSecretName .Values.ai.existingSecret }}
            - name: GITHUB_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "prow-ai-dashboard.githubReadSecret" . }}
                  key: {{ .Values.ai.githubReadTokenSecretKey }}
                  {{- if and (not .Values.ai.githubReadToken) (not .Values.ai.githubReadTokenSecretName) }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- end }}
            {{- if $containerAnalysis }}
            - name: PROW_AI_STATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "prow-ai-dashboard.orkaAnalysisStateSecret" . }}
                  key: {{ .Values.analysisRuntime.orkaContainer.state.key }}
            {{- if .Values.analysisRuntime.orkaContainer.apiAuth.existingSecret }}
            {{- if .Values.orka.fixRuntime.enabled }}
            - name: ORKA_ANALYSIS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.analysisRuntime.orkaContainer.apiAuth.existingSecret }}
                  key: {{ .Values.analysisRuntime.orkaContainer.apiAuth.tokenKey }}
            - name: ORKA_API_TOKEN_FILE
              value: /var/run/secrets/kubernetes.io/serviceaccount/token
            {{- else }}
            - name: ORKA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.analysisRuntime.orkaContainer.apiAuth.existingSecret }}
                  key: {{ .Values.analysisRuntime.orkaContainer.apiAuth.tokenKey }}
            {{- end }}
            {{- else }}
            - name: ORKA_API_TOKEN_FILE
              value: /var/run/secrets/kubernetes.io/serviceaccount/token
            {{- end }}
            {{- else if .Values.orka.fixRuntime.enabled }}
            - name: ORKA_API_TOKEN_FILE
              value: /var/run/secrets/kubernetes.io/serviceaccount/token
            {{- end }}
            {{- with .Values.fetcher.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- if $containerAnalysis }}
            - name: project-runtime
              mountPath: {{ .Values.project.mountPath }}
              readOnly: true
            {{- else }}
            - name: project
              mountPath: {{ .Values.project.mountPath }}
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
            {{- if or .Values.orka.fixRuntime.enabled $containerAnalysis }}
            - name: orka-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.fetcher.resources | nindent 12 }}
      {{- with .Values.fetcher.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.fetcher.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.fetcher.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "prow-ai-dashboard.pvcName" . }}
        - name: project
          configMap:
            name: {{ include "prow-ai-dashboard.projectConfigMap" . }}
            items:
              {{- include "prow-ai-dashboard.projectVolumeItems" . | nindent 14 }}
        {{- if $containerAnalysis }}
        - name: project-runtime
          emptyDir: {}
        {{- end }}
        {{- if or .Values.orka.fixRuntime.enabled $containerAnalysis }}
        - name: orka-api-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        {{- end }}
        - name: tmp
          emptyDir: {}
{{- end }}
