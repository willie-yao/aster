# Default values for the prow-ai-dashboard chart.
# A worker Deployment (default) or CronJob writes JSON and its AI cache to a
# shared volume. The server Deployment reads the public files from that volume
# and serves the SPA, /data/*.json, and /api/capabilities.

image:
  repository: ghcr.io/willie-yao/prow-ai-dashboard
  # Defaults to .Chart.AppVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Fetch mode selects how data is produced. Both modes have exactly one writer.
#   watch: (default) a continuous worker Deployment refreshes on a short interval
#          and reconciles (rediscovers jobs, runs side effects) periodically.
#          Best for an in-cluster deploy co-located with the inference stack.
#   cron:  the fetcher runs as a scheduled CronJob (portable, also the GitHub
#          Pages path).
# In watch mode the worker must be the only writer to the shared volume: do not
# also run the CronJob or a manual fetch-now Job, and do not point a second
# release at the same existingClaim.
mode: watch

# Analysis backend selects HOW failures are analyzed.
#   inprocess: (default) the fetcher/worker runs the engine's in-process agentic
#              loop (governed by ai.enabled). No change to existing behavior.
#   orka:      an advanced experimental path where fetch writes the skeleton and Orka
#              pipeline (orka-producer -> Orka Tasks -> orka-ingestor) does the
#              analysis, running alongside an in-cluster inference stack. Requires
#              mode: cron, and Orka + the tool shim + a Provider + the ai-worker
#              patches must already be installed (this chart deploys the pipeline,
#              not Orka itself). See experimental/orka/QUICKSTART.md.
analysis: inprocess

# Orka analysis backend settings. Only used when analysis: orka.
orka:
  namespace: orka-system
  # Provider CRD name and the model the Tasks request.
  provider: copilot
  model: claude-sonnet-4.5
  # The multi-bucket GCS tool shim and the Orka result API (in-cluster Services).
  toolShimEnv: {}
  apiBase: http://orka.orka-system.svc:8080
  # ConfigMap holding the base Tool CRDs the producer clones per build. Create it
  # from experimental/orka/manifests (kubectl create configmap orka-base-tools
  # --from-file=experimental/orka/manifests/).
  baseToolsConfigMap: orka-base-tools
  # Content-address version; bump to force re-analysis after a prompt/tool change.
  version: v1
  # Per-Task timeout, retryPolicy, and result/finalization wait budgets.
  taskTimeout: 10m
  retries: 1
  ingestWait: 45m
  patternWait: 25m
  # Producer + ingestor images, published to GHCR alongside the engine image by
  # .github/workflows/image.yml. Override for a local build (see QUICKSTART.md).
  producerImage: ghcr.io/willie-yao/prow-ai-dashboard/orka-producer:main
  ingestorImage: ghcr.io/willie-yao/prow-ai-dashboard/orka-ingestor:main
  imagePullPolicy: IfNotPresent
  # RBAC: create a ServiceAccount + Role/RoleBinding for the pipeline (create/patch
  # Tasks+Tools, read status, GC Tools). Disable to reuse an existing SA.
  rbac:
    create: true
    serviceAccountName: ""


# Shared volume holding fetcher output and the AI cache. It must be
# ReadWriteMany so the CronJob (writer) and the server (reader) can mount it at
# the same time. Set existingClaim to reuse a pre-provisioned PVC.
persistence:
  enabled: true
  existingClaim: ""
  accessMode: ReadWriteMany
  size: 1Gi
  storageClass: ""
  # Mount path inside both the fetcher and the server containers.
  mountPath: /data

# Consumer-owned project config. Supply project.yaml and prompts/system.md at
# install time, for example:
#   helm install ... \
#     --set-file project.config=project.yaml \
#     --set-file project.systemPrompt=prompts/system.md
# Or point at a ConfigMap you created yourself with keys project.yaml and
# system.md via project.existingConfigMap.
# Consumer skill recipes: set project.skills to a map of <name>.yaml -> file
# contents (e.g. --set-file project.skills.myrecipe\.yaml=skills/myrecipe.yaml).
# Each is mounted at <project_dir>/skills/<name>.yaml so the engine loads it.
project:
  existingConfigMap: ""
  config: ""
  systemPrompt: ""
  # Consumer skill recipes: <name>.yaml -> file contents. Mounted under skills/.
  skills: {}
  # Mount path the fetcher reads as -project-dir.
  mountPath: /config

# AI failure analysis. When enabled the fetcher runs with -ai and needs an
# OpenAI-compatible endpoint, a model id, and a token. The token lives in a
# Secret; endpoint and model are passed as env. Set existingSecret to reuse a
# Secret you manage (it must hold the key named by tokenSecretKey).
ai:
  enabled: false
  endpoint: ""
  model: ""
  token: ""
  existingSecret: ""
  tokenSecretKey: AI_TOKEN
  # githubReadToken grounds the recurring-pattern agent on the source repo's
  # file tree (read-only, via branding.source_repo). Optional: without it the
  # pattern agent falls back to a tool-free correlation plus a path-verification
  # guard. Reuse a read-only PAT. Stored in the AI Secret when set here; with
  # existingSecret, that Secret must hold the key named by
  # githubReadTokenSecretKey.
  githubReadToken: ""
  githubReadTokenSecretKey: GITHUB_READ_TOKEN

fetcher:
  # Cron schedule for the fetch. Default: every 6 hours. (mode: cron)
  schedule: "0 */6 * * *"
  # Forbid overlapping runs so a slow fetch never races itself.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # watch mode: how often to refresh data reusing the cached job list, and how
  # often to rediscover jobs and run a full pass with side effects.
  watchInterval: 5m
  reconcileInterval: 1h
  buildsPerJob: 10
  workers: 5
  timeout: 30m
  includePresubmits: false
  # Extra environment variables (e.g. GITHUB_TOKEN, SLACK_WEBHOOK_URL) sourced
  # from secrets or given inline. Standard core/v1 EnvVar entries.
  extraEnv: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

server:
  replicaCount: 1
  # Path to the SPA baked into the image.
  staticDir: /app/web
  port: 8080
  # Extra environment variables for the server container. Standard core/v1
  # EnvVar entries. Example: COOKIE_INSECURE=1 to allow the session cookie over
  # plain http when testing behind a local port-forward.
  extraEnv: []
  # Admin-gated write actions: file an issue or draft a fix PR for a failure.
  # Enabling actions mounts the project config and AI secret into the server and
  # gives it write access to the shared volume (issue/fix-PR dedup state).
  actions:
    # enabled turns the write endpoints on. mode selects how admins authenticate.
    enabled: false
    # mode: "oauth" (each admin signs in with GitHub; their token performs the
    # write) or "proxy" (an upstream SSO proxy authenticates; a bot token writes).
    mode: oauth
    # admins is the GitHub login allowlist (case-insensitive).
    admins: []
    # trustedOrigins are extra public origins the CSRF guard accepts for write
    # actions, as full origins ("https://dash.example.net") or bare hosts. Needed
    # when a reverse proxy (e.g. Azure Front Door) serves the public hostname but
    # forwards a different Host to the server. In oauth mode the redirect URL's
    # host is trusted automatically, so this is mainly for proxy mode.
    trustedOrigins: []
    # oauth mode settings. clientId is public; clientSecret and sessionKey are
    # held in a Secret (inline here, or reuse one via existingSecret).
    oauth:
      clientId: ""
      clientSecret: ""
      # redirectUrl must match the OAuth App's callback, e.g.
      # https://dashboard.example.com/api/auth/callback
      redirectUrl: ""
      # sessionKey seeds the session-cookie encryption; use a long random value.
      sessionKey: ""
      scope: repo
      existingSecret: ""
    # proxy mode settings.
    proxy:
      # header carries the SSO-authenticated user, e.g. X-Auth-Request-Email.
      header: X-Auth-Request-Email
      # botToken is the GitHub PAT that performs writes (in a Secret).
      botToken: ""
      # secret, when set, is a shared value the proxy must inject in the
      # X-Proxy-Secret header; the backend rejects requests without it. This
      # defends against a client reaching the server directly and spoofing the
      # identity header if network isolation is imperfect. Held in a Secret.
      secret: ""
      existingSecret: ""
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    type: ClusterIP
    port: 80
    # Annotations for the server Service. Use these to configure a cloud
    # LoadBalancer, e.g. restrict a public LB to Azure Front Door only:
    #   service.beta.kubernetes.io/azure-allowed-service-tags: AzureFrontDoor.Backend
    annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: dashboard.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# NetworkPolicy restricting ingress to the server pod. Strongly recommended with
# proxy actions mode, where the server trusts an SSO-proxy identity header: it
# keeps the server reachable only from the proxy, so a client cannot reach the
# server directly and spoof the header. When enabled with no `from` rules, all
# ingress is denied except the healthz port from within the namespace.
networkPolicy:
  enabled: false
  # from is a list of NetworkPolicyPeer entries allowed to reach the server
  # (e.g. the SSO proxy). Example:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: ingress-nginx
  from: []

# Applied to both the fetcher and server pods. The numeric UID/GID match the
# distroless nonroot user; fsGroup makes the shared volume group-writable so the
# non-root fetcher can write to a freshly provisioned PVC.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
