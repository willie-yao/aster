<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="title desc">
  <title id="title">Aster</title>
  <desc id="desc">A forward-facing prow whose counter forms the letter A.</desc>
  <defs>
    <linearGradient id="asterMark" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#7c3aed" />
      <stop offset="1" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <!-- Single evenodd path: the counter is a real hole, so no plate is needed. Still set a contrasting fill. -->
  <path
    d="M32 5.1 60 58.9 32 49.02 4 58.9Z M32 18.32 40.78 38.22 32 34.1 23.22 38.22Z"
    fill="url(#asterMark)"
    fill-rule="evenodd"
  />
</svg>
