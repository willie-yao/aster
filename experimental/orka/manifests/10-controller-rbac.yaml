# The pinned upstream controller registers these controllers, but its chart does
# not grant their CRD permissions. This supplements only the Orka controller
# ServiceAccount. The dashboard analysis ServiceAccount remains Task and
# ConfigMap only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orka-container-test-controller-extra
rules:
  - apiGroups: ["core.orka.ai"]
    resources: ["agentruntimes", "substrateactorpools"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["core.orka.ai"]
    resources: ["agentruntimes/status", "substrateactorpools/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["core.orka.ai"]
    resources: ["agentruntimes/finalizers", "substrateactorpools/finalizers"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orka-container-test-controller-extra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orka-container-test-controller-extra
subjects:
  - kind: ServiceAccount
    name: orka
    namespace: orka-system
