# LLM provider using GitHub Copilot instead of GitHub Models. Copilot has your
# subscription's full context window (no 8k-16k free-tier per-request cap), so
# use this for parity-depth analysis.
#
# Prereq: a fine-grained PAT with the `copilot_chat` user permission (a different
# scope from the `models:read` PAT that GitHub Models uses). Create the secret:
#   kubectl create secret generic copilot-secret -n orka-system \
#     --from-literal=api-key=<YOUR_COPILOT_CHAT_PAT>
#
# baseURL points at the in-cluster header-injecting proxy (50-copilot-proxy.yaml),
# NOT directly at api.githubcopilot.com: Copilot requires a Copilot-Integration-Id
# header that Orka's Provider cannot set on its own.
#
# Directly-at-Copilot alternative (try only if you want to skip the proxy): set
#   baseURL: https://api.githubcopilot.com
# and see whether Orka's requests are accepted; they will likely be rejected for
# the missing Copilot-Integration-Id header, in which case use the proxy above.
apiVersion: core.orka.ai/v1alpha1
kind: Provider
metadata:
  name: copilot
  namespace: orka-system
spec:
  type: openai
  baseURL: http://orka-copilot-proxy.orka-system.svc:8080
  secretRef:
    name: copilot-secret
    key: api-key
  # A model your Copilot plan exposes. Model availability changes over time;
  # claude-sonnet-4.6 exercises Chat Completions fallback, while supported GPT
  # models can exercise Responses depending on your plan.
  defaultModel: claude-sonnet-4.6
