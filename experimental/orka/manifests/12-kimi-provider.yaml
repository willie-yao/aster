# In-cluster open-weight LLM provider: Kimi-K2 served over an OpenAI-compatible
# API by Ray Serve. This is the F1 target: drop the external GitHub Copilot
# dependency (and its de-streaming proxy) in favor of the model that runs
# alongside the cluster. Unlike Copilot's Claude, Kimi returns tool_calls on the
# non-streaming /v1/chat/completions path, so NO proxy is needed.
#
# baseURL: the OpenAI SDK appends /chat/completions to baseURL as-is, so the
# path must end in /v1 to hit Kimi's /v1/chat/completions.
#
# PRODUCTION vs SPIKE:
#   - Production (Orka co-located with the inference stack): point baseURL at the
#     in-cluster Service DNS, e.g.
#       baseURL: http://kimi-0905-serve-svc.default.svc:8000/v1
#   - This spike runs Orka on a separate kind cluster from the h100 model cluster,
#     so baseURL bridges to a `kubectl port-forward --address 0.0.0.0
#     svc/kimi-0905-serve-svc 18000:8000` via the Docker-host alias below. Kind
#     pods reach the host at host.docker.internal (verified).
#
# secretRef is required by the Provider CRD even though Ray Serve here needs no
# auth; kimi-secret holds a throwaway key the endpoint ignores:
#   kubectl create secret generic kimi-secret -n orka-system \
#     --from-literal=api-key=unused
apiVersion: core.orka.ai/v1alpha1
kind: Provider
metadata:
  name: kimi
  namespace: orka-system
spec:
  type: openai
  baseURL: http://host.docker.internal:18000/v1
  secretRef:
    name: kimi-secret
    key: api-key
  defaultModel: moonshotai/Kimi-K2-Instruct-0905
