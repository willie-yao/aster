# Authenticated artifact-tool Deployment and Service. Create the bearer Secret
# before applying this manifest:
#   kubectl create secret generic artifact-tool-auth -n orka-system \
#     --from-literal=token="$(openssl rand -hex 32)"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifact-tool
  namespace: orka-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: artifact-tool}
  template:
    metadata:
      labels: {app: artifact-tool}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: artifact-tool
        image: ghcr.io/willie-yao/prow-ai-dashboard/orka-artifact-tool:main
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8080}]
        env:
        - name: AUTH_TOKEN
          valueFrom:
            secretKeyRef: {name: artifact-tool-auth, key: token}
        # Defaults used when a scoped Tool omits a routing header.
        - name: BUCKET
          value: kubernetes-ci-logs
        - name: BUILD_PREFIX
          value: logs/periodic-cluster-api-provider-azure-e2e-main/2073230525962653696/
        # Per-request response and artifact-read ceilings.
        - name: MODEL_BYTE_BUDGET
          value: "8388608"
        - name: GCS_BYTE_BUDGET
          value: "67108864"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: "1", memory: 512Mi}
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
        livenessProbe:
          httpGet: {path: /healthz, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: artifact-tool
  namespace: orka-system
spec:
  selector: {app: artifact-tool}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: artifact-tool
  namespace: orka-system
spec:
  podSelector:
    matchLabels: {app: artifact-tool}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          orka.ai/task-type: ai
    ports:
    - {protocol: TCP, port: 8080}
