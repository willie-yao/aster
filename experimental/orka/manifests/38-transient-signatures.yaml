# Deterministically checks artifact text for CAPZ transient failure signatures
# from the project system prompt. An analyst calls it before setting
# is_transient=true; the shim scans supplied artifact tails and/or raw text and
# returns the matched transient classes plus evidence lines.
#
# Same SSRF caveat as 30-tools.yaml (Available=false for the in-cluster URL).
apiVersion: core.orka.ai/v1alpha1
kind: Tool
metadata:
  name: check-transient-signatures
  namespace: orka-system
spec:
  description: "Deterministically scan artifact paths and optional raw text for known CAPZ transient failure signatures before setting is_transient. Provide relevant artifact paths relative to the build root, raw text, or both; returns matched transient classes, evidence lines, and unreadable paths."
  http:
    url: http://artifact-tool.orka-system.svc:8080/tool/check_transient_signatures
    method: POST
  parameters:
    type: object
    properties:
      paths:
        type: array
        items:
          type: string
        description: "Optional artifact paths relative to the build root. Each path is scanned from a bounded tail."
      text:
        type: string
        description: "Optional raw log or error text to scan directly."
