# Reports whether a failing test is recurring across this job's recent builds,
# exposed Orka-natively as a deterministic read-only tool. A reviewer agent can
# call it with the exact JUnit test name to see how many recent builds had that
# same test fail, distinguishing recurring systemic failures from one-off flakes.
#
# Same SSRF caveat as 30-tools.yaml (Available=false for the in-cluster URL).
apiVersion: core.orka.ai/v1alpha1
kind: Tool
metadata:
  name: recurrence
  namespace: orka-system
spec:
  description: "Deterministically report how many recent builds of this job had the exact same JUnit test fail. Pass the failing test name and optional count; returns the builds checked, how many failed this test, and the per-build result."
  http:
    url: http://artifact-tool.orka-system.svc:8080/tool/recurrence
    method: POST
    authSecretRef:
      name: artifact-tool-auth
      key: token
    authInject: header
  parameters:
    type: object
    properties:
      test_name:
        type: string
        description: "Exact JUnit test name to check for recurrence."
      count:
        type: integer
        description: "Number of recent builds to scan, default 10 and capped at 15."
    required: [test_name]
