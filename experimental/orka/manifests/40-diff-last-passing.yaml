# Deterministically diff an artifact from the current build against the same
# artifact in the most recent passing run of this periodic job. This gives a
# reviewer or analyst a fast regression signal by showing what changed since the
# last green run, bounded to recent builds and a capped line diff.
#
# Same SSRF caveat as 30-tools.yaml (Available=false for the in-cluster URL).
apiVersion: core.orka.ai/v1alpha1
kind: Tool
metadata:
  name: diff-last-passing
  namespace: orka-system
spec:
  description: "Deterministically compare one artifact in the current build with the same artifact from the most recent passing run of this periodic job. Pass an artifact path relative to the build root, such as build-log.txt; returns the passing build ID and a bounded unified-style diff."
  http:
    url: http://artifact-tool.orka-system.svc:8080/tool/diff_last_passing
    method: POST
    authSecretRef:
      name: artifact-tool-auth
      key: token
    authInject: header
  parameters:
    type: object
    properties:
      path:
        type: string
        description: "Artifact path relative to the build root, such as build-log.txt. The same path must exist in the current and passing builds."
    required: [path]
