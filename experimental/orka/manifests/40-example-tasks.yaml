# Example Tasks.
#
# hello-world: smoke test the provider (Q1). Create AFTER the Provider reports
# Ready, or the first reconcile races and Fails; just re-apply if so.
#
# capz-analyze: a real CAPZ failure investigation using both tool tiers, the
# filesystem tools (30-tools.yaml) and the k8s discovery tools (35-k8s-tools.yaml).
# For a full project-prompt run, set ai.systemPrompt to the consumer's
# prompts/system.md content (see README).
apiVersion: core.orka.ai/v1alpha1
kind: Task
metadata:
  name: hello-world
  namespace: orka-system
spec:
  type: ai
  ai:
    providerRef:
      name: gh-models
    prompt: "Reply with exactly: ORKA_SPIKE_OK"
---
apiVersion: core.orka.ai/v1alpha1
kind: Task
metadata:
  name: capz-analyze
  namespace: orka-system
spec:
  type: ai
  timeout: 5m
  ai:
    providerRef:
      name: gh-models
    model: openai/gpt-4o
    tools:
    - list-artifacts
    - find-artifacts
    - grep-artifact
    - read-artifact
    - tail-artifact
    - discover-clusters
    - find-my-cluster
    - list-cluster-machines
    - list-machine-logs
    - discover-controllers
    - resolve-controller-log
    systemPrompt: |
      You are a CI failure analyst for the Cluster API Provider Azure (CAPZ) project.
      You have read-only tools over one Prow build's GCS artifact tree. All paths are
      relative to the build root. A build runs many specs, each with its own workload
      cluster under artifacts/clusters/. To attribute a failure correctly: call
      find-my-cluster (or discover-clusters and reason about the flavor) BEFORE reading
      per-cluster logs, so you inspect the right cluster's
      artifacts/clusters/<cluster>/azure-activity-logs/<cluster>.log. Investigate before
      concluding. Base every claim on artifact content you actually read; do not guess.
    prompt: |
      This CAPZ e2e build FAILED. Identify the single most likely root cause.
      Steps: (1) find the JUnit XML and identify a failed test name; (2) resolve which
      cluster that test ran against; (3) grep build-log.txt and the right cluster's
      logs for the failure's error lines; (4) give a 3-sentence root-cause summary
      citing the specific artifact paths and error text you used.
---
# Full parity-depth run against Copilot. Requires the Copilot provider + proxy
# (see README "Using GitHub Copilot") and an ai-worker built with a raised
# iteration cap (the default 10 is too low; the evaluation used 30). Reaches the
# engine's investigative depth: discover_clusters -> the -ha cluster's
# azure-activity-logs -> a completed, grounded JSON root cause.
apiVersion: core.orka.ai/v1alpha1
kind: Task
metadata:
  name: capz-copilot
  namespace: orka-system
spec:
  type: ai
  timeout: 10m
  ai:
    providerRef:
      name: copilot
    model: claude-sonnet-4.5
    tools:
    - list-artifacts
    - find-artifacts
    - grep-artifact
    - read-artifact
    - tail-artifact
    - discover-clusters
    - find-my-cluster
    - list-cluster-machines
    - list-machine-logs
    - discover-controllers
    - resolve-controller-log
    systemPrompt: |
      You are a CI failure analyst for the Cluster API Provider Azure (CAPZ) project.
      A CAPZ e2e build runs many specs, each with its own workload cluster under
      artifacts/clusters/. For the AzureSecurityGroupsSpec the cluster is the "-ha"
      flavor. Use discover_clusters to get its exact name, then read its
      artifacts/clusters/<cluster>/azure-activity-logs/<cluster>.log. Be decisive:
      once you have the activity-log evidence, STOP and write your JSON answer.
      Respond with ONLY:
      {"root_cause":"...","severity":"<Low|Medium|High>","is_transient":<true|false>,"suggested_fix":"...","relevant_files":["..."]}
    prompt: |
      This CAPZ E2E test FAILED. Determine the root cause and classify transient vs bug.
      Failed test: [It] Workload cluster creation Creating a highly available cluster
      [REQUIRED] With 3 control-plane nodes and 2 Linux and 2 Windows worker nodes
      Failure location: test/e2e/azure_securitygroups.go:128
      Failure: Timed out after 1200s expecting only "test-security-rule-2" to remain,
      but "test-security-rule" was still present (its deletion never took effect).
      Find why, citing the activity-log paths and timestamps.
