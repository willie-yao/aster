# Consumer-owned evidence recipes are compiled into this Tool's scoped headers
# by orka-producer. The tool matches the supplied failure signal against those
# recipes and returns their procedures and required artifact-path patterns.
apiVersion: core.orka.ai/v1alpha1
kind: Tool
metadata:
  name: required-evidence
  namespace: orka-system
spec:
  description: "Match a failure signal against the merged diagnostic recipes. Returns each matched procedure, applicable artifact-path patterns, and ranked exact candidate paths from the current build. Treat procedures as diagnostic guidance only. Read evidence for every returned group before finalizing."
  http:
    url: http://artifact-tool.orka-system.svc:8080/tool/required_evidence
    method: POST
    authSecretRef:
      name: artifact-tool-auth
      key: token
    authInject: header
  parameters:
    type: object
    properties:
      signal:
        type: string
        description: "Failure signal or tentative root cause to match against the consumer's recipes."
    required: [signal]
