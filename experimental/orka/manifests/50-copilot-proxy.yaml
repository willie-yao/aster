# Reverse proxy that injects the Copilot-Integration-Id header so Orka can reach
# GitHub Copilot's chat-completions API. Orka's Provider forwards the bearer from
# copilot-secret; this proxy adds the header Orka cannot set and forwards to
# api.githubcopilot.com.
#
# Build + load the image into kind first (shared Dockerfile, CMD build-arg):
#   docker build -f experimental/orka/Dockerfile --build-arg CMD=orka-copilot-proxy \
#     -t orka-copilot-proxy:latest backend/
#   kind load docker-image orka-copilot-proxy:latest --name orka-spike
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orka-copilot-proxy
  namespace: orka-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: orka-copilot-proxy}
  template:
    metadata:
      labels: {app: orka-copilot-proxy}
    spec:
      containers:
      - name: proxy
        image: ghcr.io/willie-yao/prow-ai-dashboard/orka-copilot-proxy:main
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8080}]
        # UPSTREAM and COPILOT_INTEGRATION_ID default to api.githubcopilot.com
        # and copilot-developer-cli; override here only if needed.
---
apiVersion: v1
kind: Service
metadata:
  name: orka-copilot-proxy
  namespace: orka-system
spec:
  selector: {app: orka-copilot-proxy}
  ports: [{port: 8080, targetPort: 8080}]
