# RBAC for the isolated container analyzer lifecycle experiment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orka-pipeline
  namespace: orka-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orka-pipeline
  namespace: orka-system
rules:
  - apiGroups: ["core.orka.ai"]
    resources: ["tasks"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orka-pipeline
  namespace: orka-system
subjects:
  - kind: ServiceAccount
    name: orka-pipeline
    namespace: orka-system
roleRef:
  kind: Role
  name: orka-pipeline
  apiGroup: rbac.authorization.k8s.io
