# In-cluster Orka analysis pipeline (H2), as a CronJob. Each run:
#   1. fetch  (engine image): fetcher -ai=false writes the dashboard SKELETON to
#      the shared data volume (jobs/*.json, dashboard.json, ...).
#   2. produce (orka-producer): reads the skeleton, composes the engine prompt,
#      and server-side applies one content-addressed Task per failing test plus
#      project/job/build-scoped header-routed Tools. It writes the private
#      producer-to-ingestor identity manifest before applying. Run-once:
#      re-applying an existing Task is a no-op, so overlapping runs are cheap.
#   3. ingest (orka-ingestor): polls the Orka result API (-wait) until every
#      failing test is analyzed, then patches ai_summary/ai_analysis into the
#      skeleton in place. The server Deployment serves the result unchanged.
#
# This CronJob is the SOLE writer to the data volume for the Orka deploy: run the
# server in read-only mode and do NOT also run the fetcher CronJob or watch
# worker against the same claim (the chart's one-writer invariant).
#
# Prerequisites (create once; see experimental/orka/README):
#   - Images built from experimental/orka/Dockerfile and loaded/pushed:
#       ENGINE_IMAGE          (cmd/fetcher; the main engine image works)
#       orka-producer:<tag>   (--build-arg CMD=orka-producer)
#       orka-ingestor:<tag>   (--build-arg CMD=orka-ingestor)
#   - RBAC: kubectl apply -f 60-pipeline-rbac.yaml
#   - Base Tool CRDs as a ConfigMap the producer clones per build:
#       kubectl create configmap orka-base-tools -n orka-system \
#         --from-file=experimental/orka/manifests/
#   - Consumer project config (project.yaml + prompts/system.md):
#       kubectl create configmap orka-consumer-config -n orka-system \
#         --from-file=project.yaml=<consumer>/project.yaml \
#         --from-file=system.md=<consumer>/prompts/system.md
#   - A ReadWriteMany PVC shared with the server Deployment: prow-ai-dashboard-data
#
# Prompt, model, timeout, retry, and Tool-definition changes invalidate Tasks
# automatically. Bump VERSION for external semantic changes such as a shim-only
# behavior update.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: orka-pipeline
  namespace: orka-system
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 5400
      template:
        spec:
          serviceAccountName: orka-pipeline
          restartPolicy: Never
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: prow-ai-dashboard-data
            - name: base-tools
              configMap:
                name: orka-base-tools
            - name: config
              configMap:
                name: orka-consumer-config
                items:
                  - key: project.yaml
                    path: project.yaml
                  - key: system.md
                    path: prompts/system.md
          initContainers:
            - name: fetch
              image: ghcr.io/willie-yao/prow-ai-dashboard:main
              command: ["/usr/local/bin/fetcher"]
              args:
                - -project-dir=/config
                - -ai=false
                - -out=/data
                - -builds=20
              volumeMounts:
                - { name: data, mountPath: /data }
                - { name: config, mountPath: /config, readOnly: true }
            - name: produce
              image: ghcr.io/willie-yao/prow-ai-dashboard/orka-producer:main
              args:
                - -data=/data
                - -project-dir=/config
                - -tool-manifests=/base-tools
                - -apply
                - -namespace=orka-system
                - -provider=copilot
                - -model=claude-sonnet-4.5
                - -version=v1
                # Enable event-driven ingestion (apply 71-ingestor-webhook.yaml first):
                # - -webhook-url=http://orka-ingestor.orka-system.svc:8080/webhook
              volumeMounts:
                - { name: data, mountPath: /data }
                - { name: config, mountPath: /config, readOnly: true }
                - { name: base-tools, mountPath: /base-tools, readOnly: true }
          containers:
            - name: ingest
              image: ghcr.io/willie-yao/prow-ai-dashboard/orka-ingestor:main
              args:
                - -data=/data
                - -api=http://orka.orka-system.svc:8080
                - -token-file=/var/run/secrets/kubernetes.io/serviceaccount/token
                - -wait=45m
                - -poll=20s
                - -version=v1
                - -provider=copilot
                - -model=claude-sonnet-4.5
                - -namespace=orka-system
                - -pattern-wait=25m
                - -pattern-timeout=10m
                - -pattern-retries=1
                - -gc=true
              volumeMounts:
                - { name: data, mountPath: /data }
