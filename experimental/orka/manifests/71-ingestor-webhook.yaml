# Event-driven ingestion (H3). A long-lived orka-ingestor in -serve mode receives
# Orka's Task completion webhooks and patches each result into the shared data
# volume as its Task finishes, instead of waiting for the next cron ingest.
#
# How it composes with 70-pipeline-job.yaml:
#   - The producer CronJob still writes the SKELETON (fetcher -ai=false) and
#     applies Tasks. Add `-webhook-url=http://orka-ingestor.orka-system.svc:8080/webhook`
#     to the produce step so each Task notifies this receiver on completion. The
#     job's own -wait ingest remains the backstop that re-applies every result
#     from the Orka result store after a skeleton refresh (a fresh skeleton has no
#     AI fields until re-patched); this receiver then keeps them current with low
#     latency between cron runs.
#   - Orka's webhook SSRF guard requires the URL to be a same-namespace ClusterIP
#     Service with a selector, which this Service is. Delivery failures don't fail
#     the Task; Orka retries, so the receiver can roll without losing analyses.
#
# The -version here MUST match the producer's -version (the Task name embeds it);
# bump both together when forcing re-analysis.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orka-ingestor
  namespace: orka-system
  labels:
    app: orka-ingestor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orka-ingestor
  template:
    metadata:
      labels:
        app: orka-ingestor
    spec:
      serviceAccountName: orka-pipeline
      containers:
        - name: ingestor
          image: ghcr.io/willie-yao/prow-ai-dashboard/orka-ingestor:main
          args:
            - -serve
            - -addr=:8080
            - -data=/data
            - -api=http://orka.orka-system.svc:8080
            - -token-file=/var/run/secrets/kubernetes.io/serviceaccount/token
            - -version=v1
            - -model=claude-sonnet-4.6
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: prow-ai-dashboard-data
---
apiVersion: v1
kind: Service
metadata:
  name: orka-ingestor
  namespace: orka-system
spec:
  type: ClusterIP
  selector:
    app: orka-ingestor
  ports:
    - port: 8080
      targetPort: 8080
