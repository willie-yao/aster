<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Aster</title>
  <style>
    /* Lightened stops on dark so the mark holds contrast against a dark tab strip. */
    @media (prefers-color-scheme: dark) {
      .from { stop-color: #a78bfa }
      .to { stop-color: #f472b6 }
    }
  </style>
  <defs>
    <linearGradient id="asterMark" x1="0" y1="0" x2="0.35" y2="1">
      <stop class="from" offset="0" stop-color="#7c3aed" />
      <stop class="to" offset="1" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <!-- Single evenodd path: the counter is a real hole, so the tab background shows through. -->
  <path
    d="M32 5.1 60 58.9 32 49.02 4 58.9Z M32 18.32 40.78 38.22 32 34.1 23.22 38.22Z"
    fill="url(#asterMark)"
    fill-rule="evenodd"
  />
</svg>
